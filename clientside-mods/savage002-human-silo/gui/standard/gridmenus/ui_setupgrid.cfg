exec ui_clear_gridbutton_binds.cfg

ask selection 0
ask isResearching #answer#
set _grid_isResearching #answer#
for _index 0 11 1 "~
	set _grid_queueable 0;~
	set _temp \"exec #gui_basepath#/gridmenus/gridbutton_#grid\"#_index#\"#.cfg\";~
	do _temp;~
	set _temp \"exec #gui_convpath#/gridmenus/gridbutton_#grid\"#_index#\"#.cfg\";~
	do _temp;~
	if [_grid_isResearching & !_grid_queueable] \"set _grid_enable -1\";~
	exec ui_setupgridbutton.cfg;~
	exec ui_setupinfopanel.cfg"

//set the icon of the selected unit, in here for now
ask selection 0
set _tmp #answer#
if [answer != -1] "~
ask objecttype #answer#;~
objedit #answer#;~
objput selectionIcon _image"

// wjd
select unit_closeup_icon_panel:selected_unit_icon
if [!cl_3dLoadout] goto skip3d
param cloneobj #_tmp#
param yaw 0
objput objclass _temp
ask stringsmatch #_temp# building
if [answer] param degps 30
else param degps 0
goto done3d

@skip3d
param cloneobj -1
param image "#_image#

@done3d

exec ui_update_grid_paging.cfg
