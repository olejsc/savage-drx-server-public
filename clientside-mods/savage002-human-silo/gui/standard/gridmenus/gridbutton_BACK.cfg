ask currentDir
set _grid_enable 1
set _grid_caption "Back"
set _grid_command "~
	set _grid_page 0;~
	set _grid_paging_enabled 0;~
	exec #gui_basepath##_previous_grid#;~
	exec $answer$/ui_setupgrid.cfg"
set _grid_tooltip "Return to the previous menu"
set _grid_icon "icons/build_icon"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_back
else setToValue _grid_shortcut grid_hotkey_back
