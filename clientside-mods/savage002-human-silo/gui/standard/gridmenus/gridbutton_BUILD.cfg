ask currentDir
set _grid_enable 1
set _grid_caption "Build"
set _grid_command "~
	set _grid_page 0;~
	set _grid_paging_enabled 1;~
	set _grid_page_last 1;~
	exec $answer$layout_default_worker_build.cfg;~
	exec $answer$ui_setupgrid.cfg"
set _grid_tooltip "Build a structure"
set _grid_icon "icons/build_icon"
set _grid_show_popup 1
set _grid_shortcut B
