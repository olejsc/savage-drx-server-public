if [_grid_paging_enabled] goto paging_enabled

hide commander_grid_paging_panel:grid_page_left
hide commander_grid_paging_panel:grid_page_right
hide commander_grid_paging_panel:grid_page_label
goto done

@paging_enabled
if [_grid_page < 0] set _grid_page 0
if [_grid_page > _grid_page_last] set _grid_page #_grid_page_last#

if [_grid_page <= 0] hide commander_grid_paging_panel:grid_page_left
if [_grid_page > 0] show commander_grid_paging_panel:grid_page_left

if [_grid_page >= _grid_page_last] hide commander_grid_paging_panel:grid_page_right
if [_grid_page < _grid_page_last] show commander_grid_paging_panel:grid_page_right

show commander_grid_paging_panel:grid_page_label
select commander_grid_paging_panel:grid_page_label
if [_grid_page == 0] param text "1/2"
if [_grid_page == 1] param text "2/2"

@done
