objput name _name

objput objclass _tmp
ask stringsmatch melee #_tmp#
if [answer] goto ok
ask stringsmatch weapon #_tmp#
if [answer] goto ok
goto end
@ok

set _temp [_weaponPanelBorder + _weaponPanelCushion]
set _x [~
	_weaponPanelX + _temp + ~
	(_index % _weaponPanelCols) * ~
	(_weaponPanelIconSize + _weaponPanelXSpacing)]
set _y [~
	_weaponPanelY + _temp + ~
	floor (_index / _weaponPanelCols) * ~
	(_weaponPanelIconSize + _weaponPanelYSpacing + _weaponPanelCostCharHeight)]

move weapon_#_name#_panel [_x] [_y]

inc _index

@end
