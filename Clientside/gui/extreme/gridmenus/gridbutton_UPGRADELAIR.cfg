ask selection 0
set _selectionindex #answer#
ask objecttype #answer#
set _name #answer#
objedit #_name#
objput basepointvalue _x

if [_x == 4] "goto setempty"
goto getlevel

@getlevel
set _name beast_lair[_x + 1]
objedit #_name#
objput description _temp
objput tooltip _text
objput icon _image

ask isQueued #_name#
if [answer != -1] goto makedisabled
ask isResearching #_selectionindex#
if [answer == 0] goto testreq
objedit #answer#
objput name _selectionindex
ask stringsMatch #_selectionindex# #_name#
if [answer] goto makedisabled

ask isResearched #_name#
if [answer] goto setempty

//test the requirements
@testreq
ask isResearchable #_name#
echo researchable: #answer#
if [answer] goto makeavailable
goto makedisabled

@setempty
exec #gui_basepath#/gridmenus/gridbutton_EMPTY.cfg
goto end

@makedisabled
set _grid_enable -1
goto done

@makeavailable
set _grid_enable 1
set _grid_queueable 1
goto done

@done
set _grid_caption "$_temp$"
set _grid_command "purchase $_name$"
set _grid_tooltip "$_text$"
set _grid_icon $_image$
set _grid_show_popup 2
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_beast_lair
else setToValue _grid_shortcut grid_hotkey_beast_lair

@end
