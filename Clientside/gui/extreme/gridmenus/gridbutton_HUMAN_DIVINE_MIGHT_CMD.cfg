ask isResearched human_divine_might
if [answer] goto enable
exec #gui_basepath#/gridmenus/gridbutton_EMPTY.cfg
goto end

@enable
set _grid_enable 1
set _grid_caption "Divine Might"
set _grid_command "activateupgrade human_divine_might"
set _grid_tooltip "Grant this unit divine power for a short time (Req: ^g60 Chem^w, ^c60 Elec^w, ^r60 Mag^w)"
set _grid_icon "/gui/extreme/gridmenus/icons/divine_might"
set _grid_show_popup 1
set _grid_shortcut X

@end
