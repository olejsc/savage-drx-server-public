//show endgame_pane

show hall_of_fame_panel
show endgame_map_review
show endgame_chat_box_panel
show endgame_timer
show stats_best_panel
hide stats_team1_panel
hide stats_team2_panel


// Mohican: Reset Map Rating & Comment
set map_comment ""
select endgame_map_review:but_rating1
    param up_image /textures/icons/star-empty.s2g
select endgame_map_review:but_rating2
    param up_image /textures/icons/star-empty.s2g
select endgame_map_review:but_rating3
    param up_image /textures/icons/star-empty.s2g
select endgame_map_review:but_rating4
    param up_image /textures/icons/star-empty.s2g
select endgame_map_review:but_rating5
    param up_image /textures/icons/star-empty.s2g

// Mohican: Get existing review data for this map
GUI_getMapRating #world_name#
GUI_getMapReview #world_name#

// Mohican: Make sure accuracy panel is hidden
cl_showAccuracyEndGame 0

//Mohican: voip panel
panel move "voip_list" 290 508
panel move "voip_control" 283 630
show voip_list

// Update World Name
select hall_of_fame_panel:award_name_map
	param text #world_name#

//select notification_panel:notifications
//  param char_height 20
//  param rows 6

activatechat

//move the vote panel out of the scores screen
move vote_panel 15 10
move vote_commander_panel 15 10
move vote_otherteam_panel 15 97
move vote_otherteam_commander_panel 15 97

clearIEventAssociations
