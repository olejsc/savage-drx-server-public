ask currentDir
set _grid_enable 1
set _grid_caption "Cancel"
set _grid_command "exec #gui_basepath##_previous_grid#;~
	exec #gui_basepath#/gridmenus/ui_setupgrid.cfg"
set _grid_tooltip "Spare this life"
set _grid_icon "icons/cancel"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_kill_cancel
else setToValue _grid_shortcut grid_hotkey_kill_cancel
