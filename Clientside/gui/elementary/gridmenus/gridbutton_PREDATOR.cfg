set _name beast_predator

objedit #_name#
objput description _temp
objput tooltip _text
objput icon _image

ask isResearched #_name#
if [answer] goto hide

ask selection 0
set _selectionindex #answer#
ask isQueued #_name#
if [answer == _selectionindex] goto makedisabled
ask isResearching #_selectionindex#
if [answer == 0] goto testreq
objedit #answer#
objput name _selectionindex
ask stringsMatch #_selectionindex# #_name#
if [answer] goto makedisabled

@testreq
//test the requirements
ask isResearchable #_name#
if [answer] goto makeavailable
goto makedisabled

@hide
exec gridbutton_EMPTY.cfg
goto end

@makedisabled
set _grid_enable -1
goto done

@makeavailable
set _grid_queueable 1
set _grid_enable 1
goto done

@done
set _grid_caption "$_temp$"
set _grid_command "purchase $_name$"
set _grid_tooltip "$_text$"
set _grid_icon $_image$
set _grid_show_popup 2
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_#_name#
else setToValue _grid_shortcut grid_hotkey_#_name#

@end
