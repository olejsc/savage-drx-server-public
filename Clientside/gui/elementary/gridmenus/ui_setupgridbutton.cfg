ask currentDir
if [_index < 0] goto done
if [_index > 11] goto done

select commander_grid_panel:grid#_index#
	param reset
	if [_grid_enable == 0] goto hide
	if [_grid_enable == -1] goto disable
	goto enable

@disable
	show commander_grid_panel:grid#_index#
	param enable false
	if [_grid_show_popup] "~
		param mouseover_command \"~
			set _grid_index $_index$;~
			exec $answer$/ui_setcurrentinfopanel.cfg;~
			show grid_popup_panel;~
			\";~
		param mouseaway_command \"~
			hide grid_popup_panel\""
	//param command #_grid_command#
	param up_image #_grid_icon#.s2g
	param up_hover_image #_grid_icon#_over.s2g
	param down_image #_grid_icon#_down.s2g
	param disable_image #_grid_icon#_notavail.s2g
	//param alt "$_grid_tooltip$"
	select grid#_index#_hotkey
		param text "$_grid_shortcut$"
	goto done

@hide
	param enable false
	hide commander_grid_panel:grid#_index#
	select grid#_index#_hotkey
		param text ""
	goto done

@enable
	show commander_grid_panel:grid#_index#
	param enable true
	if [_grid_show_popup] "~
		param mouseover_command \"~
			set _grid_index $_index$;~
			exec $answer$/ui_setcurrentinfopanel.cfg;~
			show grid_popup_panel\";~
		param mouseaway_command \"hide grid_popup_panel\";~
		param command \"~
			$_grid_command$;~
			exec $answer$/ui_setupgrid.cfg;~
			hide grid_popup_panel\""
	if [!_grid_show_popup] "~
		param command \"~
			$_grid_command$;~
			exec $answer$/ui_setupgrid.cfg;~
			hide grid_popup_panel\""
	param up_image #_grid_icon#.s2g
	param up_hover_image #_grid_icon#_over.s2g
	param down_image #_grid_icon#_down.s2g
	param disable_image #_grid_icon#_notavail.s2g
	//param alt "$_grid_tooltip$"
	
	bind #_grid_shortcut# "$_grid_command$"
	select grid#_index#_hotkey
		param text "$_grid_shortcut$"
	goto done

@done
