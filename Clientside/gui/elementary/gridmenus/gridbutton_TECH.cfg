//determine what the currently selected object can
//build in the slot matching _index
ask selection 0
set _selectionindex #answer#
ask objecttype #answer#
ask buildItem #answer# #_index#
set _name #answer#
ask stringsMatch #_name# ""
if [answer] goto setempty
goto settech

//didn't find anything for this slot
@setempty
exec gridbutton_EMPTY.cfg
goto done

//this slot can build something
@settech
//objloop INCLUDE 1 NOWRAP FORWARD name #_name# "~
//	objput description _temp;~
//	objput tooltip _text;~
//	objput icon _image;~
//	objput objclass _class;~
//	objput isWorker _x;~
//	objbreakloop"
objedit #_name#
objput description _temp
objput tooltip _text
objput icon _image
objput objclass _class
objput isWorker _x

//buildings and workers can be built over and over
if [_x] goto skipresearchedtest
ask stringsMatch #_class# building
if [answer] goto skipresearchedtest

//other things should go away after they are
//researched
ask isResearched #_name#
if [answer] goto setempty
@skipresearchedtest

//if the building is researching, disable all of the buttons
//ask selection 0
//ask isResearching #answer#
//if [answer & !_x] goto makedisabled
//just disable ones which are being researched here
ask isQueued #_name#
if [answer == _selectionindex & !_x] goto makedisabled
ask isResearching #_selectionindex#
if [answer == 0] goto testreq
objedit #answer#
objput name _selectionindex
ask stringsMatch #_selectionindex# #_name#
if [answer & !_x] goto makedisabled

@testreq
//test the requirements
ask isResearchable #_name#
if [answer] goto makeavailable
goto makedisabled

@makedisabled
set _grid_enable -1
set _grid_caption "#_temp#"
set _grid_command "purchase $_name$"
set _grid_tooltip #_text#
set _grid_icon #_image#
set _grid_show_popup 2
if [cl_cmdr_customHotkeys]
	setToValue _grid_shortcut grid_hotkey_#_name#
else
	setToValue _grid_shortcut custom_grid_hotkey_#_name#
goto done

@makeavailable
set _grid_queueable 1
set _grid_enable 1
set _grid_caption "#_temp#"
set _grid_command "purchase $_name$"
set _grid_tooltip #_text#
set _grid_icon #_image#
set _grid_show_popup 2
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_#_name#
else setToValue _grid_shortcut grid_hotkey_#_name#
goto done

@done

