set _grid_enable 1
set _grid_caption "Confirm Demolition!"
set _grid_command "demolish"
set _grid_tooltip "^r>>> Selected structure will be destroyed! <<<"
set _grid_icon "icons/yes"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_kill_confirm
else setToValue _grid_shortcut grid_hotkey_kill_confirm
set _grid_queueable 1	//not really 'queueable', but this lets you use it while building is busy