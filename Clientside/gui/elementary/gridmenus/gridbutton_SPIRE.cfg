set _name beast_spire

objedit #_name#
objput description _temp
objput tooltip _text
objput icon _image

//test the requirements
ask isResearchable #_name#
if [answer] goto makeavailable
goto makedisabled

@makedisabled
set _grid_enable -1
goto done

@makeavailable
set _grid_enable 1
goto done

@done
set _grid_caption "$_temp$"
set _grid_command "purchase $_name$"
set _grid_tooltip "$_text$"
set _grid_icon #_image#
set _grid_show_popup 2
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_spire
else setToValue _grid_shortcut grid_hotkey_spire
