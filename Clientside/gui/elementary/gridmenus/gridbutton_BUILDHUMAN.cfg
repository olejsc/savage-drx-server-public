ask currentDir
set _grid_enable 1
set _grid_caption "Build"
set _grid_command "~
	exec $answer$/human/layout_build.cfg;~
	exec $answer$/ui_setupgrid.cfg"
set _grid_tooltip "Build a structure"
set _grid_icon "icons/build_icon"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_build
else setToValue _grid_shortcut grid_hotkey_build
