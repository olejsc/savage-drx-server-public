// UTTAR: Do this first
set grid_popup_population#_index# ""
set grid_popup_base#_index# ""
set grid_popup_requirements1a#_index# ""
set grid_popup_requirements2a#_index# ""
set grid_popup_requirements3a#_index# ""
set grid_popup_requirements1b#_index# ""
set grid_popup_requirements2b#_index# ""
set grid_popup_requirements3b#_index# ""
set grid_popup_requirements1c#_index# ""
set grid_popup_requirements2c#_index# ""
set grid_popup_requirements3c#_index# ""
set grid_popup_requirementsPa#_index# ""
set grid_popup_requirementsPb#_index# ""
set grid_popup_tech#_index# ""
set grid_popup_costs#_index# ""

if [!_grid_show_popup] goto done
if [_grid_show_popup > 1] goto setuptech

//just the basics
/////////////////
set grid_popup_name#_index# #_grid_caption#
set grid_popup_description#_index# #_grid_tooltip#

goto done

//set up all the extended info for a TECH type button
/////////////////////////////////////////////////////
@setuptech
//ask selection 0
//ask objecttype #answer#
//ask buildItem #answer# #_index#
//set _name #answer#

createvar _desc
objloop INCLUDE 1 NOWRAP FORWARD name #_name# "~
	objput description grid_popup_name#_index#;~
	objput tooltip grid_popup_description#_index#;~
	objput needbasepoints _x;~
	objput needtechpoints _y;~
	objput maxPopulation _z;~
	objput requirement1 _temp1;~
	objput requirement2 _temp2;~
	objput requirement3 _temp3;~
	objput requirement1b _temp1b;~
	objput requirement2b _temp2b;~
	objput requirement3b _temp3b;~
	objput requirement1c _temp1c;~
	objput requirement2c _temp2c;~
	objput requirement3c _temp3c;~
	objput partialText _text;~
	objput partialTextB _textb;~
	objbreakloop"

//base points
/////////////
if [_x > 1] "~
	set grid_popup_base$_index$ \"Requirement: Level $_x$ Stronghold\""
if [_x <= 1] "set grid_popup_base$_index$ \"\""

//tech points
/////////////
if [_y > 0] "~
	set grid_popup_tech$_index$ \"Requirement: $_y$ technology buildings\""
if [_y <= 0] "set grid_popup_tech$_index$ \"\""

//requirements
//////////////
ask stringsmatch $_temp1$ ""
if [answer] goto reqPa
objedit $_temp1$
objput description _temp1
set grid_popup_requirements1a$_index$ "Requirement: $_temp1$"

@req2a
ask stringsmatch $_temp2$ ""
if [answer] goto reqPa
objedit $_temp2$
objput description _temp2
set grid_popup_requirements2a$_index$ "Requirement: $_temp2$"

@req3a
ask stringsmatch $_temp3$ ""
if [answer] goto reqPa
objedit $_temp3$
objput description _temp3
set grid_popup_requirements3a$_index$ "Requirement: $_temp3$"

@reqPa
ask stringsmatch $_text$ ""
if [answer] goto req1b
set grid_popup_requirementsPa$_index$ "Requirement: $_text$"

@req1b
ask stringsmatch $_temp1b$ ""
if [answer] goto reqPb
objedit $_temp1b$
objput description _temp1b
set grid_popup_requirements1b$_index$ "Requirement: $_temp1b$"

@req2b
ask stringsmatch $_temp2b$ ""
if [answer] goto reqPb
objedit $_temp2b$
objput description _temp2b
set grid_popup_requirements2b$_index$ "Requirement: $_temp2b$"

@req3b
ask stringsmatch $_temp3b$ ""
if [answer] goto reqPb
objedit $_temp3b$
objput description _temp3b
set grid_popup_requirements3b$_index$ "Requirement: $_temp3b$"

@reqPb
ask stringsmatch $_textb$ ""
if [answer] goto req1c
set grid_popup_requirementsPb$_index$ "Requirement: $_textb$"

@req1c
ask stringsmatch $_temp1c$ ""
if [answer] goto requirementsdone
objedit $_temp1c$
objput description _temp1c
set grid_popup_requirements1c$_index$ "Requirement: $_temp1c$"

@req2b
ask stringsmatch $_temp2c$ ""
if [answer] goto requirementsdone
objedit $_temp2c$
objput description _temp2c
set grid_popup_requirements2c$_index$ "Requirement: $_temp2c$"

@req3c
ask stringsmatch $_temp3c$ ""
if [answer] goto requirementsdone
objedit $_temp3c$
objput description _temp3c
set grid_popup_requirements3c$_index$ "Requirement: $_temp3c$"

@requirementsdone

//costs
///////
objedit #_name#
objput cost _x stone
objput cost _y gold
set grid_popup_costs$_index$ "Stone: $_x$ ^yGold: $_y$"

//population
////////////
ask isResearched #_name#
if [_z] "set grid_popup_population$_index$ \"Population: $answer$/$_Z$\""
if [!_z] "set grid_popup_population$_index$ \"\""

@done
