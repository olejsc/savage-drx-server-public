set _grid_enable 1
set _grid_caption "Electrify"
set _grid_command "activateupgrade human_electrify"
set _grid_tooltip "Charge this unit's melee weapons"
set _grid_icon "icons/electrify_icon"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_electrify
else setToValue _grid_shortcut grid_hotkey_electrify