set _grid_enable 1
set _grid_caption "Give Gold"
set _grid_command "giveSelectedPlayerMoney 200"
set _grid_tooltip "Give this unit 200 gold"
set _grid_icon "icons/givegold_icon"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_give_gold
else setToValue _grid_shortcut grid_hotkey_give_gold