create panel "endgame_chat_box_panel_e" 15 675

	
create label "endgame_input_target_label" 535 360 660 14
		
	param align right
		
	param char_height 14

	
create textbox "endgame_input_textbox"    5 326 440 40     lobby_chat_msg
	
	param commit_cmd "~
			
	select endgame_input_target_label; 
	param text \"\";~
			
	chatbox say endgame_chat_box_panel:endgame_chat_box #lobby_chat_msg#;~
			
	set lobby_chat_msg \"\"
		
	param abort_cmd "~
			
	select endgame_input_target_label; 
	param text \"\";~
			
	set lobby_chat_msg \"\"
		
	param border 0
		
	param char_height 14
		
	param interactive 0
		
	param keepInput 0

	
create chatbox "endgame_chat_box" 5 -4 480 [23 * 14]
	
	param type public
		
	param delay_secs 0
		
	param char_height 14
		
	param rows 30
		
	param audible 0

	set _x 0

	set _y -5

	set _border 4

	set _width 480

	set _height 330

	set _image human

	set _variation 1


create panel "endgame_n" 160 321 

  create label player_n 0 7 200 24
    param text "TeST:"
    param char_height 16
    param shadow 1
    param align left