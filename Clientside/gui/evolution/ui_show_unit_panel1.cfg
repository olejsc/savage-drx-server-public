objput name _name
objput playercost _cost

//make sure this unit is valid
//if unit is not valid, completely ignore this call
objput playerCost _temp
if [_temp < 0] goto end

//check if the unit has been researched
//unresearched units are hidden, that's it
ask isTypeResearching #_name#
set _researching [answer]

if [g_allUnitsAvailable] "set _researched 1; goto skipresearchtest"
ask isResearched #_name#
set _researched #answer#
if [_researched] set _researching 0
if [_researched] goto skipresearchtest
if [!_researching] "hide item_#_name#_panel; goto done"

@skipresearchtest

//set up the vital info here, it may be altered as necessary,
//but it is important to have as a base to work from

showifhidden unit_#_name#_panel
hide unit_#_name#_panel:request

select unit_#_name#_panel:buy
  if [!_researched] param interactive 0
  else param interactive 1
	param sound /sound/general/buy.wav
	param alt ""
	param enable true
select unit_#_name#_panel:bgbuy
  if [!_researched & _researching] "param alpha 0.3; param animstate death_generic"
  else "param alpha 1; param animstate idle"
select unit_#_name#_panel:name
	param textcolor 1 1 1

	if [_researching] "~
  show unit_#_name#_panel:bgbuy;~
  show unit_#_name#_panel:buy;~
  show unit_#_name#_panel:name;~
  hide unit_#_name#_panel:request;~
  goto done"

show unit_#_name#_panel:name

//can the unit be produced?
if [g_allUnitsAvailable] goto skipavailabletest
ask isAvailable #_name#
if [!answer] "~
	select unit_#_name#_panel:buy;~
	param enable false;~
	param alt \"This unit cannot be produced\";~
	hide unit_#_name#_panel:request;~
	select unit_#_name#_panel:name;~
	param textcolor .2 .2 .2;~
	select unit_#_name#_panel:rtime;~
	param textcolor .2 .2 .2;~
	goto done"
select unit_#_name#_panel:rtime
	param textcolor 1 1 1
@skipavailabletest

//does the player have this unit already?
//if so, black it out
ask stringsmatch #player_currentunit# #_name#
if [answer] goto hasthisunit

//can the player afford this unit?
if [_cost > player_potentialmoney] "goto needmoney"
goto done

//adjust the button to show we are purchasing ammo
@hasthisunit
hide unit_#_name#_panel
goto done

@needmoney
select unit_#_name#_panel:buy
	param enable false
show unit_#_name#_panel:request
goto done

@done
inc _index 1

@end