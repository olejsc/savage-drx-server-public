
//=============================================================================================
// Modify Background Image
select unit_select_background:unit_select_bg_graphic
  param image #gui_convpath#/nfm_unit_select.s2g
//=============================================================================================
          

//=============================================================================================
//Unit panel
//
//All the formatting can be done by changing the value of these cvars
//=============================================================================================
createvar _unitPanelBorder 16

createvar _unitPanelXCushion 0
createvar _unitPanelYCushion 0

createvar _unitPanelCols 7
createvar _unitPanelRows 1

createvar _unitPanelIconWidth 48
createvar _unitPanelIconHeight 64
createvar _unitPanelXSpacing 11
createvar _unitPanelYSpacing 16

createvar _unitPanelNameCharHeight 8
createvar _unitPanelCostCharHeight 18

createvar _unitPanelRequestWidth [_unitPanelIconWidth * 0.8]
createvar _unitPanelRequestHeight [_unitPanelIconHeight / 4]

createvar _unitPanelTabWidth 128
createvar _unitPanelTabHeight [_unitPanelTabWidth / 2]

//width and height are determined automatically
set _temp [(_unitPanelBorder * 2)]
createvar _unitPanelWidth [_temp + (_unitPanelXCushion * 2) + _unitPanelCols ~
		* (_unitPanelIconWidth + _unitPanelXSpacing) - _unitPanelXSpacing]
createvar _unitPanelHeight [_temp + (_unitPanelYCushion * 2) + _unitPanelRows ~
		* (_unitPanelIconHeight + _unitPanelYSpacing + _unitPanelCostCharHeight + _unitPanelNameCharHeight) ~
		- _unitPanelYSpacing]

createvar _unitPanelX 547	
createvar _unitPanelY 40
//=============================================================================================
// wjd modified //extreme modified
set _index 0; objloop INCLUDE 1 NOWRAP FORWARD objclass "unit" race human isWorker 0 maxRiders 10 "exec /gui/standard/ui_create_unit_panel.cfg"
set _index 0; objloop INCLUDE 1 NOWRAP FORWARD objclass "unit" race beast isWorker 0 maxRiders 10 "exec /gui/standard/ui_create_unit_panel.cfg"
