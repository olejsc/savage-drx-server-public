objput name _name
objput objclass _tmp
ask stringsmatch melee #_tmp#
if [answer] goto melee
ask stringsmatch weapon #_tmp#
if [answer] goto ok
goto end

///////////////
// Samurai Wars

@melee
// Update Current Weapon CVar
ask isInInventory #_name#
if [answer] "set _Player_CurrentMelee #_name#"

@ok
objput techType _weapon_techType

ask stringsMatch #_player_techType# #_weapon_techType#
if [answer] goto end

select weapon_#_name#_panel:buy
  param enable false
  param alt "This unit cannot use this equipment"
select weapon_#_name#_panel:cost
  param textcolor .2 .2 .2
select weapon_#_name#_panel:name
  param textcolor .2 .2 .2
select weapon_#_name#_panel:ammo
  param textcolor .2 .2 .2
hide weapon_#_name#_panel:request

@end


// end Samurai Wars
