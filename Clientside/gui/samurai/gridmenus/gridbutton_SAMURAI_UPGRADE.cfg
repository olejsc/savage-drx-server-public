ask selection 0
ask objecttype #answer#
set _name #answer#
objedit #_name#
objput basepointvalue _x

if [_x == 3] "goto setempty"
goto getlevel

@setempty
exec #gui_basepath#/gridmenus/gridbutton_EMPTY.cfg
goto done

@getlevel
set _name human_castle[_x + 1]
objedit #_name#
objput description _temp
objput tooltip _text
objput icon _image

//test the requirements
ask isResearchable #_name#
echo researchable: #answer#
if [answer] goto makeavailable
goto makedisabled

@makedisabled
set _grid_enable -1
goto done

@makeavailable
set _grid_enable 1
goto done

@done
set _grid_caption "$_temp$"
set _grid_command "purchase $_name$"
set _grid_tooltip "$_text$"
set _grid_icon $_image$
set _grid_show_popup 2
set _grid_shortcut A
