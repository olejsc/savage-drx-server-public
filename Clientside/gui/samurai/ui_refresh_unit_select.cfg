exec #gui_basepath#/ui_refresh_unit_select.cfg

// This is used in ui_show_*_panel.cfg
objedit #player_currentunit#
objput techType _player_techType

// Reset Melee Weapon
set _Player_CurrentMelee ""

// Check weapon and unit panels
objloop INCLUDE 1 NOWRAP FORWARD race #player_racename# "exec #gui_convpath#/ui_show_weapon_panel.cfg"
set _index 0
objloop INCLUDE 1 NOWRAP FORWARD objclass unit race #player_racename# "exec #gui_convpath#/ui_show_unit_panel.cfg"

