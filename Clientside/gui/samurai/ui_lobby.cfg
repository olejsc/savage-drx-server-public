
// Samurai Wars: Modify Background Images
select 3lobby_panel:lobby_background
	param image #gui_convpath#/nfm_lobby_background.s2g
	
// Create Panels for Tech Tree & Credits
exec #gui_convpath#/ui_create_tech_panel.cfg
exec #gui_convpath#/ui_create_credits_panel.cfg
panel focus samurai_tech_panel  
panel focus samurai_credits_panel 
	
// Show Tech & Credits Button
show 3lobby_panel:tech_button
select 3lobby_panel:tech_button
	param command "fadein samurai_tech_panel 100"
	
show 3lobby_panel:credits_button
select 3lobby_panel:credits_button
	param command "fadein samurai_credits_panel 100"
	