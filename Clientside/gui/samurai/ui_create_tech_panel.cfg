//======================================================================================
// Samurai Tech Tree Panel
//======================================================================================

set _width 562
set _height 768
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

create panel samurai_tech_panel [_x] [_y]
  create titlebar votepanel_title 0 0 [_width] 16
    on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
    on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
    param title "Samurai Wars XR Tech Tree"
    param hide_cmd "hide samurai_tech_panel"

set _x 0
set _y 16
set _border 3
set _width 562
set _height 752
set _image human
exec /gui/standard/ui_frame.cfg 
	
  create graphic samurai_tech_panel_img 0 16 [_width] [_height]
  param image #gui_convpath#/samurai_tech_tree.tga
  param alpha .9
  
  
