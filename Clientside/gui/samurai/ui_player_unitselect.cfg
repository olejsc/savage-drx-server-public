
//=============================================================================================
// Samurai Wars Variables
createvar _Samurai_UnitLevel
createvar _Player_CurrentMelee
createvar _player_techType
createvar _weapon_techType
//=============================================================================================



//=============================================================================================
// Modify Background Image
select unit_select_background:unit_select_bg_graphic
  param image #gui_convpath#/nfm_unit_select.s2g
//=============================================================================================
          

          
//=============================================================================================
//Weapon panel
//
//All the formatting can be done by changing the value of these cvars
//=============================================================================================
createvar _weaponPanelX 69
createvar _weaponPanelY 32
createvar _weaponPanelBorder 0

createvar _weaponPanelCushion 25

createvar _weaponPanelCols 3
createvar _weaponPanelRows 3

createvar _weaponPanelIconSize 48
createvar _weaponPanelXSpacing 39
createvar _weaponPanelYSpacing 24
createvar _weaponPanelCostCharHeight 14
createvar _weaponPanelNameCharHeight 12
createvar _weaponPanelAmmoCharHeight 18

createvar _weaponPanelRequestWidth [_weaponPanelIconSize]
createvar _weaponPanelRequestHeight [_weaponPanelIconSize / 3]

createvar _weaponPanelTabWidth 128
createvar _weaponPanelTabHeight [_weaponPanelTabWidth / 2]

//width and height are calculated automatically
set _temp [(_weaponPanelBorder * 2) + (_weaponPanelCushion * 2)]
createvar _weaponPanelWidth [_temp + _weaponPanelCols ~
    * (_weaponPanelIconSize + _weaponPanelXSpacing) - _weaponPanelXSpacing]
createvar _weaponPanelHeight [_temp + _weaponPanelRows ~
    * (_weaponPanelIconSize + _weaponPanelYSpacing + _weaponPanelCostCharHeight) ~
    - _weaponPanelYSpacing]
//=============================================================================================
set _index 0; objloop INCLUDE 1 NOWRAP FORWARD race human "objput playercost _temp; if [_temp >= 0] exec #gui_convpath#/ui_create_weapon_panel.cfg"
//=============================================================================================
    
    
    
//=============================================================================================
//Item panel
//
//All the formatting can be done by changing the value of these cvars
//=============================================================================================
createvar _itemPanelBorder 16

createvar _itemPanelXCushion 24
createvar _itemPanelYCushion 8

createvar _itemPanelCols 4
createvar _itemPanelRows 2

createvar _itemPanelIconSize 48
createvar _itemPanelXSpacing 39
createvar _itemPanelYSpacing 32
createvar _itemPanelCostCharHeight 14
createvar _itemPanelNameCharHeight 12
createvar _itemPanelAmmoCharHeight 18

createvar _itemPanelRequestWidth [_itemPanelIconSize]
createvar _itemPanelRequestHeight [_itemPanelIconSize / 3]

createvar _itemPanelTabWidth 128
createvar _itemPanelTabHeight [_itemPanelTabWidth / 2]

//width and height are determined automatically
set _temp [(_itemPanelBorder * 2)]
createvar _itemPanelWidth [_temp + (_itemPanelXCushion * 2) + _itemPanelCols ~
    * (_itemPanelIconSize + _itemPanelXSpacing) - _itemPanelXSpacing]
createvar _itemPanelHeight [_temp + (_itemPanelYCushion * 2) + _itemPanelRows ~
    * (_itemPanelIconSize + _itemPanelYSpacing + _itemPanelCostCharHeight) ~
    - _itemPanelYSpacing]

createvar _itemPanelX 54
createvar _itemPanelY 358
//=============================================================================================
set _index 0; objloop INCLUDE 1 NOWRAP FORWARD objclass item race human "exec #gui_convpath#/ui_create_item_panel.cfg"
//=============================================================================================



//=============================================================================================
//Unit panel
//
//All the formatting can be done by changing the value of these cvars
//=============================================================================================
createvar _unitPanelBorder 16

createvar _unitPanelXCushion 8
createvar _unitPanelYCushion 0

createvar _unitPanelCols 6
createvar _unitPanelRows 1

createvar _unitPanelIconWidth 64
createvar _unitPanelIconHeight 64
createvar _unitPanelXSpacing 6
createvar _unitPanelYSpacing 16

createvar _unitPanelNameCharHeight 12
createvar _unitPanelCostCharHeight 18

createvar _unitPanelRequestWidth [_unitPanelIconWidth * 0.8]
createvar _unitPanelRequestHeight [_unitPanelIconHeight / 4]

createvar _unitPanelTabWidth 128
createvar _unitPanelTabHeight [_unitPanelTabWidth / 2]

//width and height are determined automatically
set _temp [(_unitPanelBorder * 2)]
createvar _unitPanelWidth [_temp + (_unitPanelXCushion * 2) + _unitPanelCols ~
    * (_unitPanelIconWidth + _unitPanelXSpacing) - _unitPanelXSpacing]
createvar _unitPanelHeight [_temp + (_unitPanelYCushion * 2) + _unitPanelRows ~
    * (_unitPanelIconHeight + _unitPanelYSpacing + _unitPanelCostCharHeight + _unitPanelNameCharHeight) ~
    - _unitPanelYSpacing]

createvar _unitPanelX 545
createvar _unitPanelY 33
//=============================================================================================
objloop INCLUDE 1 NOWRAP FORWARD objclass "unit" isWorker 0 "exec #gui_convpath#/ui_create_unit_panel.cfg"
//=============================================================================================
    
    

//=============================================================================================
// Hack to spawn Units with different Melee Attacks
select unit_select_buttons:spawn
  param command  "unit #player_currentunit#_#_Player_CurrentMelee#;~
				  objedit #player_currentunit#;~
				  objput level _Samurai_UnitLevel;~
				  if [_Samurai_UnitLevel < 3 | player_level >= _Samurai_UnitLevel] \"spawnfrom -1; cl_showLoadout 0\""
//=============================================================================================
