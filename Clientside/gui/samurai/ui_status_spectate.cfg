exec #gui_basepath#/ui_status_spectate.cfg


// Samurai Wars: Modify Blessings Images

select team_status_panel:team_status_resource1_icon
  param image #gui_convpath#/gridmenus/icons/blessing_heal.s2g
select team_status_panel:team_status_resource1_label
  param cvar resource_heal
  param text_color 0 1 0

select team_status_panel:team_status_resource2_icon
  param image #gui_convpath#/gridmenus/icons/blessing_wind.s2g
select team_status_panel:team_status_resource2_label
  param cvar resource_wind
  param text_color 0 1 1

select team_status_panel:team_status_resource3_icon
  param image #gui_convpath#/gridmenus/icons/blessing_war.s2g
select team_status_panel:team_status_resource3_label
  param cvar resource_war
  param text_color 1 0 0
  
// Modify Base and Worker Images

select team_status_panel:base_icon
  param image /models/samurai/buildings/icons/keep.s2g
  
select team_status_panel:team_worker_icon 
  param image /models/samurai/units/peasant/peasant.s2g
