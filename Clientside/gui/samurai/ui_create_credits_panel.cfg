//======================================================================================
// Samurai Tech Tree Panel
//======================================================================================

set _width 683
set _height 528
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

create panel samurai_credits_panel [_x] [_y]
  create titlebar votepanel_title 0 0 [_width] 16
    on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
    on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
    param title "Samurai Wars XR Credits"
    param hide_cmd "hide samurai_credits_panel"
	
set _x 0
set _y 16
set _border 3
set _width 683
set _height 512
set _image human
exec /gui/standard/ui_frame.cfg 

  create button samurai_credits_panel_page1 560 490 35 25
		param up_image /gui/standard/small_button.tga
		param up_hover_image /gui/standard/small_button_over.tga
		param down_image /gui/standard/small_button_down.tga
		param sound /gui/standard/sfx/building_place.wav
		param command "select samurai_credits_panel:samurai_credits_panel_img;~
					   param image /gui/samurai/samurai_credits_1.tga"
		param text "Pg1"

  create button samurai_credits_panel_page2 600 490 35 25
		param up_image /gui/standard/small_button.tga
		param up_hover_image /gui/standard/small_button_over.tga
		param down_image /gui/standard/small_button_down.tga
		param sound /gui/standard/sfx/building_place.wav
		param command "select samurai_credits_panel:samurai_credits_panel_img;~
					   param image /gui/samurai/samurai_credits_2.tga"
		param text "Pg2"

  create button samurai_credits_panel_page3 640 490 35 25
		param up_image /gui/standard/small_button.tga
		param up_hover_image /gui/standard/small_button_over.tga
		param down_image /gui/standard/small_button_down.tga
		param sound /gui/standard/sfx/building_place.wav
		param command "select samurai_credits_panel:samurai_credits_panel_img;~
					   param image /gui/samurai/samurai_credits_3.tga"
		param text "Pg3"
		
  create graphic samurai_credits_panel_img 0 16 [_width] [_height]
  param image #gui_convpath#/samurai_credits_1.tga
  param alpha 1
  

		
  
  
