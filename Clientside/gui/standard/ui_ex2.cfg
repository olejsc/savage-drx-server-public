// EX2 GUI additions

//=============================================================================================
// Researched weapons/items panel
//=============================================================================================
set _z 48
set _gap 4
set _x 0
set _y [_gap]
set _index 0
set _temp 0
set _race human
set _max 3
create panel #_race#_researched_panel 50 200
  set _showmonastery 1
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass unit "exec /gui/standard/ui_researched_object.cfg"
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass melee builder1 human_monastery "exec /gui/standard/ui_researched_object.cfg"
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass weapon builder1 human_monastery "exec /gui/standard/ui_researched_object.cfg"
  set _showmonastery 0
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass weapon "exec /gui/standard/ui_researched_object.cfg"
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass item "exec /gui/standard/ui_researched_object.cfg"

  create graphic bgl 0 0 [_gap] [_y + !!_temp*(_z + _gap)]
    on show "ask isCommander;~
             if [answer] move human_researched_panel 50 100;~
             else move human_researched_panel 50 200"
    param alpha 0.7
    param image black.s2g
    
  create graphic bgt [_gap] 0 [_z * 4 + _gap * 4] [_gap]
    param alpha 0.7
    param image black.s2g

set _z 48
set _gap 4
set _x 0
set _y [_gap]
set _index 0
set _temp 0    
set _race beast
set _max 3
create panel #_race#_researched_panel 50 200
  set _showsanctuary 1
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass unit "exec /gui/standard/ui_researched_object.cfg"
  set _meleeweapsonly 1
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# builder1 beast_sanctuary "exec /gui/standard/ui_researched_object.cfg"
  set _showsanctuary 0
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# "exec /gui/standard/ui_researched_object.cfg"
  set _meleeweapsonly 0
  objloop INCLUDE 1 NOWRAP FORWARD race #_race# objclass item "exec /gui/standard/ui_researched_object.cfg"

  create graphic bgl 0 0 [_gap] [_y + !!_temp*(_z + _gap)]
    on show "ask isCommander;~
             if [answer] move beast_researched_panel 50 100;~
             else move beast_researched_panel 50 200"
    param alpha 0.7
    param image black.s2g
    
  create graphic bgt [_gap] 0 [_z * 4 + _gap * 4] [_gap]
    param alpha 0.7
    param image black.s2g

    
