// aAR vars
objloop INCLUDE 1 NOWRAP FORWARD "~
	objput playercost _cost;~
	objput name _name;~
	if [_cost > 0] createvar cl_cmdr_aAR_#_name# 1"
// set buffs to 2 (officer only)
objloop INCLUDE 1 NOWRAP FORWARD objclass upgrade "~
	objput name _name;~
	set cl_cmdr_aAR_#_name# 2"

//creates panels for SEP_aAR
create panel SEP_aAR_panel 5 70

	set _x 0
	set _y 0
	set _width 170
	set _height 172
	set _border 4
	set _image human
	exec /ui_frame.cfg
	
	create button unit_button 144 7 16 16
	on show "select SEP_aAR_panel:unit_button;~
		if [cl_cmdr_aAR_units==-2] param up_image /gui/standard/downarrow.s2g;~
		if [cl_cmdr_aAR_units==-1] param up_image /textures/cursors/unknown.s2g;~
		if [cl_cmdr_aAR_units==0] param up_image /gui/standard/gridmenus/icons/cancel.s2g;~
		if [cl_cmdr_aAR_units==1] param up_image /gui/standard/gridmenus/icons/yes.s2g;~
		if [cl_cmdr_aAR_units==2] param up_image /gui/standard/gridmenus/icons/promote_#player_racename#.s2g"
	param command "inc cl_cmdr_aAR_units;~
		ask iskeydown ctrl; if [answer] set cl_cmdr_aAR_units -1;~
		else \"ask iskeydown shift; if [answer] set cl_cmdr_aAR_units -2;~
		else if [cl_cmdr_aAR_units <= 0] set cl_cmdr_aAR_units 1;~
		else if [cl_cmdr_aAR_units > 2] set cl_cmdr_aAR_units 0\"; show SEP_aAR_panel;~
		show SEP_aAR_#player_racename#U:disabled"
	param rcommand "inc cl_cmdr_aAR_units -1;~
		ask iskeydown ctrl; if [answer] set cl_cmdr_aAR_units -1;~
		else \"ask iskeydown shift; if [answer] set cl_cmdr_aAR_units -2;~
		else if [cl_cmdr_aAR_units <= -2] set cl_cmdr_aAR_units 0;~
		else if [cl_cmdr_aAR_units < 0] set cl_cmdr_aAR_units 2\"; show SEP_aAR_panel;~
		show SEP_aAR_#player_racename#U:disabled"

	create button unit_label 35 7 100 16
		param text Units
