set _x 0
set _y 0
set _border 8
set _width 220
set _height 70
set _image human
set _z 24

// wjd modified y coord
create panel request#_index#_panel 0 [67 + (_index - 1) * _height]

	create label text1 [_border] [_border] 0 0
		param text "Request from:"
		param char_height 12
		param align left
	create label request#_index#_client [_border + 95] [_border] 0 0
		param cvar cl_cmdr_request#_index#_client 
		param char_height 12
		param align left

	create label text2 [_border] [_border + 12] 0 0
		param text "Requesting:"
		param char_height 12
		param align left
	create label request#_index#_object [_border + 80] [_border + 12] 0 0
		param cvar cl_cmdr_request#_index#_description
		param char_height 12
		param align left

	create label text3 [_border] [_border + 24] 0 0
		param text "Cost:"
		param char_height 12
		param align left
	create label request#_index#_money [_border + 40] [_border + 24] 0 0
		param cvar cl_cmdr_request#_index#_money
		param char_height 12
		param align left

	create label text4 [_border] [_border + 36] 0 0
		param text "Time left:"
		param char_height 12
		param align left
	create label request#_index#_time [_border + 70] [_border + 36] 0 0
		param cvar cl_cmdr_request#_index#_time
		param char_height 12
		param align left

	create button request#_index#_approve [_width - _border - 2 * 2 - _z * 2] [_height - _border - 2 - _z] [_z] [_z]
		param up_image /gui/standard/gridmenus/icons/yes.s2g
		param command "approve #cl_cmdr_request$_index$_clientnum#"

	create button request#_index#_deny [_width - _border - 2 - _z] [_height - _border - 2 - _z] [_z] [_z]
		param up_image /gui/standard/gridmenus/icons/cancel.s2g
		param command "decline #cl_cmdr_request$_index$_clientnum#"

	exec ui_frame.cfg
//darkened background as it can pop-up over other menus (was 0.3) and changed 
//	interactive param so non-visible buttons cannot be clicked
	create graphic background 0 0 [_width] [_height]
		param image black.s2g
		param alpha 1.0
		param interactive 1
