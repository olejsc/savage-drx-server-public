set _x 3
set _y 3

create panel player_build_request_panel 750 550
  for _index 0 [(_x * _y) - 1] 1 "create button request#_index# ~
    [(56 * (_index % _x))] ~
    [(56 * floor (_index / _x))] ~
    48 48"

select player_build_request_panel:request0
  param command "chatCommander \"Build a Garrison here!\";~
    hide player_build_request_panel;~
    set ui_showPlayerBuildRequest 0;~
    mouserecenter"
  param up_image /models/human/buildings/icons/garrison.s2g
  param down_image /models/human/buildings/icons/garrison_down.s2g
  param disable_image /models/human/buildings/icons/garrison_notavail.s2g
  param up_hover_image /models/human/buildings/icons/garrison_over.s2g

select player_build_request_panel:request1
  param command "chatCommander \"Build a Tower here!\";~
    hide player_build_request_panel;~
    set ui_showPlayerBuildRequest 0;~
    mouserecenter"
  param up_image /models/human/buildings/icons/arrow_tower.s2g
  param down_image /models/human/buildings/icons/arrow_tower_down.s2g
  param disable_image /models/human/buildings/icons/arrow_tower_notavail.s2g
  param up_hover_image /models/human/buildings/icons/arrow_tower_over.s2g

select player_build_request_panel:request2
  param command "chatCommander \"I am defending this position!\";~
    hide player_build_request_panel;~
    set ui_showPlayerBuildRequest 0;~
    mouserecenter"
  param up_image gridmenus/icons/guard.s2g
  param down_image gridmenus/icons/guard_down.s2g
  param disable_image gridmenus/icons/guard_notavail.s2g
  param up_hover_image gridmenus/icons/guard_over.s2g

select player_build_request_panel:request3
  param command "chatCommander \"I'm attacking the enemy!\";~
    hide player_build_request_panel;~
    set ui_showPlayerBuildRequest 0;~
    mouserecenter"
  param up_image gridmenus/icons/attack_icon.s2g
  param down_image gridmenus/icons/attack_icon_down.s2g
  param disable_image gridmenus/icons/attack_icon_notavail.s2g
  param up_hover_image gridmenus/icons/attack_icon_over.s2g

select player_build_request_panel:request4
  param command "hide player_build_request_panel;~
    set ui_showPlayerBuildRequest 0;~
    mouserecenter"
  param up_image enemy.png
  param down_image enemy.png
  param disable_image enemy.png
  param up_hover_image enemy.png

hide player_build_request_panel:request5
hide player_build_request_panel:request6
hide player_build_request_panel:request7
hide player_build_request_panel:request8

hide player_build_request_panel
set ui_showPlayerBuildRequest 0
