if [sv_SEPVersion < 1001] goto done
if [!sv_enableSquads] goto done

set Squad_MembersIndex 0

// Hide all Block by defaults
for _block 0 5 1 "~
	hide player_squad_panel:block#_block#_name;~
	hide player_squad_panel:block#_block#_officer;~
	hide player_squad_panel:block#_block#_dead;~
	hide player_squad_panel:block#_block#_health;~
	hide player_squad_panel:block#_block#_unit;~
	hide player_squad_panel:block#_block#_item0;~
	hide player_squad_panel:block#_block#_item1;~
	hide player_squad_panel:block#_block#_item2;~
	hide player_squad_panel:block#_block#_item3;~
	hide player_squad_panel:block#_block#_item4;~
	hide player_squad_panel:block#_block#_bg"

// Update current Squad Selection
ask Squad_Index
set Squad_Index #answer#
if [cl_resourcesPanel==1] goto minimal
if [cl_resourcesPanel==4] goto smoke
if [cl_resourcesPanel==2] goto hires
if [cl_resourcesPanel==3] goto legacy

@smoke
move player_squad_panel:squad_selection [15+(Squad_Index-1)*16] 5
if [!Squad_Index] "move player_squad_panel:squad_selection 127 5"
goto hudsdone

@minimal
move player_squad_panel:squad_selection [15+(Squad_Index-1)*16] 5
if [!Squad_Index] "move player_squad_panel:squad_selection 127 5"
goto hudsdone

@hires
move player_squad_panel:squad_selection [15+(Squad_Index-1)*16] 5
if [!Squad_Index] "move player_squad_panel:squad_selection 127 5"
goto hudsdone

@legacy
move player_squad_panel:squad_selection [14+(Squad_Index-1)*16] 5
if [!Squad_Index] "move player_squad_panel:squad_selection 126 5"
goto hudsdone

@hudsdone

////////////////////////////////
// Squad Missions
if [Squad_Index] "~
	show player_squad_panel:mission_button;~
	show player_squad_panel:mission_label"
else "~
	hide player_squad_panel:mission_button;~
	hide player_squad_panel:mission_label"

// Update Label
select player_squad_panel:mission_label
	param cvar squad_mission#Squad_Index#

// Update Button functionality if Officer
ask clientNum
ask isOfficer #answer#
set _isOfficer #answer#
select player_squad_panel:mission_button
if [_isOfficer] "~
	param text Mission;~
	param align center;~
	param up_image /gui/standard/small_button.s2g;~
	resize player_squad_panel:mission_button 34 16;~
	param command \"voicemission\""
else "~
	param text ^yMission:;~
	param up_image \"\";~
	param command \"\""

////////////////////////////////
// Should the Squad Member Blocks be Visible?
if [!cl_show_squad] goto done

// Retrieve Num of Members in our Squad
ask Squad_NumMembers
set Squad_NumMembers #answer#


///////////////////
// Squad Block #0
if [Squad_MembersIndex == Squad_NumMembers] goto done
set _block 0
show player_squad_panel:block#_block#_bg

// Update Block Name
show player_squad_panel:block#_block#_name
ask Squad_MemberName #Squad_MembersIndex#
select player_squad_panel:block#_block#_name
param text #answer#

// Update Officer Status
ask Squad_MemberOfficer #Squad_MembersIndex#
if [answer == 1] show player_squad_panel:block#_block#_officer

// Update Dead Status
if [squad_healthpercent0 == 0] show player_squad_panel:block#_block#_dead

// Update Unit Image
show player_squad_panel:block#_block#_unit
ask Squad_MemberUnit #Squad_MembersIndex#
set _name #answer#
ask stringsmatch #_name# ""
select player_squad_panel:block#_block#_unit
if [answer] param image /textures/icons/sfe.s2g
if [!answer] "~
	objedit #_name#;~
	objput icon _image;~
	param image #_image#.s2g"

// Show Detailed Info?
select player_squad_panel:block#_block#_bg
if [cl_show_squad < 2] "param image /textures/squads/squad_member_inventory.s2g"
else "param image /textures/squads/squad_member.s2g; goto block1"

// Update Block Health
show player_squad_panel:block#_block#_health

// Update Inventory Images
for _index 0 4 1 "~
	show player_squad_panel:block#_block#_item#_index#;~
	ask Squad_MemberItem #Squad_MembersIndex# #_index#;~
	set _name #answer#;~
	ask stringsmatch #_name# \"\";~
	select player_squad_panel:block#_block#_item#_index#;~
	if [answer] \"~
		param image black.s2g\";~
	if [!answer] \"~
		objedit #_name#;~
		objput icon _image;~
		param image #_image#.s2g\";~
	"

