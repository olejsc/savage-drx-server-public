hide playerInfo_panel:unit_image

//================================================================
//decide if we should show 'command' button
//================================================================
if [team_commander < 0] "show unit_select_buttons:command"
else "hide unit_select_buttons:command"
if [cl_gametype == 4] hide unit_select_buttons:command
//================================================================

//this is used in ui_show_*_panel.cfg
objloop INCLUDE 1 NOWRAP FORWARD name #player_currentUnit# "~
	objput canPurchase _z;~
	objput playercost _temp;~
	objbreakloop"

//Show shop title for mono-tech shops with no units 
objedit #player_insidebuilding#
objput techType _techType
objput description _description 

set _itsNULL 0
set _itsEMPTY 0
set _hideUNITS 0
set _noTechType 0
ask stringsmatch #_techType# "NULL"
if [answer] "set _itsNULL 1"
ask stringsmatch #_techType# ""
if [answer] "set _itsEMPTY 1"

if [_itsNULL | _itsEMPTY] "hide playerShop_panel; set _noTechType 1"
else "~
	set _hideUNITS 1;~
	select playerShop_panel:title;~
		param text #_description#;~
	select playerShop_panel:description;~
		param text \"This special shop only provides $_techType$ technology\";~	
	"
if [!_itsNULL & !_itsEMPTY] "hide preset_menu_panel"

//determine how much money the player would have if they sold their current unit
set player_potentialmoney [player_money + _temp]

//request panel
if [cl_pendingrequest_active] show unit_pending_request_panel
if [!cl_pendingrequest_active] hide unit_pending_request_panel


//Daemon: disable SPAWN button inside shops with allowSiege 0 for siege units
objedit #player_currentUnit#
objput isSiegeWeapon _isSiegeWeapon

objedit #player_insidebuilding#
objput isShopId _isShopId
objput description _description
objput allowSiege _allowSiege 

select unit_select_buttons:spawn
	param enable 1
	param alpha 1 1 1

set _noSiegeUnitsHere 0
if [_isShopId & !_allowSiege & _isSiegeWeapon] "param enable 0; param alpha .2 .2 .2; set _noSiegeUnitsHere 1" 


//hide all weapon/item/unit panesl (this should fix them showing up at odd times)
//objloop INCLUDE 1 NOWRAP FORWARD objclass melee "objput name _name; hide weapon_#_name#_panel"
//objloop INCLUDE 1 NOWRAP FORWARD objclass weapon "objput name _name; hide weapon_#_name#_panel"
//objloop INCLUDE 1 NOWRAP FORWARD objclass item "objput name _name; hide item_#_name#_panel"
//objloop INCLUDE 1 NOWRAP FORWARD objclass unit "objput name _name; hide unit_#_name#_panel"
//WD - seems faster doing this in just one loop -- not necessary now
//objloop INCLUDE 1 NOWRAP FORWARD race #player_racename# "objput name _name; hide unit_#_name#_panel"

//show weapon, item and unit panels
objloop INCLUDE 1 NOWRAP FORWARD objclass melee race #player_racename# "exec #gui_basepath#/ui_show_weapon_panel1.cfg"
objloop INCLUDE 1 NOWRAP FORWARD objclass weapon race #player_racename# "exec #gui_basepath#/ui_show_weapon_panel1.cfg"
objloop INCLUDE 1 NOWRAP FORWARD objclass item race #player_racename# "exec #gui_basepath#/ui_show_item_panel1.cfg"
//Daemon: Don't display units panel for mono-tech shops
if [_hideUNITS] "goto inventory"
objloop INCLUDE 1 NOWRAP FORWARD objclass unit race #player_racename# "exec #gui_basepath#/ui_show_unit_panel1.cfg"
//Daemon: Remove the siege units from loadout if allowSiege 0; //LE: better just grey out the siege units
//if [!_noSiegeUnitsHere] "objloop INCLUDE 1 NOWRAP FORWARD isSiegeWeapon 0 objclass unit race #player_racename# \"exec #gui_basepath#/ui_show_unit_panel1.cfg\""
//else "objloop INCLUDE 1 NOWRAP FORWARD objclass unit race #player_racename# \"exec #gui_basepath#/ui_show_unit_panel1.cfg\""


@inventory
for _index 0 [_playerInfoNumInventory - 1] 1 "exec #gui_basepath#/ui_update_inventory_slot.cfg"

// wjd
objedit #player_currentUnit#
objput isVehicle answer

select playerInfo_panel:unit_image
	param image #player_currentUnit#_unit.s2g
	// wjd - 3d loadout stuff
	if [cl_3dLoadout]	param 3dobject #player_currentUnit#
	else param 3dobject ""
	if [answer] "param degps 30; param dist_scale 1.9"
	else "param yaw 180; param degps 0; param dist_scale 1.5"


ask stringsmatch #player_currentUnit# ""
if [!answer] show playerInfo_panel:unit_image

objloop INCLUDE 1 NOWRAP FORWARD name #player_currentUnit# "~
	objput description _name;~
	objput playercost _cost;~
	objbreakloop"
select playerInfo_panel:unit_name
	param text #_name#
goto done

@done
