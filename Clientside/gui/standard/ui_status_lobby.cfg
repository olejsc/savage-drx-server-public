//executed when the player enters the team selection (lobby) screen
exec /gui/standard/numteams_change.cfg

show [sv_numTeams]lobby_panel
if [player_referee] show [sv_numTeams]ref_panel

set cl_tip_x 280
set cl_tip_y 500

select [sv_numteams]lobby_panel:map_image_graphic
  param image #world_overhead#

for _index 1 [sv_numteams-1] 1 "~
  setToValue _race team#_index#_racename;~
  select [sv_numteams]lobby_panel:savage_team[_index]_select;~
    if [_index > sv_numteams/2] set _temp 2;~
    else set _temp 1;~
    param image /gui/standard/nfm_#_race#_team#_temp#_select.s2g"

exec /gui/standard/ui_refresh_commander_lobby.cfg

activatechat
hide spawnpoint_select_panel_loadout

//move vote panel to its normal position
move vote_panel [_vote_x] [_vote_y]
move vote_world_panel [_vote_x-140] [_vote_y]
move vote_commander_panel [_vote_x] [_vote_y]
move vote_otherteam_panel [_vote_x] [_vote_y]
move vote_otherteam_commander_panel [_vote_x] [_vote_y]

//show notification_panel
clearIEventAssociations
setIEventScript vote #gui_basepath#/ui_refresh_vote.cfg
setIEventScript commander #gui_basepath#/ui_refresh_commander_lobby.cfg
setIEventScript referee #gui_basepath#/ui_refresh_ref_lobby.cfg
setIEventScript switchteam #gui_basepath#/ui_refresh_commander_lobby.cfg
setIEventScript trigger #gui_basepath#/ui_refresh_lobby.cfg
triggerIEvent vote
