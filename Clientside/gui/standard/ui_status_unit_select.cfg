//executed when the player enters the unit configuration screen for FPS mode

//exec ui_refresh_race.cfg

set cl_tip_x 25
set cl_tip_y 700

show preset_menu_panel
if [_preset_previous_team != player_team] "~
	set _preset_previous_team #player_team#;~
	if [player_team > 0] \"exec /gui/standard/ui_update_preset_panel.cfg\""

//if [AO] unit human_commander

show weapon_panel
show item_panel
show unit_panel
show playerInfo_panel
show unit_select_money
show unit_select_buttons
show unit_pending_request_panel

show unit_select_window
show notification_panel
show unit_select_notification_window
show unit_#current_unit#_panel
show unit_select_go_panel
show inventory_shop_panel
show unit_select_gold_panel
show loadout_chat

show unit_select_background

if [_ldsp_y > 750 | _ldsp_x > 1010*_sr] "move spawnpoint_select_panel_loadout 429 158; setsave _ldsp_x 429; setsave _ldsp_y 158;"
if [_loadout_minimap] "show spawnpoint_select_panel_loadout; focus spawnpoint_select_panel_loadout"

ask stringsmatch #player_racename# human
if [answer] goto ts_humantop
ask stringsmatch #player_racename# beast
if [answer] goto ts_beasttop
goto ts_skiptop

@ts_humantop
select spawnpoint_select_panel_loadout:base_icon
  param image /models/human/buildings/icons/selectionstronghold.s2g

select spawnpoint_select_panel_loadout:team_status_resource1_icon
  param image #gui_basepath#/gridmenus/icons/adrenaline.s2g
select spawnpoint_select_panel_loadout:team_status_resource1_label
  param cvar resource_chemical
  param text_color 0 1 0

select spawnpoint_select_panel_loadout:team_status_resource2_icon
  param image #gui_basepath#/gridmenus/icons/electrify_icon.s2g
select spawnpoint_select_panel_loadout:team_status_resource2_label
  param cvar resource_electric
  param text_color 0 1 1

select spawnpoint_select_panel_loadout:team_status_resource3_icon
  param image #gui_basepath#/gridmenus/icons/magneticshield.s2g
select spawnpoint_select_panel_loadout:team_status_resource3_label
  param cvar resource_magnetic
  param text_color 1 0 0

goto done

@ts_beasttop
select spawnpoint_select_panel_loadout:base_icon
  param image /models/beast/buildings/icons/lair.s2g

select spawnpoint_select_panel_loadout:team_status_resource1_icon
  param image #gui_basepath#/commander/firepool.s2g
select spawnpoint_select_panel_loadout:team_status_resource1_label
  param cvar resource_fire
  param text_color 1 .5 0

select spawnpoint_select_panel_loadout:team_status_resource2_icon
  param image #gui_basepath#/commander/stratapool.s2g
select spawnpoint_select_panel_loadout:team_status_resource2_label
  param cvar resource_strata
  param text_color .2 .8 1

select spawnpoint_select_panel_loadout:team_status_resource3_icon
  param image /models/beast/items/icons/portal.s2g
select spawnpoint_select_panel_loadout:team_status_resource3_label
  param cvar resource_entropy
  param text_color .2 1 .2
goto done

@done


//select notification_panel:notifications
//	param char_height 12
//	param rows 6
//	param textcolor 1 1 1

clearIEventAssociations
setIEventScript money /gui/standard/ui_refresh_unit_select.cfg
setIEventScript inventory /gui/standard/ui_refresh_unit_select.cfg
setIEventScript unit /gui/standard/ui_refresh_unit_select.cfg
setIEventScript trigger /gui/standard/ui_refresh_unit_select.cfg
setIEventScript research /gui/standard/ui_refresh_unit_select.cfg
setIEventScript ammo /gui/standard/ui_refresh_unit_select.cfg
setIEventScript request /gui/standard/ui_refresh_unit_select.cfg
setIEventScript commander /gui/standard/ui_refresh_unit_select.cfg
setIEventScript vote #gui_basepath#/ui_refresh_vote.cfg
setIEventScript deployment #gui_basepath#/ui_refresh_unit_select_item_deployment.cfg
triggerIEvent

if [_spectating] "show spectate_panel"
