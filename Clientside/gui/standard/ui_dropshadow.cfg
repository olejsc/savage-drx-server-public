// EX2: Adds a drop shadow to the bottom right of the specified region

  create graphic "shadow-bl" [_x] [_y+_height] 64 32
    param image	/gui/standard/shadow-bottomleft.s2g
    param alpha [_gap]
    
  create graphic "shadow-bottom" [_x+64] [_y+_height] [_width-64-32] 32
    param image	/gui/standard/shadow-bottom.s2g
    param alpha [_gap]
        
  create graphic "shadow-brl" [_x+_width-32] [_y+_height]  32 32
    param image	/gui/standard/shadow-brl.s2g
    param alpha [_gap]
      
  create graphic "shadow-br" [_x+_width] [_y+_height]  32 32
    param image	/gui/standard/shadow-bottomright.s2g
    param alpha [_gap]
      
  create graphic "shadow-brt" [_x+_width] [_y+_height-32] 32 32
    param image	/gui/standard/shadow-brt.s2g
    param alpha [_gap]
      
  create graphic "shadow-right" [_x+_width] [_y+64]  32 [_height-64-32]
    param image	/gui/standard/shadow-right.s2g
    param alpha [_gap]
    
  create graphic "shadow-tr" [_x+_width] [_y]  32 64
    param image	/gui/standard/shadow-trb.s2g
    param alpha [_gap]