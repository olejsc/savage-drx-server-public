// BEARD: these should probably go somewhere else: execute these whenever you want to update the vote sliders

// original algorithm by Senthryl
// which divides by zero btw

// lengthOfBar = min(maxBarLength, ((yesVotes + noVotes) / minimumVotesRequired) * maxBarLength)
// greenPieceLength = (yesVotes / (yesVotes + noVotes)) * lengthOfBar
// redPieceLength = (noVotes / (yesVotes + noVotes)) * lengthOfBar
// winningBarPosition = yesPercentageRequired * maxBarLength

// In order for a vote to pass, two things are required (as far as I know): X% of the players on the server must vote, and Y% of the votes cast must be "yes" votes.  In practice, this means something like "at least 40% of the players must vote and at least 60% must support to vote in order for it to pass."

// ratio X is vote_min ,  y vote_need

set vote_barlength [(vote_yes + vote_no) / vote_minturnout];
if [vote_barlength > 1] "set vote_barlength 1";

set vote_greensize [vote_barlength * vote_yes / (vote_yes + vote_no)];
set vote_redsize [vote_barlength * vote_no / (vote_yes + vote_no)];
set vote_redsize [vote_redsize + vote_greensize];

///////////////////////////////
// Start by hiding everything
hide vote_panel
hide vote_world_panel
hide vote_commander_panel
hide vote_otherteam_panel
hide vote_otherteam_commander_panel

/////////////////////////
// Check some variables
if [!vote_show] "goto done"
if [vote_world] "goto world"
if [!vote_team] "show vote_panel; goto done"
if [vote_team == player_team] "goto own"

/////////////////////////
// Other Team is Voting
if [vote_commander] "show vote_otherteam_commander_panel; goto done"
show vote_otherteam_panel
goto done

///////////////////////
// Our Team is Voting
@own
if [vote_commander] "show vote_commander_panel; goto done"
show vote_panel
goto done

/////////////////////////
// World Votes
@world
show vote_world_panel
select vote_world_panel:time
    param text "N/A"
select vote_world_panel:rating1
    param image /textures/icons/star-empty.s2g
select vote_world_panel:rating2
    param image /textures/icons/star-empty.s2g
select vote_world_panel:rating3
    param image /textures/icons/star-empty.s2g
select vote_world_panel:rating4
    param image /textures/icons/star-empty.s2g
select vote_world_panel:rating5
    param image /textures/icons/star-empty.s2g

ask fileExists /world/#vote_world_name#_overhead.jpg
//if [!answer]	"httpgetfile #svr_mapurl#/#vote_world_name#_overhead.jpg /world/#vote_world_name#_overhead.jpg; select vote_world_panel:minimap; param image /gui/standard/nfm_map_scroll.s2g"
if [answer] 	"select vote_world_panel:minimap; param image /world/#vote_world_name#_overhead.jpg"
        
@done
