    // faith: element to be used to have a better looking o_scrollbuffer or scrollbuffer with many options
	
	set _spacingTitleScroll 0
    set _titleHeight 20
    set _maxScrollableLines 500
    //set _columnlabelSize [_fontButtonSize]
    if [_columnLabels == 0] "set _columnlabelSize 0"; else "set _columnlabelSize [_fontLabelSize]";
    if [_scrollable == 0] "set _width [_width + 16]"
        
    if [_scrollable == 0] "set bool 0"; else "set bool 1";
        
    create label #_scrollbarName#_Title_label [_x] [_y - 8] [_width + bool * 16] [_fontLabelSize]
        param char_height [_fontLabelSize + 8]
        param align center
        param text #_titleText#
        param shadow 1
        param text_color 1 .8 0;
    
    set _column0 0
    set _column#_numberColumns# 1
    set _i 0
    for _i 0 [_numberColumns - 1] 1 "cvarcopy _column#_i# _xx;~
        cvarcopy _c#_i#Text _Text;~
        set _j [_i + 1];~
        cvarcopy _column#_j# _temp1;~
        cvarcopy _column#_i# _temp2;~
        create button #_scrollbarName#_column_button#_i# [_x + _xx * _width - 4] [_y + _titleHeight + _spacingTitleScroll] [(_temp1 - _temp2) * _width] [_columnlabelSize];~
            param char_height [_fontLabelSize];~
            param align left;~
            param text #_Text#;~
            param textcolor 1 .8 0;~
            param shadow 1;~
            param command \"select $_scrollbarName$_sb; param sort_column \"#_i#\"\""

    if [_columnlabelSize != 0] "~
    create graphic #_scrollbarName#_columngraphic [_x] [_y + _titleHeight + _spacingTitleScroll] [_width] [_fontLabelSize];~
        param image /gui/standard/white.s2g;~
        param alpha .1"
        
    set _i 1
    if [_columnLabels == 0] "set _stop [_numberRows / 2]"; else "set _stop [_numberRows / 2 + _numberRows % 2]"
        
    set _y [_y + _titleHeight + _spacingTitleScroll + _columnlabelSize]
    set _w [_width]
    set _height [_numberRows * _fontLabelSize]
    
    createvar  _#_scrollbarName#_sb_variable
    createvar  _#_scrollbarName#_sb_scrollvariable
    
    create o_scrollbuffer #_scrollbarName#_sb [_x] [_y] [_w] [_height]
	
		on hide "for _i 0 [$_numberColumns$ - 1] 1 \"hide $_scrollbarName$_column_button#_i#;\";~
		hide $_scrollbarName$_Title_label;~
		hide $_scrollbarName$_columngraphic;~
		for _i 1 [$_stop$ + 1] 1 \"hide $_scrollbarName$_sb_g1#_i#;\";~
		hide $_scrollbarName$_sb_g2;~
		hide $_scrollbarName$_scroll_up_button;~
		hide $_scrollbarName$_scroll_down_button;~
		hide $_scrollbarName$_scrollbar_slider;~
		hide $_scrollbarName$_slider_bg;"
		
		on show "for _i 0 [$_numberColumns$ - 1] 1 \"show $_scrollbarName$_column_button#_i#;\";~
		show $_scrollbarName$_Title_label;~
		show $_scrollbarName$_columngraphic;~
		for _i 1 [$_stop$ + 1] 1 \"show $_scrollbarName$_sb_g1#_i#;\";~
		show $_scrollbarName$_sb_g2;~
		show $_scrollbarName$_scroll_up_button;~
		show $_scrollbarName$_scroll_down_button;~
		show $_scrollbarName$_scrollbar_slider;~
		show $_scrollbarName$_slider_bg;"
		
        param bg_color        0 0 0
        param textcolor       1 1 1
        param selected_bgcolor .7 .7 0
        //param highlight_color 0 1 0
		param dropshadow 0
        param char_height      [_fontLabelSize]
        param icon_height      [_fontLabelSize]
        param rows              [_maxScrollableLines]
        param thickness          0
        param variable          _#_scrollbarName#_sb_variable
        param scrollvariable  _#_scrollbarName#_sb_scrollvariable
        param sortable [_scrollable]
        //param selectable [_scrollable]
		param sort_column [_sortColumn]
		param sort_column [_sortColumn]
        
        if [_numberColumns == 0 | _numberColumns == 1] "param colpos 1 [_width - 1]";
        if [_numberColumns >= 2] "for _i 1 [_numberColumns - 1] 1 \"cvarcopy _column#_i# _c;param colpos [_i] [_c * _width]\";param colpos [_numberColumns] [_width - 1]";
                
		set _lclick_cmd "o_scrollbuffer selectable $_scrollbarName$_sb 1; set _selectedScrollBar $_scrollbarName$"
        if [_popup_lclick == 1] "param lclick_cmd \"$_lclick_cmd$;GUI_showPopup \\\"sb\\\"\" ";
		if [_popup_lclick == 0 & _selectable == 1] "param lclick_cmd \"$_lclick_cmd$;$_show_cmd$\" ";
		if [_popup_lclick == 0 & _selectable == 0] "o_scrollbuffer selectable $_scrollbarName$_sb 0"
		
			
    if [_columnLabels == 0] set bool 1; else set bool 0;
    for _i 1 [_stop] 1 "create graphic #_scrollbarName#_sb_g1#_i#  [_x] [_y + 2 * _fontLabelSize * (_i - 1) + _fontLabelSize * bool + 1] [_w] [_fontLabelSize];~
        param image /gui/standard/white.s2g;~
        param alpha .2"
    
    create graphic #_scrollbarName#_sb_g2 [_x] [_y] [_w] [_numberRows * _fontLabelSize + 2 * bool]
        param image /gui/standard/white.s2g
        param alpha .13
    
    if [_scrollable == 1] "~
    ~
    set _sliderCorrection 4;~
    ~
    create button #_scrollbarName#_scroll_up_button [_x + _w] [_y - _columnlabelSize] 16 16;~
        param up_image /gui/standard/scrollup.s2g;~
        param command \"o_scrollbuffer scroll $_scrollbarName$_sb -1\";~
        param repeat true;~
    ~
    create button #_scrollbarName#_scroll_down_button [_x + _w] [_y + _height - 16 + 2 * bool] 16 16;~
        param up_image /gui/standard/scrolldown.s2g;~
        param command \"o_scrollbuffer scroll $_scrollbarName$_sb 1\";~
        param repeat true;~
    ~
    create slider #_scrollbarName#_scrollbar_slider [_x + _w] [_y - _columnlabelSize + 16 + _sliderCorrection] 16 [_height - _sliderCorrection * 2 + _columnlabelSize - 16 * 2 + 2 * bool];~
        param handleshader /gui/standard/scrollhandle.s2g;~
        param bgshader none;~
        param fillshader none;~
        param variable _#_scrollbarName#_sb_scrollvariable;~
        param showvalue 0;~
        param range 1 0;~
    ~
    create graphic #_scrollbarName#_slider_bg [_x + _w] [_y - _columnlabelSize + _sliderCorrection] 16 [_height - _sliderCorrection * 2 + _columnlabelSize + 2 * bool];~
        param color 0.71 0.33 0.13;~
        param alpha .1;~
        param image /gui/standard/white.s2g;~
        param interactive 0"