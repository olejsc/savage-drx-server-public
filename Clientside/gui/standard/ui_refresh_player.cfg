//setRefreshScriptFrequency 0
//if [ui_expectingUpdate] setRefreshScriptFrequency 20

for _index 0 15 1 "hide player_state_panel:state#_index#_graphic"
for _index 0 15 1 "~
	ask playerState #_index#;~
	if [answer] \"show player_state_panel:state#_index#_graphic\""

for _index 1 4 1 "exec ui_update_player_inventory.cfg"

set _x 0
if [player_wishitem] "set _x [_playerinvertoryspacing]"
move inventory_player_panel:itemselection [_playerinventoryx + _x] [_playerinventoryy]

if [player_item == 1] goto showfocus
hide player:focus_top
hide player:focus_right
hide player:focus_bottom
hide player:focus_left
goto focusdone

@showfocus
show player:focus_top
show player:focus_right
show player:focus_bottom
show player:focus_left
@focusdone


@done
