// update the entries in the preset panel
menu clear preset_menu_panel:preset_menu
preset_chargemenu preset_menu_panel:preset_menu "preset_load #preset_menu_panel:preset_menu#"
menu add preset_menu_panel:preset_menu "----------" "clear cl_presets_lastpreset"
menu add preset_menu_panel:preset_menu "add" "~
	show preset_add_panel;~
	focus preset_add_panel;~
	textbox clear preset_add_panel:name;~
	textbox activate preset_add_panel:name"
menu add preset_menu_panel:preset_menu "delete" "~
	menu clear preset_del_panel:preset_menu;~
	preset_chargemenu preset_del_panel:preset_menu \\\"\\\";~
	show preset_del_panel"
menu add preset_menu_panel:preset_menu "options" "show preset_option_panel"

