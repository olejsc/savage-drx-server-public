// update the item pictures
for _index 0 4 1 "~
	ask inventory #_index#;~
	set _name #answer#;~
	ask stringsmatch #_name# \"\";~
	select inventory_player_panel:slot#_index#;~
	if [answer] \"~
		param image black.s2g\";~
	if [!answer] \"~
		objedit #_name#;~
		objput icon _image;~
		param image #_image#.s2g\";~
	"

//===================================================
// recharge timers
//===================================================

select inventory_player_panel:item_box_graphic
	param movieendcommand "~
       		select inventory_player_panel:recharge0; set _rtmp [101-player_rechargePercent0]; param image #gui_basepath#/cd/cd#_rtmp#.png;~
		select inventory_player_panel:recharge1; set _rtmp [101-player_rechargePercent1]; param image #gui_basepath#/cd/cd#_rtmp#.png;~
		select inventory_player_panel:recharge2; set _rtmp [101-player_rechargePercent2]; param image #gui_basepath#/cd/cd#_rtmp#.png;~
		select inventory_player_panel:recharge3; set _rtmp [101-player_rechargePercent3]; param image #gui_basepath#/cd/cd#_rtmp#.png;~
		select inventory_player_panel:recharge4; set _rtmp [101-player_rechargePercent4]; param image #gui_basepath#/cd/cd#_rtmp#.png;~
		"

if [cl_resourcesPanel!=5] goto done
ask stringsMatch #player_racename# "human"
if [answer] goto human
ask stringsMatch #player_racename# "beast"
if [answer] goto beast

@human
select mana_panel:mana_digits
	param cvar player_ammo
	if [player_wishitem==0] param cvar player_weaponammo
	ask stringsMatch #player_currentunit# "human_medic"
	if [answer & player_wishitem!=2 & player_wishitem!=4] param cvar player_mana
	goto both

@beast
select mana_panel:mana_digits
	param cvar player_mana
	if [player_wishitem>1] param cvar player_ammo
	ask stringsMatch #player_currentunit# "beast_medic"
	if [answer & player_wishitem!=4] param cvar player_mana

@both

if [fade_inventory_in_out==0] goto done

if [_old_player_wishitem!=player_wishitem & _fadeout_once==1] "~
	set _old_player_wishitem #player_wishitem#;~
	set _fadeout_once 0;~
	fadein inventory_player_panel 1000;~
"

if [_fadeout_once==0 & player_wishitem < 2] "~
	set _old_player_wishitem #player_wishitem#;~
	set _fadeout_once 1;~
	fadeout inventory_player_panel 1000;~
"
	
@done

// move the current selection indicator
set _x [ui_inventoryspacing * player_wishitem]
move inventory_player_panel:itemselection~
	[ui_xinventorypos + _x] [ui_yinventorypos]
//hide player_chat_box_panel