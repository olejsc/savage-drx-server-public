//Daemon: panel that resets when new patches have important info to relay

set _ann_size 655
set _ann_left 509
set _ann_textsize 11
set _ann_rowsize 13
set _ann_titlesize 20
set _ann_spacing 0
set _ann_row 0
set _ann_titlerow 0

if [_wide] "set _ann_offset [_ann_size/2-_ann_size/2/_sr]; set _ann_textsize 13"

create panel "announce_panel" -8 0 

//===================

set _ann_title00 ""
set _ann_title01 "^ySavage XR 1.4 Patch"
set _ann_title02 "^wRelease Candidate"


set _ann_line00 "15 years after launch, this games is still getting updates."
set _ann_line01 "And this time around, it will be epic! The legendary leaders,"
set _ann_line02 "^yOphelia ^wand ^yJereziah^w, are finally entering the battlefield!"
set _ann_line03 ""
set _ann_line04 "They are here to breath new life into age old gameplay, but"
set _ann_line05 "without touching any of the classical Savage core features."

set _ann_line06 "Real games will be invaluable for tweaking them and bringing"
set _ann_line07 "them to a balanced state, impossible otherwise. So please,"
set _ann_line08 "remember, your feedback is of the utmost importance to us!"
set _ann_line09 "Please head over to www.Newerth.com to read more about the"
set _ann_line10 "skills, stats, tactics, as well as the other bug fixes, balance"
set _ann_line11 "changes and new additions included in ^ySavage XR 1.4 Patch."

//======================TEXT==SIZE==========================|


//======================================================
//Increase by 1 _announce_version when pushing new patch 
//that needs to display the pop-up panel
//4: XR 1.3.9.1 - 5: Leaders (01.06.2018)

