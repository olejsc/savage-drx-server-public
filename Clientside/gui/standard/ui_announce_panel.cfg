set _ann_buttonwidth 114
set _ann_buttonheight 40
set _ann_button_textsize 16
set _ann_top 392
set _ann_left 337
set _ann_column 0

if [_wide] "set _button_offset 24; set _ann_padding 2; set _tiny_offset 23"

	create button "patches" [_button_offset+_ann_left+(_ann_column*(_ann_buttonwidth/_sr+_ann_padding))] [_ann_top] [_ann_buttonwidth/_sr] [_ann_buttonheight]
		param up_image /gui/standard/sm_button.tga
		param up_hover_image /gui/standard/sm_button_hover.tga
//		param down_image /gui/standard/large_button_down.tga
		param text "Patch Notes"
		param shadow 1
		param char_height [_ann_button_textsize]
		param command "setsave _announce_seen #_announce_version#; hide black_overlay; hide announce_panel; set cl_freemouse 0; python \"import webbrowser\; webbrowser.open('http://www.newerth.com/smf/index.php/board,131.0.html', 0, True);\""

inc _ann_column 1

	create button "gameplay" [_button_offset+_ann_left+(_ann_column*(_ann_buttonwidth/_sr+_ann_padding))] [_ann_top] [_ann_buttonwidth/_sr] [_ann_buttonheight]
		param up_image /gui/standard/sm_button.tga
		param up_hover_image /gui/standard/sm_button_hover.tga
//		param down_image /gui/standard/large_button_down.tga
		param text "Gameplay"
		param shadow 1
		param char_height [_ann_button_textsize]
		param command "setsave _announce_seen #_announce_version#; hide black_overlay; hide announce_panel; set cl_freemouse 0; python \"import webbrowser\; webbrowser.open('http://www.newerth.com/smf/index.php/board,126.0.html', 0, True);\""

inc _ann_column 1

	create button "bugs" [_button_offset+_ann_left+(_ann_column*(_ann_buttonwidth/_sr+_ann_padding))] [_ann_top] [_ann_buttonwidth/_sr] [_ann_buttonheight]
		param up_image /gui/standard/sm_button.tga
		param up_hover_image /gui/standard/sm_button_hover.tga
//		param down_image /gui/standard/large_button_down.tga
		param text "Bug Reports"
		param shadow 1
		param char_height [_ann_button_textsize]
		param command "setsave _announce_seen #_announce_version#; hide black_overlay; hide announce_panel; set cl_freemouse 0; python \"import webbrowser\; webbrowser.open('http://www.newerth.com/smf/index.php/board,226.0.html', 0, True);\""


	create button "okay" [340+_tiny_offset] [136] [40] [_ann_buttonheight]
		param up_image /gui/standard/tiny_button_okay.tga
		param up_hover_image /gui/standard/tiny_button_okay_hover.tga
		param command "setsave _announce_seen #_announce_version#; set cl_freemouse 0; hide announce_panel; hide black_overlay;"
			       
	create button "close" [637-_tiny_offset] [136] [40] [_ann_buttonheight]
		param up_image /gui/standard/tiny_button_close.tga
		param up_hover_image /gui/standard/tiny_button_close_hover.tga
		param command "set cl_freemouse 0; hide announce_panel; hide black_overlay; "



	create graphic "background" [512-_ann_size/2+_ann_offset] 0 [_ann_size/_sr] [_ann_size]
		param image /gui/standard/announcement.s2g

create panel "black_overlay" 0 0

	create graphic "blackthing" 0 0 1024 768
		param image black.s2g
		param alpha .9
		param interactive 0
