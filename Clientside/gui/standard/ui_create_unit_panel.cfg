objput name _name
objput canPurchase _z

objput playerCost _temp
if [_temp < 0] goto end

create panel unit_#_name#_panel [0] [0]
	create label rtime [0] [_unitPanelIconHeight+12] [_unitPanelIconWidth] 24
		on show "select unit_"#_name#"_panel:rtime;~
		param researchobj "#_name#

	objput description _temp
	create label name ~
		[0] [_unitPanelIconHeight] ~
		[_unitPanelIconWidth] [_unitPanelNameCharHeight]
		param text #_temp#
		param char_height [_unitPanelNameCharHeight]

	create button request ~
		[(_unitPanelIconWidth / 2) - (_unitPanelRequestWidth / 2)] ~
		[(_unitPanelIconHeight / 2) - (_unitPanelRequestHeight / 2)] ~
		[_unitPanelRequestWidth] [_unitPanelRequestHeight]
		param up_image "/gui/standard/request.s2g"
		param sound "/sound/general/building_place.wav"
		param command "playerrequest object $_name$"
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"

	// wjd removed ievents
	create button buy [0] [0] [_unitPanelIconWidth] [_unitPanelIconHeight]
		param up_hover_image /textures/core/1_nl_over.s2g
		//param up_image "$_name$_unit.s2g"
		//echo canPurchase [_z]
		if [_z]	"param command \"unit $_name$\""
		if [!_z] "param command \"unit $_name$; ~
			giveback 1; giveback 2; giveback 2; giveback 2\""
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/building_place.wav"

	create graphic bgbuy [0] [0] [_unitPanelIconWidth] [_unitPanelIconHeight]
		on show "select unit_"#_name#"_panel:bgbuy;~
			if [cl_3dLoadout] param 3dobject "#_name#";~
			else param 3dobject"
		param animstate idle
		param ontop 0
		param dist_scale 2
		param pitch -15
		param image "$_name$_unit.s2g"

inc ui_numUnits 1

set _temp [_unitPanelBorder + _unitPanelCushion]
set _x [~
	_unitPanelX + _temp + ~
	(_index % _unitPanelCols) * ~
	(_unitPanelIconWidth + _unitPanelXSpacing)]
set _y [~
	_unitPanelY + _temp + ~
	floor (_index / _unitPanelCols) * ~
	(_unitPanelIconHeight + _unitPanelYSpacing + _unitPanelCostCharHeight)]
move unit_#_name#_panel [_x] [_y]

inc _index

@end
