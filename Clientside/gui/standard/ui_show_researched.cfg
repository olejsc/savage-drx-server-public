create panel researched_objects_panel 0 200
set _z 64
set _index 0
set _gap 8

objloop INCLUDE 1 NOWRAP FORWARD objclass unit race beast "objput name _name; exec /gui/standard/ui_researched_object.cfg"
objloop INCLUDE 1 NOWRAP FORWARD objclass weapon race beast "objput name _name; exec /gui/standard/ui_researched_object.cfg"
objloop INCLUDE 1 NOWRAP FORWARD objclass item race beast "objput name _name; exec /gui/standard/ui_researched_object.cfg"

set _index 0
set _temp 0
set _x 0
set _y 0
set _width 96
set _height 64
set _image human
set _border 1

create panel specpanel [512 - _width*4] 100
  create titlebar spectitle 0 -16 [_width*8] 16
    param title "Player Spectating"
    param hide_cmd "hide specpanel"
    
@loop
  
    if [_temp == 8] "set _temp 0; inc _y [_height]"
    set _x [_temp * _width]
    
    exec /gui/standard/ui_frame.cfg
    
    create button clientbutton#_index# [_x] [_y] [_width] [_height]
      param mouseenter_command "select specpanel:client"#_index#"; param dist_scale 2;~
                                select specpanel:clientbg"#_index#"; param alpha 0.8;~
                                select specpanel:clientlabel"#_index#"; param textcolor 0 0 0;~
                                select specpanel:clientlabelbg"#_index#"; param image white.s2g"
      param mouseaway_command  "select specpanel:client"#_index#"; param dist_scale 4;~
                                select specpanel:clientbg"#_index#"; param alpha 0.7;~
                                select specpanel:clientlabel"#_index#"; param textcolor 1 1 1;~
                                select specpanel:clientlabelbg"#_index#"; param image black.s2g"
      param command "chat clicked"#_index#
    
    create label clientlabel#_index# [_x] [_y + _height - 10] [_width] 10
      param align center
      param char_height 10
      
    create graphic clientlabelbg#_index# [_x] [_y + _height - 10] [_width] 10
      param image black.s2g
      param alpha 0.9
      
    create graphic client#_index# [_x] [_y] [_width] [_height]
      on show "ask clientName "#_index#"; select specpanel:clientlabel"#_index#"; param text #answer#"
      param cloneobj #_index#
      
    create graphic clientbg#_index# [_x] [_y] [_width] [_height-10]
      param image black.s2g
      param alpha 0.7
      
  inc _index
  inc _temp
  if [_index < 64] goto loop

  set _x 0
  set _y 0
  set _width [_width * 8]
  set _height [_height * 8]
  set _gap 0.7
  exec /gui/standard/ui_dropshadow.cfg
