
//  Highlights Specified Zone

	//top obstruction
	move hl:black_top 0 0 
	resize hl:black_top 1024 [_y]
	
	//right obstruction
	move hl:black_right [_x + _width] [_y]
	resize hl:black_right [1024 - _x - _width] [_height]	
	
	//left obstruction
	move hl:black_left 0 [_y] 
	resize hl:black_left [_x] [_height]

	//bottom obstruction
	move hl:black_bottom 0 [_y + _height] 
	resize hl:black_bottom 1024 [768 - _y - _height]
	
	//vignette
	move hl_vignette [_vig_x] [_vig_y] 


panel focus hl_vignette
show hl_vignette
panel focus hl
show hl

