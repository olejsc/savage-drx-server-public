//objedit "$_name$"
objput name _name
objput alwaysAvailable _free
objput objclass _type
set _isBuilding 0
set _isBase 0

select fieldcomm_#player_racename#_panel:fieldcomm_#_name#_button
	param alpha 1
	param interactive 1
	param color 9 9 9

if [_free] "param alpha 0.2; param interactive 0; param color 0 3 0; goto done"

ask stringsmatch "human_stronghold2" #_name#; if [answer==1] "set _isBase 1"
ask stringsmatch "human_stronghold3" #_name#; if [answer==1] "set _isBase 1"
ask stringsmatch "beast_lair2" #_name#; if [answer==1] "set _isBase 1"
ask stringsmatch "beast_lair3" #_name#; if [answer==1] "set _isBase 1"

ask stringsmatch "building" #_type#
if [answer] set _isBuilding 1

ask isTypeResearching #_name#
if [answer==1 & _isBuilding==0] "param alpha 0.3; param interactive 0; goto done"

ask isResearched #_name#
if [(answer==1 & _isBuilding==0) | (answer==1 &_isBase==1)] "param alpha 0.2; param interactive 0; param color 0 3 0; goto done"

ask isResearchable #_name#
if [answer==0] "param alpha 0.5; param interactive 0; param color 3 0 0; goto done"

@done