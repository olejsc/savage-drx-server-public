objput name _name
objput icon _icon
objput playercost _cost
objput description _text
objput maxdeployment _deployment

objput playercost _tmp
if [_tmp < 0] goto end


set _temp [_itemPanelBorder]
set _x [~
	_itemPanelX + _temp + _itemPanelXCushion + ~
	(_index % _itemPanelCols) * ~
	(_itemPanelIconSize + _itemPanelXSpacing)]
set _y [~
	_itemPanelY + _temp + _itemPanelYCushion + ~
	floor (_index / _itemPanelCols) * ~
	(_itemPanelIconSize + _itemPanelYSpacing + _itemPanelCostCharHeight)]

set _x [_x-4]
set _y [_y+2]
set _width [_itemPanelIconSize+8]
set _height [_itemPanelIconSize+8]
//set _border 2
//set _image thin
set _border 4
set _image standard
exec #gui_basepath#/ui_frame.cfg

set _x [_x+4]
set _y [_y-2]


	create label #_name#_name [_x] [_y + _itemPanelIconSize+10] [_itemPanelIconSize] [_itemPanelNameCharHeight]
		param char_height [_itemPanelNameCharHeight]
		param text #_text#
		param align center

	create label #_name#_cost [_x] [_y + _itemPanelIconSize + _itemPanelNameCharHeight+10] [_itemPanelIconSize] [_itemPanelNameCharHeight]
		param char_height [_itemPanelNameCharHeight]
		param text #_cost#
		param align center
		param textcolor 1 1 0

	create button #_name#_buy [_x] [_y+6] [_itemPanelIconSize] [_itemPanelIconSize]
		param command "give $_name$"
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/buy.wav"
		param alpha 1
		param interactive 1
		param alt ""
		param up_image "$_icon$.s2g"
		param enable true


//move item_#_name#_panel [_x] [_y]

inc ui_numItems 1
inc _index

@end
