set _x 0
set _y 0
set _border 4
set _width 170
set _height 36

if [player_team == 1] "set sv_tithe_display #sv_tithe_team1#"
if [player_team == 2] "set sv_tithe_display #sv_tithe_team2#"
if [player_team == 3] "set sv_tithe_display #sv_tithe_team3#"

create panel tithe_panel 5 67

	create label tithe [10] [10] [90] [16]
		param text "Tax Amount:"
		param align left

	create label titheper [121] [10] [16] [16]
		param text "%"
		param align left

	create label titheamt [96] [10] [24] [16]
		param cvar sv_tithe_display
		param align right

	create button increasetithe [_width - 10 - 12] [(_height / 2) - (12 / 2)-6] [12] [12]
		param up_image /gui/standard/uparrow.s2g
		param command "updatetithe 5; set sv_tithe_display [sv_tithe_display + 5]; if [sv_tithe_display > 100] set sv_tithe_display 100"

	create button decreasetithe [_width - 10 - 12] [(_height / 2) + (12 / 2)-6] [12] [12]
		param up_image /gui/standard/downarrow.s2g
		param command "updatetithe -5; set sv_tithe_display [sv_tithe_display - 5]; if [sv_tithe_display < 0] set sv_tithe_display 0"

	set _image human
	set _border 4
	exec ui_frame.cfg

	create graphic background 1 1 [_width - 2] [_height - 2]
		param image black.s2g
