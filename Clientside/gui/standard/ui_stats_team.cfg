set _x 16
set _temp 0

set _width 80
create button stats_team[_team]_user_name [_x] [_y] [_width] [stats_line_height]
	param command "select team$_team$_stats; param sort_column $_temp$"
	param char_height [stats_text_height]
	param text "Name:"
	param align left

