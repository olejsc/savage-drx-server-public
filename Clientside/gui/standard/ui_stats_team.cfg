inc _x [_width]
set _temp [_x]

inc _y [stats_text_height]

set stats_text_height 14

set _x 16

createvar team[_team]_stats_scrollvar

create o_scrollbuffer team[_team]_stats [_x] [_y] [_temp - 24] [stats_line_height * 22]
	param bg_color       	 0 0 0
	param textcolor      	1 1 1
	param highlight_color 	1 1 .2
	param char_height     	12
	param icon_height     	12
	param rows            	64
	param thickness       	1
	param variable			player_selected
	param sort_column     	1
	param colpos 			0 0		//80 wide  
	param colpos			1 80	//30 wide
	param colpos			2 110	//30 wide
	param colpos			3 140	//35 wide
	param colpos			4 175	//40 wide
	param colpos			5 215	//30 wide
	param colpos			6 245	//35 wide
	param colpos			7 280	//50 wide
	param colpos			8 330	//30 wide
	param colpos			9 360	//30 wide
	param colpos			10 390	//30 wide
	param colpos			11 420	//35 wide
	param scrollvariable	team[_team]_stats_scrollvar


create button "scroll_up_button" [_temp - 24 + _x] [_y] 12 20
	param up_image "/gui/standard/scrollup.s2g"
	param command "o_scrollbuffer scroll team$_team$_stats -1"

create slider team[_team]_stats_scrollbar [_temp - 24 + _x] [_y + 24] 12 [(stats_line_height * 22) - 48] 
	param handleshader /gui/standard/scrollhandle.s2g
	param bgshader none
	param fillshader none
	param variable team[_team]_stats_scrollvar
	param showvalue 0
	param range 1 0

create button "scroll_down_button" [_temp - 24 + _x] [_y + (stats_line_height * 22) - 20] 12 20
	param up_image "/gui/standard/scrolldown.s2g"
	param command "o_scrollbuffer scroll team$_team$_stats 1"


set _height [stats_line_height * 22 + 10 + _y]
set _x 0
set _y 0
set _width [_temp + 24]
set _border 6
exec ui_frame.cfg

	create graphic "blackthing1" 0 0 [_width] [_height]
		param image black.s2g
		param alpha .6
