ask stringsMatch #team_commandername# #name#
if [answer] "~
	show [sv_numteams]lobby_panel:promote_button;~
	show [sv_numteams]lobby_panel:demote_button;~
	hide [sv_numteams]lobby_panel:command_button;~
	show [sv_numteams]lobby_panel:resign_button;~
	goto _doneWithCommanderButtons"
	
if [cl_gametype == 4 | player_team == 0] "~
	hide [sv_numteams]lobby_panel:promote_button;~
	hide [sv_numteams]lobby_panel:demote_button;~
	hide [sv_numteams]lobby_panel:commander_button;~
	hide [sv_numteams]lobby_panel:resign_button;~
	goto _doneWithCommanderButtons"
	
if [team_commander < 0] "~
	show [sv_numteams]lobby_panel:commander_button;~
	hide [sv_numteams]lobby_panel:resign_button;~
	hide [sv_numteams]lobby_panel:promote_button;~
	hide [sv_numteams]lobby_panel:demote_button"
else "~
	hide [sv_numteams]lobby_panel:promote_button;~
	hide [sv_numteams]lobby_panel:demote_button;~
	hide [sv_numteams]lobby_panel:commander_button;~
	hide [sv_numteams]lobby_panel:resign_button"

@_doneWithCommanderButtons
