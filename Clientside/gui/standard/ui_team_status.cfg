if [cl_resourcesPanel==1] goto minimal
if [cl_resourcesPanel==2] goto hires
if [cl_resourcesPanel==3] goto legacy
if [cl_resourcesPanel==4] goto smoke
if [cl_resourcesPanel==5] goto simple

@minimal
//=============================================================================================
// Minimal Team Status
//=============================================================================================
if [_wide] "set _team_offset 24; set _res_offset 0; set _buffs_offset 12; set _base_offset 19; set _pool_offset 19; set _resdigits_offset 2; set _worker_offset 8; set _slider_offset 0;" 

set _team_font 18
create panel "team_status_panel" [870+_team_offset] 4

	create graphic base_icon [128-_base_offset] 4 [16/_sr] 16

	create slider base_health_bar [4-_slider_offset] 7 [123/_sr] 10 horizontal
		param range 0 100
		param variable team_commandcenter_healthpercent
		param bgshader none
		param fillshader progressbar.s2g
		param handleshader none
		param showvalue false
		param interactive 0

	create graphic resource_gold_icon [4-_res_offset] 23 [16/_sr] 16
		param image gold.s2g

	create label team_status_gold [26-_resdigits_offset] 22 [72/_sr] 21
		param cvar resource_gold
		param align left
		param char_height [_team_font]
		param textcolor 1 1 0
		param shadow 1

	create graphic resource_stone_icon [4-_res_offset] 43 [16/_sr] 16
		param image redstone.s2g

	create label team_status_stone [26-_resdigits_offset] 42 [72/_sr] 21
		param cvar resource_stone
		param align left
		param char_height [_team_font]
		param textcolor 1 0 0
		param shadow 1

	create graphic team_worker_icon [4-_res_offset] 62 [16/_sr] 16

	create label team_status_worker_pool_count [24-_worker_offset] 61 [16] 21
		param cvar team_numworkers
		param char_height [_team_font]
		param align right
		param shadow 1

	create label team_status_worker_pool_paren [32-_worker_offset] 61 [32] 21
		param text "/"
		param char_height [_team_font]
		param shadow 1

	create label team_status_worker_pool_idle [58-_worker_offset] 61 [32] 21
		param cvar team_idleworkers
		param char_height [_team_font]
		param shadow 1


	create graphic team_status_resource1_icon [82-_buffs_offset] 23 [16/_sr] 16

	create label team_status_resource1_label [110-_pool_offset] 22 [24] 21
		param shadow 1
		param char_height [_team_font]

	create graphic team_status_resource2_icon [82-_buffs_offset] 43 [16/_sr] 16

	create label team_status_resource2_label [110-_pool_offset] 42 [24] 21
		param shadow 1
		param char_height [_team_font]

	create graphic team_status_resource3_icon [82-_buffs_offset] 62 [16/_sr] 16

	create label team_status_resource3_label [110-_pool_offset] 62 [24] 21
		param shadow 1
		param char_height [_team_font]

	create graphic team_status_back 0 0 [195/_sr] 86
		param image fps/minimal_team.s2g
		param alpha [0.7-_am]


goto done


