create panel spectate_panel 0 0

set _bignotice_x 200
set _bignotice_y 210
set _smallnotice_x 200
set _smallnotice_y 270

if [cl_resourcesPanel==5] "~
	set _bignotice_x [500-_player_offset];~
	set _bignotice_y 690;~
	set _smallnotice_x [500-_player_offset];~
	set _smallnotice_y 735;~
"

create label bignotice [_bignotice_x] [_bignotice_y] 600 32
	param cvar game_serverstatus
	param char_height [fontsizehuge]
	param shadow 1
	param bgcolor 0.2 0.2 0.2 0.5

create label smallnotice [_smallnotice_x] [_smallnotice_y] 600 24
	param cvar player_secondsToRespawn
	param char_height [fontsizelarge]
	param shadow 1
	param bgcolor 0.2 0.2 0.2 0.5