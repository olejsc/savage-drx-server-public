//=================================================================================================
// Video options panel
// For setting resolution and toggling fullscreen
//=================================================================================================
set _width 440
set _height 160

create panel options_video 10 100

	create label video_options_label 0 -17 410 26
		param text "Video"
		param char_height [fontsizelarge]
		param shadow 1


	create label vid_mode_label 20 16 100 32
		param char_height [fontsizemedium]
		param text "Resolution:"
		param align left

	create menu vid_modes_menu 130 16 90 [fontsizemedium]
		param bg_color 0.2 0.2 0.2
		param highlight_color 1 1 .2
		param char_height [fontsizemedium]

	for _tmp 1 [vid_nummodes] 1 "~
		set _temp \"~
			menu add options_video:vid_modes_menu~
			\#vid_mode\"#_tmp#\"\#~
			\\\"setsave vid_mode \$_tmp\$;~
			show options_restart_video\\\"\";~
		do _temp"

	menu select options_video:vid_modes_menu #vid_currentMode#


	create label aspect_mode_label 20 42 100 32
		param char_height [fontsizemedium]
		param text "Widescreens:"
		param align left

	create menu aspect_modes_menu 130 42 90 [fontsizemedium]
		param bg_color 0.2 0.2 0.2
		param highlight_color 1 1 .2
		param char_height [fontsizemedium]

	menu add options_video:aspect_modes_menu "Increase FOV" "setsave vid_aspectmode 1; show options_restart_video"
	menu add options_video:aspect_modes_menu "Reduce FOV" "setsave vid_aspectmode 0; show options_restart_video"

	if [vid_aspectmode == 0] "menu select options_video:aspect_modes_menu \"Reduce FOV\";"
	if [vid_aspectmode == 1] "menu select options_video:aspect_modes_menu \"Increase FOV\";"

	create label border_label 20 68 100 32
		param char_height [fontsizemedium]
		param text "Window Border:"
		param align left
		
	create togglebutton extended_options_toggle 130 68 16 16
		param down_image ../human/checkbox_checked.s2g
		param up_image ../human/checkbox_empty.s2g
		param up_hover_image ../human/checkbox_empty.s2g
		param up_command "setsave vid_border 0; show options_restart_video"
		param command "setsave vid_border 1; show options_restart_video"
		param variable "vid_border"
		param sound "/sound/gui/button_click.wav"

	create label change_video_fullscreen_label 260 16 100 32
		param char_height [fontsizemedium]
		param text "Full Screen:"
		param align left

	create togglebutton change_video_fullscreen 390 16 16 16
		param down_image ../human/checkbox_checked.s2g
		param up_image ../human/checkbox_empty.s2g
		param up_hover_image ../human/checkbox_empty.s2g
		param up_command "setsave vid_fullscreen 0; show options_restart_video"
		param command "setsave vid_fullscreen 1; show options_restart_video"
		param variable "vid_fullscreen"
		param sound "/sound/gui/button_click.wav"

	create label extended_options_label 260 42 128 12
		param text "Optimizations:"
		param align left
		param char_height [fontsizemedium]

	create togglebutton extended_options_toggle 390 42 16 16
		param down_image ../human/checkbox_checked.s2g
		param up_image ../human/checkbox_empty.s2g
		param up_hover_image ../human/checkbox_empty.s2g
		param up_command "setsave gfx_allVBO 0; show options_restart_video"
		param command "setsave gfx_allVBO 1; show options_restart_video"
		param variable "gfx_allVBO"
		param sound "/sound/gui/button_click.wav"
	
	create label vsync_label 260 68 100 32
		param char_height [fontsizemedium]
		param text "V-Sync:"
		param align left
		
	create togglebutton extended_options_toggle 390 68 16 16
		param down_image ../human/checkbox_checked.s2g
		param up_image ../human/checkbox_empty.s2g
		param up_hover_image ../human/checkbox_empty.s2g
		param up_command "setsave gfx_vsync 0; show options_restart_video"
		param command "setsave gfx_vsync 1; show options_restart_video"
		param variable "gfx_vsync"
		param sound "/sound/gui/button_click.wav"
		
	create label gamma_label 20 90 60 18
		param text "Brightness:"
		param char_height [fontsizemedium]
		param align left

	create slider gamma_slider 150 92 200 12 horizontal
		param variable vid_gamma
		param range 0.2 1.9
		param bgshader ../sliderbg.s2g
		param fillshader ../human/sliderfill.s2g
		param handleshader ../sliderhandle.s2g
		param showvalue true
		param sound "/sound/gui/button_click.wav"

	create button gamma_reset 370 87 50 22
		param text "Reset"
		param char_height [fontsizemedium]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "vid_gamma 1"
		param shadow 1

	create button "change_video_mode" 25 120 120 [fontsizemedium + 10]
		param text "Apply Changes"
		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param command "show options_videocheck"
		param char_height [fontsizemedium]

	create button "fps_benchmark" 160 120 120 [fontsizemedium + 10]
		param text "FPS Benchmark"
		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param command "writeconfig #homedir#startup.cfg; demo_benchMark 1; demoplay fps.benchmark"
		param char_height [fontsizemedium]

	create button "rts_benchmark" 295 120 120 [fontsizemedium + 10]
