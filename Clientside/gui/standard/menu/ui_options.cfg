//=================================================================================================
// *********************************     NEWERTH.com   *********************************************
// "Must Reload Textures" panel (video)
// This popup just to tell people that the systems needs to reoad textures // CASE
//=================================================================================================
set _width 420
set _height 110
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

set _gfx_GLSLQuality_old 0

create panel options_reload_textures 0 0
	create label options_reload_textures_text1 [_x] [_y + 10] [_width] [fontsizemedium]
		param char_height [fontsizemedium]
		param text "Savage XR needs to work with some textures."

	create label options_reload_textures_text2 [_x] [_y + 30] [_width] [fontsizemedium]
		param char_height [fontsizemedium]
		param text "This may take a while"

	create button options_reload_textures_ok [_x + (_width / 2) - 150] [_y + 75] 100 [fontsizemedium + 4]
		param up_image /gui/standard/small_button.s2g
		param char_height [fontsizemedium]
		param text "OK"
		param shadow 1
		param command "if [gfx_GLSLQuality > 0] \"setsave gfx_useHighLevelShaders 1; shaderReloadGLSLMaps ; hide options_reload_textures; \";~
						if [gfx_GLSLQuality == 0] \"setsave gfx_useHighLevelShaders 0; shaderReloadGLSLMaps ; hide options_reload_textures; \";"

	create button options_reload_textures_cancel [_x + (_width / 2) + 50] [_y + 75] 100 [fontsizemedium + 4]
		param up_image /gui/standard/small_button.s2g
		param char_height [fontsizemedium]
		param text "Cancel"
		param shadow 1
		param command "setsave gfx_GLSLQuality #_gfx_GLSLQuality_old#; hide options_reload_textures;~
						if [gfx_GLSLQuality == 0] \"menu select options_graphics:glsl_quality_menu Off\";~
						if [gfx_GLSLQuality == 1] \"menu select options_graphics:glsl_quality_menu Normal\";~
						if [gfx_GLSLQuality == 2] \"menu select options_graphics:glsl_quality_menu High\";"



	set _border 8
	set _image neutral
	exec ../ui_frame.cfg

	create graphic box_bg [_x + 2] [_y + 2] [_width - 4] [_height - 4]
		param image /gui/standard/black.s2g
		param alpha .9

	create graphic background 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .2
		param interactive 1
