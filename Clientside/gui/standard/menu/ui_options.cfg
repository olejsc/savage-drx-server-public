if [gui_basepath=="/gui/standard"] goto HUDstandard
goto HUDnonstandard
@HUDstandard
	create label "resources_label" [_x] [_y + (_z * _index)] 200 20
		param text "Ingame FPS HUD Interface Skin*"
		param align left
		param char_height [fontsizemedium]

	create menu resource_menu [_x + 229] [_y + (_z * _index)] 80 24
		param bg_color 0.2 0.2 0.2
		param highlight_color 1 1 .2
		param char_height [fontsizemedium]
		param align right

		on show "if [cl_resourcesPanel == 2] \"menu select options_game:resource_menu Hi-Res 0\";~
		if [cl_resourcesPanel == 1] \"menu select options_game:resource_menu Arcade 0\";~
		if [cl_resourcesPanel == 4] \"menu select options_game:resource_menu Smoke 0\";~
		if [cl_resourcesPanel == 5] \"menu select options_game:resource_menu Simple 0\";~
		if [cl_resourcesPanel == 3] \"menu select options_game:resource_menu Legacy 0\""

	menu add options_game:resource_menu "Hi-Res" "setsave cl_resourcesPanel 2; python \"cl_builtin_reload_gui_thread()\""
	menu add options_game:resource_menu "Arcade" "setsave cl_resourcesPanel 1; python \"cl_builtin_reload_gui_thread()\""
	menu add options_game:resource_menu "Smoke" "setsave cl_resourcesPanel 4; python \"cl_builtin_reload_gui_thread()\""
	menu add options_game:resource_menu "Simple" "setsave cl_resourcesPanel 5; setsave fade_inventory_in_out 1; set _old_player_wishitem #player_wishitem#; set _fadeout_once 0; python \"cl_builtin_reload_gui_thread()\""
	menu add options_game:resource_menu "Legacy" "setsave cl_resourcesPanel 3; python \"cl_builtin_reload_gui_thread()\""
@HUDnonstandard

inc _index

if [cl_resourcesPanel!=3] "~
	create label duel_label [_x] [_y + _index * _z] 50 20;~
		param text \"Hide Top in Duels:\";~
		param char_height [fontsizesmall];~
		param align left;~
	create togglebutton duel_toggle [_x + 122] [_y + _index * _z] 16 16;~
		param up_image ../human/checkbox_empty.s2g;~
		param down_image ../human/checkbox_checked.s2g;~
		param up_command \"setsave duel_mode_view 0\";~
		param command \"setsave duel_mode_view 1\";~
		param variable \"duel_mode_view\";~
		param sound \"/sound/gui/button_click.wav\";"

if [cl_resourcesPanel!=3 & cl_resourcesPanel!=5] "~
	create label lefthp_label [_x + 160] [_y + _index * _z] 50 20;~
		param text \"Left Side HP Bar:\";~
		param char_height [fontsizesmall];~
		param align left;~
	create togglebutton lefthp_toggle [_x + 293] [_y + _index * _z] 16 16;~
		param up_image ../human/checkbox_empty.s2g;~
		param down_image ../human/checkbox_checked.s2g;~
		param up_command \"setsave left_hp_position 0\";~
		param command \"setsave left_hp_position 1\";~
		param variable \"left_hp_position\";~
		param sound \"/sound/gui/button_click.wav\";"

if [cl_resourcesPanel!=5] goto skip_fadeinventoryinout_menu
	create label fadeinventoryinout_label [_x + 160] [_y + _index * _z] 50 20
		param text "Fade inventory:"
		param char_height [fontsizesmall]
		param align left

	create menu fadeinventoryinout_menu [_x + 269] [_y + (_z * _index)] 40 24
		param bg_color 0.2 0.2 0.2
		param highlight_color 1 1 .2
		param char_height [fontsizemedium]
		param align right

		on show "if [fade_inventory_in_out == 0] \"menu select options_game:fadeinventoryinout_menu Off 0\";~
		if [fade_inventory_in_out == 1] \"menu select options_game:fadeinventoryinout_menu On 0\""

	menu add options_game:fadeinventoryinout_menu "On" "setsave fade_inventory_in_out 1; set _old_player_wishitem #player_wishitem#; set _fadeout_once 0; python \"cl_builtin_reload_gui_thread()\""
	menu add options_game:fadeinventoryinout_menu "Off" "setsave fade_inventory_in_out 0; python \"cl_builtin_reload_gui_thread()\""

@skip_fadeinventoryinout_menu

inc _index

if [cl_resourcesPanel==1 | cl_resourcesPanel==4] goto HUDalpha

	create label "hud_descriptions0" [_x] [_y + (_z * _index)-5] 200 20
		param text "*Note: There are 3 new ingame interfaces (HUDs)."
		param align left
		param char_height [fontsizesmall]

	create label "hud_descriptions1" [_x] [_y + (_z * _index)+5] 200 20
		param text "They provide the choice for the HP Bar placement."
		param align left
		param char_height [fontsizesmall]

