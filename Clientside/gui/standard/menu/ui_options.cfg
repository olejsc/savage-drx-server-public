//=================================================================================================
//Network options
//=================================================================================================
createvar _net_speed

createvar _net1 "setsave netbps 4000; setsave netframes 20; set _tmp \"Dial-up (56k)\""
createvar _net2 "setsave netbps 6000; setsave netframes 20; set _tmp \"ISDN (>128k)\""
createvar _net3 "setsave netbps 20000; setsave netframes 20; set _tmp \"DSL/Cable (>512k)\""
createvar _net4 "setsave netbps 50000; setsave netframes 30; set _tmp \"LAN\""
createvar _net5 "set _tmp \"Custom\""


//save actual settings
set _x #netbps#
set _y #netframes#
set _z #maxpacketsize#

//pick the default label
if [netbps == 4000] set _net_speed 1
else if [netbps == 6000] set _net_speed 2
else if [netbps == 20000] set _net_speed 3
else if [netbps == 50000] set _net_speed 4
else set _net_speed 5
do _net#_net_speed#

//restore actual settings, if they've been tweaked
set netbps #_x#
set netframes #_y#
set maxpacketsize #_z#

//have to modify label when options menu is brought up because when gui is loaded, netbps is not set correctly
createvar _set_net_label "set _x #netbps#; set _y #netframes#; set _z #maxpacketsize#;~
if [netbps == 4000 & netframes == 20] set _net_speed 1;~
else if [netbps == 6000 & netframes == 20] set _net_speed 2;~
else if [netbps == 20000 & netframes == 20] set _net_speed 3;~
else if [netbps == 50000 & netframes == 30] set _net_speed 4;~
else set _net_speed 5;~
do _net#_net_speed#;~
set netbps #_x#; set netframes #_y#; set maxpacketsize #_z#;~
select options_network:current_speed_label;~
	param text #_tmp#"

set _width 440
set _height 160

create panel options_network 10 280
	on show "do _set_net_label"

	create label "network_options_label" 0 -17 [_width] 26
		param text "Network"
		param char_height [fontsizelarge]
		param shadow 1

	set _x 70
	set _y 13
	set _z 28
	set _index 0

	create button connect_left 120 [_y + _index * _z] 24 24
		param up_image /gui/standard/left.s2g
		param shadow 1
		param command "~
			set _net_speed [_net_speed - 1];~
			if [_net_speed < 1] set _net_speed 4;~
			do _net#_net_speed#;~
			select options_network:current_speed_label;~
		param text #_tmp#"

	create label current_speed_label 144 [_y + _index * _z + 4] 140 [fontsizemedium]
		param text #_tmp#
		param char_height [fontsizemedium]

	create button connect_right 288 [_y + _index * _z] 24 24
		param up_image /gui/standard/right.s2g
		param shadow 1
		param command "~
			set _net_speed [_net_speed + 1];~
			if [_net_speed > 4] set _net_speed 1;~
			do _net#_net_speed#;~
			select options_network:current_speed_label;~
			param text #_tmp#"

	inc _index 1.4

	create label netbps_label [_x] [_y + _index * _z] 50 20
