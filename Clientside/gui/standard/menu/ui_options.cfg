		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param command "writeconfig #homedir#startup.cfg; demo_benchMark 1; demoplay rts.benchmark"
		param char_height [fontsizemedium]

	// Frame and background
	set _x 0
	set _y 0
	set _border 8
	set _image neutral
	exec ../ui_frame.cfg

