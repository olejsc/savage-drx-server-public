create graphic savage_background 0 0 371 768
	param image /gui/standard/nfm_mainmenu_buttons.tga

createvar _xr_version 
set _xr_version "1.0"

if [_bg==1] goto human
else goto beast

@beast
if [_wide] goto beastWide
else goto beastNormal

@beastNormal

	create graphic savage_logo 360 600 642 140
		param image /gui/standard/nfm_savage_logo_shd.tga

	create graphic newerth_logo 835 18 170 32
		param image /gui/standard/nfm_newerth_logo.tga
		param alpha 1

	create graphic savage_background 42 0 1024 768
		param image /gui/standard/nfm_beast_race.tga

	goto endRace

@beastWide

	create graphic savage_logo 410 600 [642/_sr] 140
		param image /gui/standard/nfm_savage_logo_shd.tga

//	create label XR_version 915 675 24 18
//		param shadow 1
//		param text "$_xr_version$"
//		param char_height 18
//		param textcolor 1 1 0.7
//		param alpha .6

	create graphic newerth_logo 861 18 [170/_sr] 32
		param image /gui/standard/nfm_newerth_logo.tga
		param alpha 1

	create graphic savage_background 160 0 [1024/_sr] 768
		param image /gui/standard/nfm_beast_race.tga

	goto endRace

@human
if [_wide] goto humanWide
else goto humanNormal

@humanNormal

	create graphic savage_logo 360 22 642 140
		param image /gui/standard/nfm_savage_logo.tga

	create graphic newerth_logo 835 722 170 32
		param image /gui/standard/nfm_newerth_logo.tga
		param alpha 1

	create graphic savage_background 324 -135 700 944
		param image /gui/standard/nfm_human_race.tga

	goto endRace

@humanWide

	create graphic savage_logo 410 22 [642/_sr] 140
		param image /gui/standard/nfm_savage_logo.tga

//	create label XR_version 915 97 24 18
//		param shadow 1
//		param text "$_xr_version$"
//		param char_height 18
//		param textcolor 1 1 0.7
//		param alpha .6

	create graphic newerth_logo 861 722 [170/_sr] 32
		param image /gui/standard/nfm_newerth_logo.tga
		param alpha 1

	create graphic savage_background 324 -200 700 1100
		param image /gui/standard/nfm_human_race.tga

	goto endRace

@endRace

	create graphic main_menu_bg 0 0 1024 768
		param image /gui/standard/blackthing_rnd.s2g
		param alpha 1

