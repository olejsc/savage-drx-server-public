//==============================================================================================
// XR Demo Converter by darkbread.
//==============================================================================================

create panel democonverter_manual 100 200
  create titlebar title 0 -16 800 16
    on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg;"
    on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
    param title "XR Demo Converter Manual"
    param hide_cmd "cl_freeMouse 0; hide democonverter_manual" 


	set _x 0
	set _y 0
	set _border 8
	set _width 800
	set _height 310
	set _image neutral
	exec /gui/standard/ui_frame.cfg


	create label "convertermanual1" 10 20 590 32
		param text "1. Click on the Demo which you want to convert. It will be highlighted."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual2" 10 40 590 32
		param text "2. Enter a name for the output folder where the converted demo will be stored."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual3" 10 60 590 32
		param text "3. Specify the Height, the Width and the Framerate per second (FPS) for the output."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual4" 10 80 590 32
		param text "4. Click on the Convert button. You will now see in a little window that a world is loaded."   
		param align left
		param char_height [fontsizemedium]
	
	create label "convertermanual5" 10 100 590 32
		param text "After the loading is finished, you will see another little window where you can see the frame,"   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual6" 10 120 590 32
		param text "which is currently rendered."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual7" 10 140 590 32
		param text "6. When it's finished, quit Savage and go to your output folder (SavageXR/game/output_folder)."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual8" 10 160 590 32
		param text "7. Now you will need a Software which converts a RAW video into an AVI. "   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual9" 10 180 590 32
		param text "Open this software (for example 'Virtual Dub') and select the first Frame."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual9" 10 200 590 32
		param text "Then save it as AVI."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual10" 10 220 590 32
		param text "8. Now you're done and can watch you demo without using Savage and without any FPS drops."   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual11" 10 240 590 32
		param text "NOTE: If you have a slow PC, the converting will need some time, so don't worry if it takes too long. "   
		param align left
		param char_height [fontsizemedium]

	create label "convertermanual12" 10 260 590 32
		param text "To abort the process press ESC. "   
		param align left
		param char_height [fontsizemedium]



	create graphic mouse_options_musicbackground [_x + 2] [_y + 2] [_width - 4] [_height - 4]
	param image /gui/standard/black.s2g
	param alpha .7

