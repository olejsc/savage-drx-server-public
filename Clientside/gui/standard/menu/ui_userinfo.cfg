////////////////////////
// Actual Stats Panel
set _x 0
set _y 0
set _width 550
set _height 440
set _border 3

create panel "userinfo_panel" 260 180
	create titlebar userinfo_panel_title 0 -16 [_width] 16
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "Player Statistics"
		param hide_cmd "hide userinfo_panel"

	//create frame
	exec /gui/standard/ui_frame.cfg
	set _gap 0.7
	exec /gui/standard/ui_dropshadow.cfg


// Control Buttons
set _y 7

	//Profile
	create button profile [_border + 15] [_border+_y] 110 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Profile"
		param shadow 1
		param char_height 16

	//Ranking
	create button ranking [_border + 140] [_border+_y] 110 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ranking"
		param shadow 1
		param char_height 16

	//Manage
	create button manage [_border + 422] [_border+_y] 110 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Manage"
		param shadow 1
		param char_height 16
		param command "show stats_manage; focus stats_manage"

	//Add Buddy
	create button addbuddy [_border + 422] [_border+_y] 110 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Add as Buddy"
		param shadow 1
		param char_height 16

	//Ranking Mode
	create menu rankmode_menu [_border + 300] [_border+_y+6] 60 20
		param bg_color 0.3 0.3 0.3
		param highlight_color 1 1 .2
		param char_height 16
		param up_image /gui/standard/small_button.s2g
		param item_image /gui/standard/small_button_over.s2g

	menu add rankmode_menu "Kills" "set _rank_mode \"kills\"; set _rank_label \"kills\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Deaths" "set _rank_mode \"deaths\"; set _rank_label \"deaths\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Killstreaks" "set _rank_mode \"mostKillsSinceRespawn\"; set _rank_label \"kills in a row\"; GUI_statsRanking #_stats_UID#"

	menu add rankmode_menu "-----" ""

	menu add rankmode_menu "Best Healer" "set _rank_mode \"besthealer\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Best Miner" "set _rank_mode \"bestminer\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Capitalist" "set _rank_mode \"capitalist\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Down Sizer" "set _rank_mode \"downsizer\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Hero" "set _rank_mode \"hero\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Home Wrecker" "set _rank_mode \"homewrecker\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "MMORPG" "set _rank_mode \"mmorpg\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Reaper" "set _rank_mode \"reaper\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Sadist" "set _rank_mode \"sadist\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Teacher Pet" "set _rank_mode \"teacherpet\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Unbreakable" "set _rank_mode \"unbreak\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Veteran" "set _rank_mode \"veteran\"; set _rank_label \"awards\"; GUI_statsRanking #_stats_UID#"

	menu add rankmode_menu "-----" ""

	menu add rankmode_menu "Impeached" "set _rank_mode \"impeached\"; set _rank_label \"impeachs\"; GUI_statsRanking #_stats_UID#"
	menu add rankmode_menu "Kicked" "set _rank_mode \"kicked\"; set _rank_label \"kicks\"; GUI_statsRanking #_stats_UID#"
