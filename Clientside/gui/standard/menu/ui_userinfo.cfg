////////////////////////
// Profile Manage Panel

set _x 0
set _y 0
set _width 350
set _height 100
set _border 3
set _titlebarSize 16
set _xPanel [(gui_coordWidth - _width) / 2]
set _yPanel [(gui_coordHeight - _height + _titlebarSize) / 2]

createvar portrait_filename

create panel stats_manage 360 280

	create titlebar title 0 -16 [_width] 16
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "Manage Profile Information"
		param hide_cmd "hide stats_manage" 

	//create frame
	exec /gui/standard/ui_frame.cfg

	create label portrait_label [20] [23] [120] [20]
		param char_height 14
		param align left
		param text "Portrait (filename):"

	create textbox portrait_textbox [150+5] [20] [180-10] [20] portrait_filename
		param char_height 14
		param keepInput 1
		param border 0

	create graphic portrait_textbox_bg [150] [20] [180] [20]
		param image /gui/standard/small_button.s2g
		param alpha .6

	create button save [125] [60] [100] [25]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param char_height 14
		param text "Save Changes"
		param command "GUI_statsManage; hide stats_manage"

	create graphic "blackthing1" 2 2 [_width-4] [_height-4]
		param image /gui/standard/black.s2g
		param alpha .8

panel hide userinfo_panel
panel hide stats_manage
