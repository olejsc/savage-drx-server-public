//==============================================================================================
// XR Demo Converter by darkbread.
//==============================================================================================

create panel democonverter 300 200
	create titlebar title 0 -16 405 16
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg;"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "XR Demo Converter"
		param hide_cmd "cl_freeMouse 0; hide democonverter" 


	set _x 0
	set _y 0
	set _border 8
	set _width 405
	set _height 370
	set _image neutral
	exec /gui/standard/ui_frame.cfg

set _input "#input#"
set demo_movieDir "#output#"

setsave "input" "#_demos_var#"
setsave demo_movieDir "Output_Folder_Name"



	create label "demos" 105 20 100 32
		param text "Dir:  SavageXR/game/demos/"
		param align left
		param char_height [fontsizemedium]

	create label "inputlabel" 70 50 100 32
		param text "Input:"
		param align left
		param char_height [fontsizehuge]

	create label "demoinput" 164 50 250 32
		param text "Click on the Demo,"
		param align left
		param char_height [fontsizesmall]

	create label "demoinput2" 164 60 250 32
		param text "you want to convert."
		param align left
		param char_height [fontsizesmall]


	create label "outputlabel" 70 100 100 32
		param text "Output:"
		param align left
		param char_height [fontsizehuge]

	create textbox demooutput_textbox 164 100 200 [fontsizemedium] demo_movieDir 150
		param border 0

	create graphic demooutput_bg 160 100 204 [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	create label "Widthlabel" 40 150 100 32
		param text "Width:"
		param align left
		param char_height [fontsizemedium]

	create slider Width 150 155 150 10 horizontal
		param variable demo_movieWidth
		param range 100 2048
		param bgshader ../sliderbg.s2g
		param fillshader ../human/sliderfill.s2g
		param handleshader ../sliderhandle.s2g
		param showvalue true
		param sound "/sound/gui/button_click.ogg"

	create label Widthl2 340 155 24 32
		param cvar demo_movieWidth
		param align right
		param char_height [fontsizemedium]
		param precision 1

	create label "Heightputlabel" 40 200 100 32
		param text "Height:"
		param align left
		param char_height [fontsizemedium]

	create slider Height 150 205 150 10 horizontal
		param variable demo_movieHeight
		param range  100 1600
		param bgshader ../sliderbg.s2g
		param fillshader ../human/sliderfill.s2g
		param handleshader ../sliderhandle.s2g
		param showvalue true
		param sound "/sound/gui/button_click.ogg"

	create label heightl2 340 200 24 [fontsizemedium]
		param cvar demo_movieHeight
		param align right
		param char_height [fontsizemedium]
		param precision 1

	create button "res1" 30 230 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "320x240"
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 320; setsave demo_movieHeight 240"
		param sound "/sound/gui/button_click.ogg"

	create button "res2" 120 230 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "640x480"
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 640; setsave demo_movieHeight 480"
		param sound "/sound/gui/button_click.ogg"

	create button "res3" 210 230 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "1024x768"
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 1024; setsave demo_movieHeight 768"
		param sound "/sound/gui/button_click.ogg"

	create button "res4" 300 230 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "1280x768"
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 1280; setsave demo_movieHeight 768"
		param sound "/sound/gui/button_click.ogg"

	create button "res5" 30 255 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "1280x800"
		param char_height [fontsizesmall] 
		param command "setsave demo_movieWidth 1280; setsave demo_movieHeight 800"
		param sound "/sound/gui/button_click.ogg"

	create button "res6" 120 255 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "1600x1200 "
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 1600; setsave demo_movieHeight 1200"
		param sound "/sound/gui/button_click.ogg"


	create button "res7" 210 255 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "1920x1080"
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 1920; setsave demo_movieHeight 1080"
		param sound "/sound/gui/button_click.ogg"


	create button "res8" 300 255 80 20
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "2048x1536 "
		param char_height [fontsizesmall]
		param command "setsave demo_movieWidth 2048; setsave demo_movieHeight 1536"
		param sound "/sound/gui/button_click.ogg"

	create label "fpslabel" 40 280 100 32
		param text "FPS:"
		param align left
		param char_height [fontsizemedium]

	create slider fps 150 285 150 10 horizontal
		param variable demo_movieFPS
		param range  10 100
		param bgshader ../sliderbg.s2g
		param fillshader ../human/sliderfill.s2g
		param handleshader ../sliderhandle.s2g
		param showvalue true  
		param sound "/sound/gui/button_click.ogg"

	create label fps~l2 340 285 24 [fontsizemedium]
		param cvar demo_movieFPS
		param align right
		param char_height [fontsizemedium]
		param precision 1

	create button "convertbutton" 60 320 128 32
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Convert"
		param char_height [fontsizemedium]
		param command "set demo_makemovie 1; disconnect; demostop; demo #_demos_var#; hide demos_panel; hide democonverter; hide democonverter_manual;"
		param sound "/sound/gui/button_click.ogg"

	create button "manualbutton" 198 320 128 32
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Manual"
		param char_height [fontsizemedium]
		param command "show democonverter_manual"
		param sound "/sound/gui/button_click.ogg"


	create graphic mouse_options_musicbackground [_x + 2] [_y + 2] [_width - 4] [_height - 4]
	param image /gui/standard/black.s2g
	param alpha .7

