create panel "info_panel" 300 200 

	set _x 0
	set _y 0
	set _width 400
	set _height 200
	set _image neutral
	set _border 8
	exec ../ui_frame.cfg
	
	create textbuffer "info_explanation" 50 8 300 6
		param delay_secs 0
		param char_height [fontsizemedium]

	create button "info_panel_hide_button" [_border + 120] [_border + 100] 128 32
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param char_height [fontsizemedium]
		param text "OK"
		param shadow 1
		param command "hide info_panel"

	create graphic "blackthing1" 2 2 396 196
		param image /gui/standard/black.s2g
		param interactive 1

	create graphic "blackthing2" -300 -200 1024 768
		param image /gui/standard/black.s2g
		param alpha .8
		param interactive 1
