// wjd - modified to add bindprofile and alias param

create label keylabel#_index# [_x] [_y + (_z * _index)] 80 [fontsizemedium]
	param text "$_keydesc$"
	param align left
	param char_height [fontsizemedium]

create keygrab keygrab#_index# [_x + 160] [_y + (_z * _index)] 100 [fontsizemedium] keyhit_noticepanel
	param up #_bindup#
	param down #_binddown#
	param border 0
	param bindprofile #_bindprofile#
	// don't let user overwrite non-configurable commander keys
  if [_bindprofile == 1] "param commit_cmd \"exec /settings/commander_keys.cfg\""

create graphic keybg#_index# [_x + 160 - 4] [_y + (_z * _index) - 4] [100 + 4]  [fontsizemedium + 4]
	param image /gui/standard/small_button.s2g
	param alpha .6

inc _index
set _alias ""