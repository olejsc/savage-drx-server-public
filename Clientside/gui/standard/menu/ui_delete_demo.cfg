// EX2: Delete demo file

createvar _error 1
deletefile /demos/#_demos_var# _error
strlen _error answer
if [answer] "set _error_icon 1;~
             set _title \"Error deleting file\";~
             show modal_error_panel;~
             goto end"

o_scrollbuffer clearline demos_panel:demolist
o_scrollbuffer print demos_panel:demolist " " " "
o_scrollbuffer needssorting demos_panel:demolist 0

@end