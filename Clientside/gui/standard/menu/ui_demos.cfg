//=============================================================================================
// Demo Playback Controls 
//=============================================================================================

if [_wide] set _demo_offset 30
create panel demo_controls_panel [320+_demo_offset] 228
set _demo_top 6
set _demo_width 32

	create button "demo_rewind" [10/_sr] [_demo_top] [_demo_width/_sr] 32
		param up_image /gui/standard/demo_rewind.s2g
		param down_image /gui/standard/demo_rewind_dn.s2g

	create button "demo_play" [48/_sr] [_demo_top] [_demo_width/_sr] 32
		param up_image /gui/standard/demo_play.s2g
		param down_image /gui/standard/demo_play_dn.s2g

	create button "demo_stop" [86/_sr] [_demo_top] [_demo_width/_sr] 32
		param up_image /gui/standard/demo_stop.s2g
		param down_image /gui/standard/demo_stop_dn.s2g

	create button "demo_forward" [124/_sr] [_demo_top] [_demo_width/_sr] 32
		param up_image /gui/standard/demo_forward.s2g
		param down_image /gui/standard/demo_forward_dn.s2g


	create slider demo_elapsed [168/_sr] [16] [114/_sr] 11 horizontal
		param range 0 100
		param showvalue false
		param variable demo_percent
		param handleshader /gui/standard/1_nl_mana_handle_human.s2g
		param fillshader /gui/standard/mana_bar_human.s2g
		param bgshader none
		param interactive 0

	create graphic demo_timebar [162/_sr] [_demo_top] [128/_sr] 34
		param image /gui/standard/demo_timebar.s2g

	create label demo_time [296/_sr] 13 [66/_sr] 20
//		param text "36:28"
		param cvar demo_time
		param char_height 18
		param shadow 1

	create graphic demo_digits [296/_sr] [_demo_top] [64/_sr] 32
		param image /gui/standard/demo_digits.s2g

	create graphic demo_back -6 4 [384/_sr] 96
		param image /gui/standard/demo_back.s2g


//=============================================================================================
// Modal error dialog
//=============================================================================================

set _width 340
set _height 160
set _x 0
set _y 0
set _image neutral
set _border 3
set _error_icon 1
create panel modal_error_panel [512-_width/2] [384-_height/2] [_width] [_height]
	create titlebar title 0 0 [_width] 16
		on show "show modalbg; select modal_error_panel:title; param title #_title#;~
			set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		on hide "hide modalbg;~
			set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param hide_cmd "hide modal_error_panel"

	create textbuffer errormsg 32 47 [_width-70] 16
		on show "textbuffer clear modal_error_panel:errormsg; textbuffer print modal_error_panel:errormsg #_error#"
		param align left
		param delay_secs 0

	create label icon [_width] 42 32 32
		on show "select modal_error_panel:icon;~
			if [_error_icon == 0] param text \"\";~
			if [_error_icon == 1] param text \"^800!\";~
			if [_error_icon == 2] param text \"^228i\""
		param char_height 50

	create button ok [_width/2-96/2] [_height-48] 96 24
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text OK
		param command "hide modal_error_panel"

	set _y 16
	inc _height -16
	exec ../ui_frame.cfg

	create graphic bg 0 16 [_width] [_height]
		param image /gui/standard/black.s2g

	inc _height 16
	set _y 0
	set _gap 0.7
	exec ../ui_dropshadow.cfg

	set _width 910
	set _height 730
	set _x 0
	set _y 0
	set _image neutral
	set _border 8

create panel modalbg 0 0
	create graphic bg 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha 0.5
		param interactive 1


//=============================================================================================
// EX2 Demos panel
//=============================================================================================

createvar _demos_var 0
createvar _demos_scrollvar 0

createvar _col1 310
createvar _col2 500
createvar _col3 600
createvar _col4 670
createvar _col5 850

create panel demos_panel [512 - _width/2] 20

	create graphic demo_controls 813 528 86 186 
		param image /gui/standard/demo_controls.s2g
		param alpha 1

//  create titlebar title 0 -16 [_width] 16
//    param title "Demo Recordings"

	set _z 354
	create o_scrollbuffer demolist 20 35 [_width-50] [_z]
		on show "listdemos demos_panel:demolist /gui/standard/menu/ui_refresh_demo_window.cfg"
		on hide "stopdemolist"
		param bg_color 0 0 0
		param selected_textcolor 1 1 .2
		param char_height	14
		param icon_height	14
		param rows			500
		param thickness		0
		param variable		_demos_var
		// twice for reverse order
		param sort_column	1
		param sort_column	1
//		param colpos		0 0
		param colpos		1 [_col1]
		param colpos		2 [_col2]
		param colpos		3 [_col3]
		param colpos		4 [_col4]
		param colpos		5 [_col5]
		param scrollvariable _demos_scrollvar
		param gap 10
		param rclick_cmd "hide demos_panel; disconnect; demostop; demo #_demos_var#"
		param lclick_cmd "exec /gui/standard/menu/ui_refresh_demo_window.cfg"
	
	create slider scrollbar [_width-30] 54 20 [_z-48]
		param handleshader /gui/standard/scrollhandle.s2g
		param bgshader /gui/standard/darkbrown.s2g
		param fillshader none
		param variable _demos_scrollvar
		param showvalue 0
		param range 1 0
		param value 1

	create button scroll_up_button [_width-30] 30 20 20
		param up_image "/gui/standard/scrollup.s2g"
		param command "o_scrollbuffer scroll demolist -1"
		param repeat true

	create button scroll_down_button [_width-30] [_z+10] 20 20
		param up_image "/gui/standard/scrolldown.s2g"
		param command "o_scrollbuffer scroll demolist 1"
		param repeat true

	create button filename 20 10 [_col1-20] 32
		param align left
		param text "File"
		param shadow 1
		param char_height 20
		param command "o_scrollbuffer param demos_panel:demolist sort_column 0"

	create button servername [_col1+20] 10 [_col2-_col1] 32
		param align left
		param text "Server"
		param shadow 1
		param char_height 20
		param command "o_scrollbuffer param demos_panel:demolist sort_column 1"

	create button mapname [_col2+20] 10 [_col3-_col2] 32
		param align left
		param text "Map"
		param shadow 1
		param char_height 20
		param command "o_scrollbuffer param demos_panel:demolist sort_column 2"

	create button size [_col3+20] 10 [_col4-_col3] 32
		param align left
		param text "Size"
		param shadow 1
		param char_height 20
		param command "o_scrollbuffer param demos_panel:demolist sort_column 3"

	create button mtime [_col4+20] 10 [_col5-_col4] 32
		param align left
		param text "Modified"
		param shadow 1
		param char_height 20
		param command "o_scrollbuffer param demos_panel:demolist sort_column 4"

	exec ../ui_frame.cfg
	
	create graphic sep 0 [_z+37] [_width] 1
		param image gfx/frames/human/top.s2g

	create graphic sep 0 [_z+37] [_width] 1
		param image gfx/frames/human/bottom.s2g

	create button "playdemo" [20] [_height-50] 128 32
		param text "Play Demo"
		param shadow 1
		param char_height 16
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "set demo_makemovie 0; hide demos_panel; hide democonverter; hide democonverter_manual; disconnect; demostop; demo #_demos_var#"

	create button "close" [20 + 128 + 8] [_height-50] 128 32
		param text "Close"
		param shadow 1
		param char_height 16
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide demos_panel; set demo_makemovie 0"

	set _tmp [_height]
	set _temp [_width]
	set _x 20
	set _y 403
	set _height 264
	set _width 264
	set _image neutral
	set _border 3
	exec ../ui_frame.cfg

	create button overheads2g [_x] [_y] [_width] [_height]
		param command "hide demos_panel; disconnect; demostop; demo #_demos_var#"

	create button overheadjpg [_x] [_y] [_width] [_height]
		param command "hide demos_panel; disconnect; demostop; demo #_demos_var#"

	create label nooverhead [_x] [_y + _height/2-5] [_width] 10
		param text "No map available"
		param char_height 10

	create graphic overheadbg [_x] [_y] [_width] [_height]
		param image /gui/standard/black.s2g
		param alpha 0.8

	createvar _demolist_newname ""

	create textbox renamebox 313 [_y+3] 490 32 _demolist_newname
		param border 0
		param char_height 16
		param commit_cmd "exec /gui/standard/menu/ui_rename_demo.cfg"
		param abort_cmd "set _demolist_newname #_demos_var#"

	create graphic renamebg 311 [_y] 500 23
		param image /gui/standard/white.s2g
		param alpha 0.2

	create button renamebutton 820 [_y] 72 24
		param text "Rename"
		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "exec /gui/standard/menu/ui_rename_demo.cfg"

	create button deletebutton 820 [_y+32] 72 24
		param text "Delete"
		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "exec /gui/standard/menu/ui_delete_demo.cfg"

	create button convertbutton 820 [_y+64] 72 24
		param text "Convert"
		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "show democonverter"
		
 	createvar _transcript_scrollvar 0

	set _x 310
	inc _y 32
	set _width 500
	set _height 275

	exec ../ui_frame.cfg

	inc _x 8
	inc _y 8
	inc _height -18
	inc _width -16

	create slider transcript_slider [_x+_width-20] [_y+24] 20 [_height-44]
		param handleshader /gui/standard/scrollhandle.s2g
		param bgshader /gui/standard/darkbrown.s2g
		param fillshader none
		param variable _transcript_scrollvar
		param showvalue 0
		param range 1 0
		
	create button transcript_scrolldown [_x+_width-20] [_y] 20 20
		param up_image "/gui/standard/scrollup.s2g"
		param command "scrollbuffer scroll transcript -1"
		param repeat true

	create button transcript_scrollup [_x+_width-20] [_y+_height-16] 20 20
		param up_image "/gui/standard/scrolldown.s2g"
		param command "scrollbuffer scroll transcript 1"
		param repeat true


	create scrollbuffer transcript [_x] [_y+3] [_width-20] [_height+4]
		param rows 500
		param bg_color 0 0 0
		param scrollvariable _transcript_scrollvar
		param linewrap true
		param interactive 1
		param selectable 0
		param wraparound 1

	inc _x -8
	inc _y -8
	inc _height 16
	inc _width 16

	create graphic transcriptbg [_x] [_y] [_width] [_height]
		param image /gui/standard/black.s2g
		param alpha 0.7

	set _height [_tmp]
	set _width [_temp]
	set _x 0
	set _y 0

	create graphic "demos_bg" 0 0 [_width] [_height]
		param image /gui/standard/black.s2g
		param alpha 0.9
		param interactive 1
