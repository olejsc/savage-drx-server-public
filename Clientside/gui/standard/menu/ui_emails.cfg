// Emails Notification Panel

create panel emails_notification_panel 0 [gui_coordHeight / 2]

	create label count 22 15 50 15
		param char_height 14
		param align left
		param shadow 1
		param text #emails_text#
		param text_color 1 .8 0

	create button check 0 0 50 50
		param up_image /gui/standard/smail.s2g
		param up_hover_image /gui/standard/smail_over.s2g
		param down_image /gui/standard/smail_over.s2g
		param command "inboxPanel; set emails_new 0;"