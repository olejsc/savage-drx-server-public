create panel "create_user_panel" 256 280

	create textbox "username_box" 229 45 212 32 username
		param nonascii 0
		param char_height [fontsizelarge]
		param border 0

	create textbox "password_box" 229 93 212 32 password
		param hidden 1
		param char_height [fontsizelarge]
		param border 0

	create textbox "password_confirm_box" 229 143 212 32 password_confirm
		param hidden 1
		param char_height [fontsizelarge]
		param border 0

	create button "create_account_button" 68 210 128 32
		param text "Create"
		param char_height [fontsizemedium]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "create-account"

	create button quit_button 317 210 128 32
		param text "Back"
		param char_height [fontsizemedium]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "uiState login"

	set _x 0
	set _y 0
	set _width 512
	set _height 256
	set _image neutral
	set _border 8
	exec ../ui_frame.cfg
	
	create graphic "blackthing1" 0 0 512 256
		param image "/gui/standard/nfm_createuser.s2g"

	create graphic savage_background_cover -256 -280 1024 768
		param image /gui/standard/black.s2g
		param interactive 1
		param alpha .5


create panel "cdkey_panel" 256 280

	create textbox "cdkey_box" 144 35 302 45 cdkey
		param char_height [fontsizelarge]
		param border 0

	create label "cdkeyinstruct"  70  106 363 20
		param text "Enter your Cd Key"
		param char_height [fontsizemedium]
	
	create label "cdkeyinstruct2" 70  126 363 20
		param text "found on the back of the manual."
		param char_height [fontsizemedium]

	create label "cdkeyinstruct3"  70  146 363 20
		param text "Help? www.s2games.com/support"
		param textcolor 1 1 0
		param char_height [fontsizemedium]

	create button "cdkey_button" 59 206 128 32
		param text "OK"
		param char_height 16
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "authenticate-cdkey"

	create button "quit" 321 206 128 32
		param text "Quit"
		param char_height 16
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "quit"

	set _x 0
	set _y 0
	set _width 512
	set _height 256
	set _image neutral
	set _border 8
	exec ../ui_frame.cfg

	create graphic "blackthing1" 0 0 512 256
		param image "/gui/standard/nfm_cdkey.s2g"

	create graphic savage_background_cover -256 -280 1024 768
		param image /gui/standard/black.s2g
		param interactive 1
		param alpha .5

