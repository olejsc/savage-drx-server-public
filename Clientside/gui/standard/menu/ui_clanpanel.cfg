create panel inbox_panel [_xPanel] [_yPanel]

	set _scrollbarName "inbox"
	set _titleText "Invites"
	set _numberRows 12
	set _x [_offset * 2]
	set _y [4 * _offset + _buttonHeight]
	set _width [(_widthPanel - 4 * _offset - 16) * 3 / 4]
	set _numberColumns 3
	set _column1 0.2
	set _column2 0.4
	set _c0Text " Name"
	set _c1Text " Time"
	set _c2Text " Subject"
	set _scrollable 1
	set _columnLabels 1
	set _popup_lclick 0
	set _selectable 1
	set _show_cmd "GUI_showInboxMessage"
	exec /gui/standard/ui_scroll.cfg

	set _ind 1

	inc _ind

	// Portrait
	set _x [_offset * 4 + (_widthPanel - 4 * _offset - 16) * 3 / 4 + 16 + _offset * 2 + 20]
	set _y [60 + _offset + 20 + (_ind - 1) *( _offset + _fontButtonSize) + _offset * 2 + 20]
	set _width 110
	set _height 100
	set _border 3

	// Notification Toggle
	create label email_toggle_label 700 88 1 1
		param text "Ingame Notification:"
		param char_height [fontsizemedium]
		param align left

    create togglebutton email_toggle 812 88 16 16
		param up_image ../human/checkbox_empty.s2g
		param down_image ../human/checkbox_checked.s2g
		param up_command "setsave cl_notifyEmails 0"
		param command "setsave cl_notifyEmails 1"
		param variable "cl_notifyEmails"
		param sound "/sound/gui/button_click.wav"

	// Create Frame
	//exec /gui/standard/ui_frame.cfg

	//create graphic portrait [_x + 2] [_y + 2] [_width - 4] [_height - 4]
		// param url ""
	//	param alpha .9

	create textbuffer inbox_info [_offset * 2] [300 + 270] [_widthPanel - 4 * _offset - 16 - 2 * _offset - 100] [_fontLabelSize] 1
		param char_height [_fontLabelSize]
		param shadow 1
		param textcolor 0.9 0.1 0.1

