// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------

create panel search_panel [_xPanel] [_yPanel]

	create label membersmin_label [_offset * 2] [_offset * 3 + _buttonHeight] 80 [_fontButtonSize + 4]
	    on hide "set membersmin_input \"2\"; clear search_string; o_scrollbuffer clear search_clan_sb; o_scrollbuffer selectable search_clan_sb 0"
		param char_height [_fontLabelSize]
		param align left
		param text "Min. members:"
		param shadow 1

	create textbox membersmin_textbox [_offset * 6 + 45] [_offset * 2 + _buttonHeight + 8] [100 - 12] [_fontLabelSize] membersmin_input 5
		on show "set membersmin_input \"2\""
		param commit_cmd ""
		param abort_cmd ""
		param char_height [_fontLabelSize]
		param border 0
		param keepInput 1
		param type int

	create graphic membersmin_textbox_bg [_offset * 6 + 42]  [_offset * 3 + _buttonHeight] 100 [_fontLabelSize + 2]
		//param color 0.71 0.33 0.13
		param alpha .6
		param image /gui/standard/small_button.s2g

	create label clan_contains_label [_offset * 2] [_offset * 3 + _buttonHeight * 2] 80 [_fontButtonSize + 4]
		param char_height [_fontLabelSize]
		param align left
		param text "Tag or name:"
		param shadow 1

	createvar search_string

	create textbox search_textbox [_offset * 9 + 15] [_offset * 2 + 8 + _buttonHeight * 2] [100 - 12] [_fontLabelSize] search_string
		param commit_cmd ""
		param abort_cmd ""
		param char_height [_fontLabelSize]
		param border 0
		param keepInput 1

	create graphic search_textbox_bg [_offset * 9 + 12] [_offset * 2 + 10 + _buttonHeight * 2] 100 [_fontLabelSize + 2]
		//param color 0.71 0.33 0.13
		param alpha .6
		param image /gui/standard/small_button.s2g


	create button search_action_button [_offset * 9 + 12] [_offset * 5 + 7 + _buttonHeight * 2] 100 [_fontButtonSize + 1]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "GUI_search 1"
		param text "Search..."
		param shadow 1
		param char_height [_fontLabelSize + 2]
		param textcolor .9 .8 0



	set _scrollbarName "search_clan"
	set _titleText "Search Results"
	set _numberRows 27
	set _x [_offset * 2]
	set _y [4 * _offset + _buttonHeight + 55]
	set _width [_widthPanel - 4 * _offset - 16]
	set _numberColumns 4
	set _column1 0.1
	set _column2 0.35
	set _column3 0.5
	set _column4 0.6
	set _c0Text " Icon"
	set _c1Text " Name"
	set _c2Text " Members"
	set _c3Text " Created"
	set _scrollable 1
	set _columnLabels 1
	set _popup_lclick 1
	set _selectable 1
	exec /gui/standard/ui_scroll.cfg


	set _search_btn_group_offset [_offset * 28]

	create button search_prev_page_button [_search_btn_group_offset]  [_offset * 54 + 3 + _buttonHeight] 80 [_fontButtonSize + 1]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command ""
		param text "prev. page"
		param shadow 1
		param char_height [_fontLabelSize]
		param textcolor .9 .8 0

	create label search_current_page_number_label [_search_btn_group_offset + _offset * 13] [_offset * 54 + 5 + _buttonHeight] 80 [_fontButtonSize + 4]
		param char_height [_fontLabelSize + 2]
		param align left
		param text ""
		param shadow 1

	create graphic search_page_bg [_search_btn_group_offset + _offset * 10 + 2] [_offset * 54 + 1 + _buttonHeight] [80] [_fontLabelSize + 10]
		param alpha .6
		param image /gui/standard/small_button.s2g
		param ontop 0

	create button search_next_page_button [_search_btn_group_offset + _offset * 20]  [_offset * 54 + 3 + _buttonHeight] 80 [_fontButtonSize + 1]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command ""
		param text "next page"
		param shadow 1
		param char_height [_fontLabelSize]
		param textcolor .9 .8 0


	create label searchresults_label [_offset] 574 [_widthPanel - 16 - 3 * _offset] [_fontButtonSize + 4]
		param char_height [_fontLabelSize]
		param text "^yFound 72 matches"
		param align right
		param shadow 1



