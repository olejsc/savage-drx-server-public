//=========================================================================
// Clan Management Panel
//=========================================================================

set _widthPanel 850
set _heightPanel 590
set _charHeight 14
set _titlebarSize 16
set _xPanel [(gui_coordWidth - _widthPanel) / 2]
set _yPanel [(gui_coordHeight - _heightPanel + _titlebarSize) / 2]
set _groupSpacing 250
set _scrollDrawModus 0
set _selectedScrollBar ""
set _scrollUp 0
set _scrollDown 0

set _amountButtons 4
set _spacing 20
set _offset 10
set _buttonWidth [(_widthPanel - 2 * _offset - (_amountButtons - 1) * _spacing) / _amountButtons]
set _buttonHeight 30
set _fontButtonSize 18
set _fontLabelSize 15
set _x [_offset]
set _y [_offset]

set _popup_button_width 120
set _popup_button_height 15
set _popup_numberButtons 10

// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------

create panel clanmenu_panel [_xPanel] [_yPanel + _offset]

	set _ind 1

	create button clan_button [_x + (_ind - 1) * (_buttonWidth + _spacing)] [_y] [_buttonWidth] [_buttonHeight]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "clanPanel"
		param text "My Clan"
		param shadow 1
		param char_height [_fontButtonSize]

	inc _ind

	//create button competition_button [_x + (_ind - 1) * (_buttonWidth + _spacing)] [_y] [_buttonWidth] [_buttonHeight]
	//	param up_image /gui/standard/small_button.s2g
	//	param up_hover_image /gui/standard/small_button_over.s2g
	//	param down_image /gui/standard/small_button_down.s2g
	//	param command "competitionPanel"
	//	param text "Competition"
	//	param shadow 1
	//	param char_height [_fontButtonSize]
	//	param enable 0

	inc _ind

	create button search_button [_x + (_ind - 1) * (_buttonWidth + _spacing)] [_y] [_buttonWidth] [_buttonHeight]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "searchPanel"
		param text "Search"
		param shadow 1
		param char_height [_fontButtonSize]

	inc _ind

	create button inbox_button [_x + (_ind - 1) * (_buttonWidth + _spacing)] [_y] [_buttonWidth] [_buttonHeight]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "inboxPanel"
		param text "Invites(?)"
		param shadow 1
		param char_height [_fontButtonSize]

// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------

create panel clan_panel [_xPanel] [_yPanel + _buttonHeight + _offset]

	set _scrollerWidth [(_widthPanel - 2 * _offset - _offset / 2 - 2 * 16 - 16 - _offset) / 2]

	set _scrollbarName "claninfo"
	set _titleText "Clan Info"
	set _numberRows 8
	set _x [_offset]
	set _y [20]
	set _width [_scrollerWidth]
	set _numberColumns 1
	set _c0Text ""
	set _scrollable 0
	set _columnLabels 0
	set _popup_lclick 0
	set _selectable 0
	exec /gui/standard/ui_scroll.cfg

	set _scrollbarName "members"
	set _titleText "Members"
	set _numberRows 22
	set _x [_offset]
	set _y [175]
	set _width [_scrollerWidth]
	set _numberColumns 3
	set _column1 0.4
	set _column2 0.62
	set _c0Text " Player Name"
	set _c1Text " Rank"
	set _c2Text " Last Seen"
	set _scrollable 1
	set _columnLabels 1
	set _popup_lclick 1
	set _selectable 1
	exec /gui/standard/ui_scroll.cfg

	set _scrollerX [2 * _offset + _offset / 2 + _scrollerWidth + 2 * 16]

	set _scrollbarName "my_clans_available"
    set _titleText "Available"
	set _numberRows 19
	set _x [_scrollerX]
	set _y [20]
    set _width [_scrollerWidth]
    set _numberColumns 3
    set _column1 0.2
    set _column2 0.7
    set _c0Text " ID"
    set _c1Text " NAME"
    set _c2Text " JOINED"
    set _scrollable 1
    set _columnLabels 1
    set _popup_lclick 1
    set _selectable 1
    exec /gui/standard/ui_scroll.cfg

	set _scrollbarName "actions"
	set _titleText "Actions"
	set _numberRows 0
	set _x [_scrollerX]
	set _y [375]
	set _width [_scrollerWidth]
	set _numberColumns 1
	set _c0Text ""
	set _scrollable 0
	set _columnLabels 0
	set _popup_lclick 0
	set _selectable 0
	exec /gui/standard/ui_scroll.cfg

	set _spacing2 10
	set _w [(_width - 4 * _spacing2) / 3]

	create button createclan_button [_x + _spacing2] [_y + 5] [_w] [_fontButtonSize + 1]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "show create_clan_dialog_panel; panel focus create_clan_dialog_panel"
		param text "Create Clan"
		param shadow 1
		param char_height [_fontButtonSize]

	create button leaveclan_button [_x + 2 * _spacing2 + _w] [_y + 5] [_w] [_fontButtonSize + 1]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "GUI_showAreYouSure \"clanLeave\" -1"
		param text "Leave Clan"
		param shadow 1
		param char_height [_fontButtonSize]

	create button update_clan_button [_x + 3 * _spacing2 + _w * 2] [_y + 5] [_w] [_fontButtonSize + 1]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "show update_clan_dialog_panel; panel focus update_clan_dialog_panel; GUI_fillClanUpdatePanel"
		param text "^yUpdate Clan"
		param shadow 1
		param char_height [_fontButtonSize]

	create textbuffer clan_info [_x + _offset] [_y + 27] [_width - 2 * _offset] 2
	on show "textbuffer clear clan_info;textbuffer print clan_info \"To view more information about users, clans... left-click entries in the lists\";"
		param char_height [_fontLabelSize]
		param align left
		param shadow 1

	create graphic banner [_x] [_y+ 4*_fontLabelSize] [_width] [6 * _fontLabelSize]
		param url ""

	create graphic actions_bg [_x] [_y] [_width] [10 * _fontLabelSize]
		param alpha .13
		param image /gui/standard/white.s2g

