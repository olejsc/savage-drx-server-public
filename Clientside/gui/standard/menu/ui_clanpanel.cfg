create panel clanManagmentpanel [(gui_coordWidth - 850) / 2] [(gui_coordHeight - 550) / 2]
	create titlebar clanmanagment_title 0 [-_titlebarSize] 850 [_titlebarSize]
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "Clan Manager"
		param hide_cmd "hide clanManagmentpanel;~
						hide clanmenu_panel;~
						hide clan_panel;~
						hide search_panel;~
						hide inbox_panel;~
						hide inbox_read_panel;~
						hide inbox_interactive_panel;~
						hide popup_panel"

	set _x 0
	set _y 0
	set _border 3
	set _width 850
	set _height [_heightPanel]
	set _image human
	exec /gui/standard/ui_frame.cfg

	create graphic clanpanel_panel_background [2] [2] [850 - 4] [_heightPanel - 4]
		param image /gui/standard/black.s2g
		param alpha .9

// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------
// ------------------------------------------------------------------------------------------------------------------------------

create panel popup_panel 0 0

	set _i 1
	for _i 1 [_popup_numberButtons] 1 "~
		create button lclk_button#_i# 0 [(_i - 1) * _popup_button_height] [_popup_button_width] [_popup_button_height];~
			on mouseout \"GUI_hidePopup\";~
			param up_image /gui/standard/small_button.s2g;~
			param up_hover_image /gui/standard/small_button_over.s2g;~
			param down_image /gui/standard/small_button_down.s2g;~
			param char_height [_fontLabelSize];~
			param text_color 1 1 1;~
			param shadow 1;~
			hide popup_panel:lclk_button#_i#"

