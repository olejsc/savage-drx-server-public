//autoupdater gui file
createvar _changelog_scrollvar
create panel autoupdate_panel1 0 0
set _width 640
set _height 205
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

	create label autoupdate_text1 [_x + _width / 2 - 100] [_y + 15] 200 20
		param text "An update to Savage is Available."
		param char_height 20

//	create label autoupdate_text2 [_x + _width / 2 - 100] [_y + 45] 200 20
//		param text "Would You like to Update?"
//		param char_height 20

	create scrollbuffer changelog [_x + 15] [_y + 45] [_width - 30 - 16] [_height - 45 - 60]
		param bg_color 0 0 0
		param textcolor 1 0.8 0
		param selected_bgcolor 0 0 0
		param selected_textcolor 1 .8 0
		param char_height [fontsizemedium]
		param rows 100
		param thickness 0
		param linewrap true
		param scrollvariable  _changelog_scrollvar
		param selectable 0

	create button scroll_up [_x + _width - (16 + 15)] [_y + 42] 16 16
		param up_image "/gui/standard/scrollup.s2g"
		param command "scrollbuffer scroll autoupdate_panel1:changelog -1"
		param repeat true

	create button scroll_down [_x + _width - (16 + 15)] [_y + 45 + _height - 45 - 60 - 12] 16 16
		param up_image "/gui/standard/scrolldown.s2g"
		param command "scrollbuffer scroll autoupdate_panel1:changelog 1"
		param repeat true

	create slider scrollbar [_x + _width - (16 + 15)] [_y + 45 + 16] 16 [_height - 45 - 60 - 16 - 16]
		param handleshader /gui/standard/scrollhandle.s2g
		param bgshader none
		param fillshader none
		param variable _changelog_scrollvar
		param showvalue 0
		param range 1 0

	create graphic changelog_background [_x + 15] [_y + 45] [_width - 30] [_height - 45 - 60]
		param image /gui/standard/white.s2g
		param alpha 0.1

	create button yes [_x + (_width / 2) - 150] [_y + _height - 45] 100 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide autoupdate_panel1; set proceed_with_update 3; show autoupdate_panel2"
		param text "Update"
		param textcolor 0 1 0

	create button no [_x + (_width / 2) + 50] [_y + _height - 45] 100 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide autoupdate_panel1; set proceed_with_update 0"
		param text "Cancel"
		param textcolor 1 0 0

	set _border 8
	set _image neutral
	exec ../ui_frame.cfg
		
	create graphic background [_x] [_y] [_width] [_height]
		param image /gui/standard/black.s2g

	create graphic blackout 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .6
		param interactive 1

create panel autoupdate_panel2 0 0
set _width 360
set _height 140
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

	create label autoupdate_text1 [_x + _width / 2 - 100] [_y + 15] 200 20
		param text "Retrieving files"
		param char_height 20

	create label progress_label [_x + _width / 2 - 100] [_y + 45] 200 16
		param cvar int_au_progress_string
		param char_height 16

	create slider progress_slider [_x + _width / 2 - 165] [_y + 45] 330 20 horizontal
		param range 0 100
		param bgshader "/gui/standard/exp_back.s2g"
		param fillshader "/gui/standard/progressbar.s2g"
		param handleshader "/gui/standard/clear_hack.s2g"
		param showvalue false
		param interactive 0
		param variable int_au_progress
		
	create label autoupdate_text2 [_x + _width / 2 - 300] [_y + 70] 600 16
		param cvar int_au_current_file
		param char_height 16

	create button no [_x + (_width / 2) - 50] [_y + 95] 100 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide autoupdate_panel2; set int_au_cancel 1"
		param text "Cancel"
		param textcolor 1 0 0

	set _border 8
	set _image neutral
	exec ../ui_frame.cfg

	create graphic background [_x] [_y] [_width] [_height]
		param image /gui/standard/black.s2g

	create graphic blackout 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .6
		param interactive 1

create panel autoupdate_panel3 0 0
set _width 360
set _height 100
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

	create label autoupdate_text1 [_x + _width / 2 - 100] [_y + _height/2 - 20/2] 200 20
		param text "Savage is Restarting"
		param char_height 20

	set _border 8
	set _image neutral
	exec ../ui_frame.cfg

	create graphic background [_x] [_y] [_width] [_height]
		param image /gui/standard/black.s2g

	create graphic blackout 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .6
		param interactive 1

create panel autoupdate_panel4 0 0 //error panel
set _width 360
set _height 120
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]

	create label autoupdate_text1 [_x + _width / 2 - 100] [_y + 15] 200 20
		param text "ERROR: Unable to retrieve file"
		param char_height 16

	create label autoupdate_text2 [_x + _width / 2 - 100] [_y + 45] 200 20
		param cvar int_au_current_file
		param char_height 16

	create button close [_x + (_width / 2) + - 50] [_y + 75] 100 30
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide autoupdate_panel4"
		param text "Close"

	set _border 8
	set _image neutral
	exec ../ui_frame.cfg

	create graphic background [_x] [_y] [_width] [_height]
		param image /gui/standard/black.s2g

	create graphic blackout 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .6
		param interactive 1
