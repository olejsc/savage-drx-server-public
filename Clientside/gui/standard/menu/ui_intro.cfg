// Intro Slide Show

//setsave _oneTimeIntro 1
set _iframe 0
set _intro_w 875; set _intro_h 590

create panel "intro_panel" 0 0

create graphic "intro_slide" [(1024-(_intro_w/_sr))/2] [(768-_intro_h)/3] [_intro_w/_sr] [_intro_h]
	param image /gui/standard/intro/i_0.s2g

create panel "intro_panel_back" 0 0

create label "page" 502 712 24 10
	param text "0"
//	param variable _iframe
	param char_height 14

create button "prev" 450 704 [32/_sr] 32
	param up_image none
	param command "select intro_panel:intro_slide;~
			if [_iframe>0] \"inc _iframe -1;\";~
			param image /gui/standard/intro/i_#_iframe#.s2g;~
			fadein intro_panel 500;~
		if [_iframe>=24] \"select intro_panel_back:next; param up_image none; select intro_panel_back:page; param text \"END\";\";~
		if [_iframe<24] \"select intro_panel_back:next; param up_image /gui/standard/rightarrow.s2g;  select intro_panel_back:page; param text #_iframe#;\";~
		if [_iframe>0] \"select intro_panel_back:prev; param up_image /gui/standard/leftarrow.s2g; select intro_panel_back:page; param text #_iframe#;\";~
		if [_iframe<=0] \"select intro_panel_back:prev; param up_image none; select intro_panel_back:page; param text #_iframe#;\";"


create button "next" 550 704 [32/_sr] 32
	param up_image /gui/standard/rightarrow.s2g
	param char_height [fontsizelarge]
	param command "select intro_panel:intro_slide;~
			 if [_iframe<24 & _iframe >=0] \"inc _iframe 1;\";~
			 param image /gui/standard/intro/i_#_iframe#.s2g;~
			 fadein intro_panel 500;~
		if [_iframe>0] \"select intro_panel_back:prev; param up_image /gui/standard/leftarrow.s2g; select intro_panel_back:page; param text #_iframe#;\";~
		if [_iframe>=24] \"select intro_panel_back:next; param up_image none; select intro_panel_back:page; param text \"END\";\";~
		if [_iframe<24] \"select intro_panel_back:next; param up_image /gui/standard/rightarrow.s2g; select intro_panel_back:page; param text #_iframe#;\";~
		if [_iframe<=0] \"select intro_panel_back:prev; param up_image none; select intro_panel_back:page; param text #_iframe#;\";"


create button "back_button" 10 724 128 32
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Close"
		param shadow 1
		param char_height [fontsizemedium]
		param command "hide intro_panel; hide intro_panel_back; setsave _oneTimeIntro 0; playmusic music/a_new_earth.ogg 1"


create graphic _screen_bg 0 0 1024 768
	param image /gui/standard/black.s2g
	param interactive 1

