hideall
createvar verify_pin ""
if [_wide] "createvar _verify_offset [512-512/_sr]; createvar _verify_box 46; createvar _verify_quit 34; createvar _verify_check 44; createvar _verify_log 32; createvar _verify_reg 63"
create panel "verify_panel" [256] 150

	create textbox "pin_box" [219+_verify_box] 238 [212/_sr] 45 verify_pin
		param placeholder "Type emailed code here..."
		param char_height [fontsizelarge]
		param border 0

	create button "resend" [161] 351 [126/_sr] 60
		param text "Resend"
		param char_height 16
		param up_image /gui/standard/medium_button.s2g
		param up_hover_image /gui/standard/medium_button_over.s2g
		param down_image /gui/standard/medium_button_down.s2g
		param command "register_renew"

	create button "verify"    [318] 351 [126/_sr] 60
		param text "Verify"
		param char_height 16
		param up_image /gui/standard/medium_button.s2g
		param up_hover_image /gui/standard/medium_button_over.s2g
		param down_image /gui/standard/medium_button_down.s2g
		param command "verify_GUI #verify_pin#"

	set _x 0
	set _y 0
	set _width 512
	set _height 512
	set _image neutral
	set _border 16
//	exec ../ui_frame.cfg
	
	create graphic "verifybackground" [0+_verify_offset] 0 [512/_sr] 512
		param image "/gui/standard/nfm_verify.s2g"

	create graphic savage_background_cover -256 -150 1024 768
		param image /gui/standard/black.s2g
		param interactive 1
		param alpha .8
