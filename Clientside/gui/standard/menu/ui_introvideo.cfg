hideall
stopmusic

createvar skipintro "~
	hide intro_video;~
	select intro_video:movie;~
		param image unload;~
	set int_introPlaying 0;~
	exec /gui/standard/ui_status_main_menu.cfg"

create panel intro_video 0 0
	create graphic movie 0 100 1024 568
		param movieendcommand "do skipintro"
		param image /video/intro.mp4

	create graphic background 0 0 1024 768
		param image /gui/standard/black.tga
