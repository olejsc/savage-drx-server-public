//=============================================================================================
// Modal error dialog
//=============================================================================================

set _panel_width 510 
set _panel_height 360
set _panel_x 257
set _panel_y 200

create panel xhairs_panel [_panel_x] [_panel_y] [_panel_width] [_panel_height]

create label choice_chain_label 120 30 256 32
		param text "Choose a crosshair:"
		param char_height 24

set _border 12
set _x 0
set _y 0
set _width [_panel_width]
set _height [_panel_height]
set _image neutral

exec ../ui_frame.cfg

set _xindex 1
set _yindex 2
set _cindex 1

