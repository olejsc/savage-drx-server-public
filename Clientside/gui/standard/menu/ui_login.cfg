hideall
if [_wide] "createvar _login_offset [512-512/_sr]; createvar _login_box 46; createvar _login_quit 34; createvar _login_check 44; createvar _login_log 32; createvar _login_reg 63"
create panel "login_panel" [256] 150

	create textbox "nick_box" [219+_login_box] 159 [212/_sr] 45 name
		param char_height [fontsizelarge]
		param border 0

	create textbox "username_box" [219+_login_box] 208 [212/_sr] 45 username
		param placeholder "user@example.com"
		param char_height [fontsizelarge]
		param border 0
			
	create textbox "password_box" [219+_login_box] 257 [212/_sr] 45 password
		param hidden 1
		param char_height [fontsizelarge]
		param border 0

	create button "quit" [284+_login_quit] 429 [126/_sr] 60
		param text "Quit"
		param char_height 16
		param up_image /gui/standard/medium_button.s2g
		param up_hover_image /gui/standard/medium_button_over.s2g
		param down_image /gui/standard/medium_button_down.s2g
		param command "quit"

	create togglebutton autologin_checkbox [223+_login_check] 304 [24/_sr] 24
		param down_image ../human/checkbox_checked.s2g
		param up_image ../human/checkbox_empty.s2g
		param up_hover_image ../human/checkbox_empty.s2g
		param up_command "set autologin 0"
		param command "set autologin 1"
		param variable "autologin"
		param sound "/sound/gui/button_click.ogg"

	create button "login"    [299+_login_log] 304 [126/_sr] 60
		param text "Login"
		param char_height 16
		param up_image /gui/standard/medium_button.s2g
		param up_hover_image /gui/standard/medium_button_over.s2g
		param down_image /gui/standard/medium_button_down.s2g
		param command "login_GUI #username# #password#"

	create textbuffer browser_registration_notification [90+_login_reg] 493 [166/_sr] 60
		param char_height [fontsizesmall]
		param textcolor .8 .7 .2
		param delay_secs 0
		param icon_height [fontsizemedium + 2]
		param rows 1

	textbuffer print browser_registration_notification ~
		"(opens url in a browser)"

	create button "register"    [98+_login_reg] 429 [126/_sr] 60
		param text "Register"
		param char_height 16
		param up_image /gui/standard/medium_button.s2g
		param up_hover_image /gui/standard/medium_button_over.s2g
		param down_image /gui/standard/medium_button_down.s2g
		param command "register_GUI #username# #password# #name#"

	set _x 0
	set _y 0
	set _width 512
	set _height 512
	set _image neutral
	set _border 16
//	exec ../ui_frame.cfg
	
	create graphic "logonbackground" [0+_login_offset] 0 [512/_sr] 512
		param image "/gui/standard/nfm_logon.s2g"

	create graphic savage_background_cover -256 -150 1024 768
		param image /gui/standard/black.s2g
		param interactive 1
		param alpha .8
