create panel "ingamemenu_confirm_panel" 0 0

	create label "message" 385 336 256 64
		param text "QUIT? ARE YOU SURE?"
		param char_height 20

	create button yes_button 377 375 128 64
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "quit"
		param sound "/sound/gui/button_forward.ogg"
		param text "YES"
		param shadow 1
		param char_height 16

	create button no_button 533 375 128 64
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide ingamemenu_confirm_panel; show ingamemenu_panel"
		param sound "/sound/gui/button_back.ogg"
		param text "NO"
		param shadow 1
		param char_height 16

	create graphic black 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .9


//------------------------------------------------------------------------
create panel "ingamemenu_disconnectconfirm_panel" 0 0

	create label "message" 385 336 256 64
		param text "DISCONNECT? ARE YOU SURE?"
		param char_height 20

	create button yes_button 377 375 128 64
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "disconnect; show menu_panel; hide ingamemenu_disconnectconfirm_panel; cl_ingamemenu 0" // UTTAR
		param sound "/sound/gui/button_forward.ogg"
		param text "YES"
		param shadow 1
		param char_height 16

	create button no_button 533 375 128 64
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide ingamemenu_disconnectconfirm_panel; show ingamemenu_panel"
		param sound "/sound/gui/button_back.ogg"
		param text "NO"
		param shadow 1
		param char_height 16

	create graphic black 0 0 1024 768
		param image /gui/standard/black.s2g
		param alpha .9


//------------------------------------------------------------------------

create panel "ingamemenu_panel" 0 0

set _mmenu_y 162

	create button "resume_play" 70 [_mmenu_y-1] 185 64
		param up_image /gui/standard/human_button_5.s2g
		param up_hover_image /gui/standard/human_button_5_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizelarge]
		param text "Resume"
		param shadow 1
		param command "hide ingamemenu_panel; hideingamemenu"

inc _mmenu_y 83


	create button "disconnect_menu" 70 [_mmenu_y-1] 185 64
		param up_image /gui/standard/human_button_2.s2g
		param up_hover_image /gui/standard/human_button_2_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizelarge]
		param command "show ingamemenu_disconnectconfirm_panel"
		param text "Disconnect"
		param shadow 1

inc _mmenu_y 83

	create button "menu_reconnect" 70 [_mmenu_y] 185 64
		param up_image /gui/standard/human_button_4.s2g
		param up_hover_image /gui/standard/human_button_4_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizelarge]
		param shadow 1
		param command "reconnect"
		param text "Reconnect"
        
inc _mmenu_y 83
                                                 
	create button "menu_browser" 70 [_mmenu_y+1] 185 64
		param up_image /gui/standard/human_button_5.s2g
		param up_hover_image /gui/standard/human_button_5_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizelarge]
		param text "Browser"
		param shadow 1
		param command "hideall; show connect_panel; show ingame_connect_panel; favouritelist; gamelist" 

inc _mmenu_y 83

	create button "menu_options" 70 [_mmenu_y+1] 185 64
		param up_image /gui/standard/human_button_2.s2g
		param up_hover_image /gui/standard/human_button_2_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizelarge]
		param command "~
			hide ingamemenu_panel;~
			show options_background;~
			show options_buttons;~
			show options_tabs;~
			show options_player_controls;~
			hide options_cmdr_controls;~
			hide options_graphics;~
			hide options_profile;~
			hide options_crosshair;~
			hide options_game;~
			hide options_video;~
			hide options_network;~
			hide options_sound;~
			hide options_cmdr_controls_adv;~
			if [_showadvancedplr] show options_player_controls_adv;~
			else hide options_player_controls_adv;~
			select options_tabs:pc_o;~
				param textcolor 1 1 .2;~
			select options_tabs:cc_o;~
				param textcolor 1 1 1;~
			select options_tabs:game_o;~
				param textcolor 1 1 1;~
			select options_tabs:sys_o;~
				param textcolor 1 1 1;~
			writeconfig /settings/current.cfg"
		param sound "/sound/gui/button_forward.ogg"
		param text "Options"
		param shadow 1
		param char_height [fontsizelarge]

inc _mmenu_y 83

	create button "menu_clans" 70 [_mmenu_y] 185 64
		param up_image /gui/standard/human_button_4.s2g
		param up_hover_image /gui/standard/human_button_4_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizelarge]
		param text "My Stats"
		param shadow 1
		param command "GUI_statsShow #cl_authUID#"

	create button "menu_quit" 113 660 91 30
		param up_image /gui/standard/human_button_logout.s2g
		param up_hover_image /gui/standard/human_button_logout_over.s2g
		param sound "/sound/gui/button_forward.ogg"
		param char_height [fontsizemedium]
		param text "Quit"
		param shadow 1
		param command "panel focus ingamemenu_confirm_panel; fadein ingamemenu_confirm_panel 500"        


exec ui_background.cfg