//======================================================================================
// Voting Panel
//======================================================================================

set _width 580
set _height 292
//set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]
set _x [15]

create panel votepanel [_x] [_y]
	create titlebar votepanel_title 0 -16 [_width] 16
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "Voting Panel"
		param hide_cmd "hide votepanel"

	set _index 0
	set _x 10
	set _y 10
	set _z 30
	set _width 100
	set _height 24

	create button "votepanel_concede" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Concede"
		param char_height [fontsizemedium]
		param command "callvote concede"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_draw" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Draw"
		param char_height [fontsizemedium]
		param command "callvote draw"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_nextmap" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Next Map"
		param char_height [fontsizemedium]
		param command "callvote nextmap"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z 110
	inc _x [_z]
	set _z 30

	create button "votepanel_shuffle" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Shuffle"
		param char_height [fontsizemedium]
		param command "callvote shuffle"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_elect" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Elect self"
		param char_height [fontsizemedium]
		param command "callvote elect #name#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_restartmatch" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Restart"
		param char_height [fontsizemedium]
		param command "callvote restartmatch"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z 110
	inc _x [_z]
	set _z 30

	create button "votepanel_time" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Extend Time"
		param char_height [fontsizemedium]
		param command "callvote time"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_pause" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Pause"
		param char_height [fontsizemedium]
		param command "callvote pause"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_unpause" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unpause"
		param char_height [fontsizemedium]
		param command "callvote unpause"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set "vote_player" ""
	set _y 107
	set _x 10
	set _z 110
	set _height 22
	set _width 50

	create label votepanel_player [_x] [_y + 2] [_width] [_height] 
		param text "Player:"
		param char_height [fontsizemedium]
		param align left

	create textbox votepanel_playerbox [_x + _width + 15] [_y + 2] [(_width * 5) - 5] [fontsizemedium] vote_player
		param border 0

	create graphic votepanel_player_bg [_x + _width + 10] [_y] [(_width * 5) + 10] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	set _y 152
	set vote_reason ""

	create label votepanel_reason [_x] [_y + 2] [_width] [_height] 
		param text "Reason:"
		param char_height [fontsizemedium]
		param align left

	create textbox votepanel_reasonbox [_x + _width + 15] [_y + 2] [(_width * 5) - 5] [fontsizemedium] vote_reason
		param border 0

	create graphic votepanel_reason_bg [_x + _width + 10] [_y] [(_width * 5) + 10] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	set _y 134
	set _x 10
	set _height [fontsizemedium]
	set _width 320

	create label votepanel_note [_x] [_y] [_width] [_height] 
		param text "* name or a client ID preceded by a #"
		param char_height [fontsizemedium]
		param align left

	             

	set _x 10
	set _y 190
	set _z 110
	set _width 100
	set _height 24

	create button "votepanel_kick_player" [_x + _index * _z] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Kick"
		param char_height [fontsizemedium]
		param command "callvote kick #vote_player#; chat Reason: #vote_reason#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_mute_player" [_x + _index * _z] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Mute"
		param char_height [fontsizemedium]
		param command "callvote mute #vote_player#; chat Reason: #vote_reason#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_elect_player" [_x + _index * _z] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Elect"
		param char_height [fontsizemedium]
		param command "callvote elect #vote_player#"
		param sound "/sound/gui/button_click.ogg"

	set _y 220
	set _index 0

	create button "votepanel_lockspec_player" [_x + _index * _z] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "LockSpec"
		param char_height [fontsizemedium]
		param command "callvote lockspec #vote_player#; chat Reason: #vote_reason#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_nocomm_player" [_x + _index * _z] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "NoComm"
		param char_height [fontsizemedium]
		param command "callvote nocomm #vote_player#; chat Reason: #vote_reason#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "votepanel_impeach" [_x + _index * _z] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Impeach"
		param char_height [fontsizemedium]
		param command "callvote Impeach"
		param sound "/sound/gui/button_click.ogg"


	set _y 260
	set _x 10
	set _height 22
	set _width 50
	set vote_msg ""

	create label votepanel_msg [_x] [_y + 2] [_width] [_height] 
		param text "Msg:"
		param char_height [fontsizemedium]
		param align left

	create textbox votepanel_msgbox [_x + _width + 15] [_y + 1] [(_width * 3) - 15] [fontsizemedium] vote_msg
		param border 0
		param commit_cmd "callvote msg #vote_msg#"

	create graphic votepanel_msg_bg [_x + _width + 10] [_y-1] [_width * 3] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	create button "votepanel_msg_vote" [_x + (_width * 4) + 20] [_y] [_width * 2] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Message"
		param char_height [fontsizemedium]
		param command "callvote msg #vote_msg#"
		param sound "/sound/gui/button_click.ogg"

set "vote_worldlistfilter" ""

	set _y 10
	set _x 350
	set _width 220

	create menu votepanel_maplist [_x] [_y] [_width*3/3]
		param trim ".s2z"
		param bg_color .1 .1 .1
		param highlight_color 1 1 .2
		param sound "/sound/gui/button_click.ogg"
		param visible_items 15
                                                                                                                                                           
	set _y 30
	set _width 220
	set _height 220

	create graphic votepanel_minimap [_x] [_y] [_width] [_height]

	menu itemizefiles votepanel:votepanel_maplist /world #vote_worldlistfilter#*.s2z "graphic param votepanel:votepanel_minimap image world/#votepanel:votepanel_maplist#_overhead.jpg";
	menu select votepanel:votepanel_maplist #votepanel:votepanel_maplist#

	set _x 350
	set _y 258
	set _width 100
	set _height 24

	create label votepanel_filter [_x+5] [_y+2] [_width] [_height] 
		param text "Filter:"
		param char_height [fontsizemedium]
		param align left

	create textbox votepanel_worldfilterbox 405 [_y] 55 [fontsizemedium] vote_worldlistfilter
		param border 0
		param commit_cmd "menu clear votepanel:votepanel_maplist; menu itemizefiles votepanel:votepanel_maplist /world #vote_worldlistfilter#*.s2z \"graphic param votepanel:votepanel_minimap image world/#votepanel:votepanel_maplist#_overhead.jpg\";";
	
	create graphic votepanel_filter_bg 400 [_y] [65] [fontsizemedium + 7]
		param image /gui/standard/small_button.s2g
		param alpha .6

	set _x 470

	create button "votepanel_world" [_x] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Load map"
		param char_height [fontsizemedium]
		param command "callvote world #votepanel:votepanel_maplist#"
		param sound "/sound/gui/button_click.ogg"
		
	set _x 0
	set _y 0
	set _border 3
	set _width 580
	set _height 292
	set _image neutral
	exec /gui/standard/ui_frame.cfg
	set _gap 0.7
	exec /gui/standard/ui_dropshadow.cfg

	set _width 341

	create graphic "votepanel_seperator1" [_x] 100 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "votepanel_seperator2" [_x] 182 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "votepanel_seperator3" [_x] 250 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "votepanel_seperator4" [_width - 2] 0 2 [_height]
		param image /gui/standard/white.s2g
		param alpha .4

	set _width 580

	create graphic votepanel_panel_background [_x + 2] [_y + 2] [_width - 4] [_height - 4]
	param image /gui/standard/black.s2g
	param alpha .8
