//=============================================================================================
// Modal error dialog
//=============================================================================================

if [_wide] set _tut_wide_offset 30
if [!_wide] set _tut_wide_offset 0

set _panel_width 720 
set _panel_height 510
set _panel_x 0
set _panel_y 0
set _button_char_height 22

create panel "tutorial_panel" [_panel_x] [_panel_y] [_panel_width] [_panel_height]

create button "ingame_back_button" 0 736 64 32
		param up_image /gui/standard/medium_button.s2g
		param up_hover_image /gui/standard/medium_button_over.s2g
		param down_image /gui/standard/medium_button_down.s2g
		param text "Back"
		param shadow 1
		param char_height [fontsizesmall]
		param command "set cl_enablecustomModels #customTemp#; hide tutorial_panel; show menu_panel"
		param sound "/sound/gui/button_click.wav"
		param alpha 1


set _label_x 255
set _label_y 75
set _label_back_width 384
set _label_back_height [_label_back_width/3.5]
set _label_horz_offset [_label_back_width/2]
set _label_vert_offset 1


create label _listen_label [_label_x] [_label_y] 1 1 
	param char_height 34
	param text "Listen"
	param shadow 1
	param align center

create graphic listen_back  [_label_x - _label_horz_offset + _tut_wide_offset/_sr] [_label_y - _label_vert_offset] [_label_back_width/_sr] [_label_back_height]
	param image /gui/standard/demo_back.s2g


set _label_x [1024-_label_x]

create label _listen_label [_label_x] [_label_y] 1 1 
	param char_height 34
	param text "Practice"
	param shadow 1
	param align center

create graphic listen_back  [_label_x - _label_horz_offset + _tut_wide_offset/_sr] [_label_y - _label_vert_offset] [_label_back_width/_sr] [_label_back_height]
	param image /gui/standard/demo_back.s2g


set _label_x 512
set _label_y 605
set _label_back_width 512
set _label_back_height [_label_back_width/3.5]
set _label_horz_offset [_label_back_width/2]
set _label_vert_offset 1

create label _listen_label [_label_x] [_label_y+5] 1 1 
	param char_height 34
	param text "Watch"
	param shadow 1
	param align center

create graphic listen_back  [_label_x - _label_horz_offset + _tut_wide_offset*_sr] [_label_y - _label_vert_offset] [_label_back_width/_sr] [_label_back_height]
	param image /gui/standard/demo_back.s2g



//==============================================TUTORIALS

set _tutorial_xpos [32+ _tut_wide_offset]
set _tutorial_ypos 130
set _tutorial_size [_tut_image_size / 2]
set _tutorial_offset 0
set _tut_spacing [1.16/_sr]

set _tut_frame_offset 14
set _tut_image_size 210
set _tut_vert_offset [_tut_image_size * 0.88]
set _tut_horz_offset 10

set _border 8
set _width [(_tut_image_size + _tut_frame_offset)/_sr]
set _height [_tut_image_size + _tut_frame_offset]
set _x [_tutorial_xpos - _tut_frame_offset / 2 + _tutorial_offset]
set _y [_tutorial_ypos - _tut_frame_offset / 2]
set _image neutral
set _frame_alpha 1
exec ../ui_frame.cfg

create label _tutorial_label_h [_tutorial_xpos + _tut_horz_offset + _tutorial_offset] [_tutorial_ypos+_tut_vert_offset] 1 1 
	param char_height [_button_char_height]
	param text "Human Tutorial"
	param shadow 1
	param align left

create button _tutorial_h [_tutorial_xpos + _tutorial_offset] [_tutorial_ypos] [_tut_image_size/_sr] [_tut_image_size]
	param up_image /gui/standard/race1.s2g
	param align left
	param command "svr_broadcast 0; world xr_tutorial_h1 0; sv_authdisable 1;"
	param sound "/sound/general/building_place.wav"
	param dropshadow 1
	param sound "/sound/gui/button_click.ogg"

set _tutorial_offset [_tut_image_size * _tut_spacing]

set _border 8
set _width [(_tut_image_size + _tut_frame_offset)/_sr]
set _height [_tut_image_size + _tut_frame_offset]
set _x [_tutorial_xpos - _tut_frame_offset / 2 + _tutorial_offset]
set _y [_tutorial_ypos - _tut_frame_offset / 2]
set _image neutral
set _frame_alpha 1
exec ../ui_frame.cfg

create label _tutorial_label_b [_tutorial_xpos + _tut_horz_offset + _tutorial_offset] [_tutorial_ypos+_tut_vert_offset] 1 1 
	param char_height [_button_char_height]
	param text "Beast Tutorial"
	param shadow 1
	param align left

create button _tutorial_b [_tutorial_xpos + _tutorial_offset] [_tutorial_ypos] [_tut_image_size/_sr] [_tut_image_size]
	param up_image /gui/standard/race2.s2g
	param align left
	param command "svr_broadcast 0; world xr_tutorial_b1 0; sv_authdisable 1"
	param sound "/sound/general/building_place.wav"
	param dropshadow 1
	param sound "/sound/gui/button_click.ogg"

