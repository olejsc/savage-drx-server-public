//==============================================REPLAYS

if [_wide] "set _replay_offset 70; set _tutorial_offset 12"
set _replay_column_offset 10

set _replay_vertical_pos 450
set _replay_vertical_increase 0
set _replay_horizontal_pos 30
set _replay_horizontal_increase [332 / _sr]
set _replay_bleed 10
set _replay_height 148
set _replay_width [_replay_height*2]
set _replay_frame_bleed 14
set _replay_fix 4

set _replay_frame_width [_replay_width + 12]
set _replay_frame_height [_replay_height + 12]

set _border 8
set _width [_replay_frame_width/_sr]
set _height [_replay_frame_height]
set _x [_replay_horizontal_pos +_replay_offset + _replay_column_offset - _replay_frame_bleed]
set _y [_replay_vertical_pos - _replay_frame_bleed]
set _image neutral
set _frame_alpha 1
exec ../ui_frame.cfg                    

create label _demolegion_label [_replay_horizontal_pos + _replay_offset + _replay_column_offset] [_replay_vertical_pos - _replay_fix] 1 1
	param char_height [_button_char_height]
	param align left
	param text "Humans Replay"
	param shadow 1

create button _demolegion [_replay_horizontal_pos - _replay_bleed +_replay_offset + _replay_column_offset] [_replay_vertical_pos-_replay_bleed] [_replay_width/_sr] [_replay_height]
	param up_image /gui/standard/humans_demo.s2g
	param shadow 1
	param command "demo humans.tutorial"
	param alpha 1.0
	param sound "/sound/gui/button_click.ogg"
	param dropshadow 1


set _replay_horizontal_pos [_replay_horizontal_pos + _replay_horizontal_increase]

set _border 8
set _width [_replay_frame_width/_sr]
set _height [_replay_frame_height]
set _x [_replay_horizontal_pos +_replay_offset + _replay_column_offset - _replay_frame_bleed]
set _y [_replay_vertical_pos - _replay_frame_bleed]
set _image neutral
set _frame_alpha 1
exec ../ui_frame.cfg                    

create label _demoduels_label [_replay_horizontal_pos + _replay_offset + _replay_column_offset] [_replay_vertical_pos - _replay_fix] 1 1
	param char_height [_button_char_height]
	param align left
	param text "Duels Replay"
	param shadow 1

create button _demoduels [_replay_horizontal_pos - _replay_bleed +_replay_offset + _replay_column_offset] [_replay_vertical_pos-_replay_bleed] [_replay_width/_sr] [_replay_height]
	param up_image /gui/standard/duels_demo.s2g
	param shadow 1
	param command "demo duels.tutorial"
	param alpha 1.0
	param sound "/sound/gui/button_click.ogg"
	param dropshadow 1

set _replay_horizontal_pos [_replay_horizontal_pos + _replay_horizontal_increase]


set _border 8
set _width [_replay_frame_width/_sr]
set _height [_replay_frame_height]
set _x [_replay_horizontal_pos +_replay_offset + _replay_column_offset - _replay_frame_bleed]
set _y [_replay_vertical_pos - _replay_frame_bleed]
set _image neutral
set _frame_alpha 1
exec ../ui_frame.cfg                    

create label _demohorde_label [_replay_horizontal_pos + _replay_offset + _replay_column_offset] [_replay_vertical_pos - _replay_fix] 1 1
	param char_height [_button_char_height]
	param align left
	param text "Beasts Replay"
	param shadow 1

create button _demohorde [_replay_horizontal_pos - _replay_bleed +_replay_offset + _replay_column_offset] [_replay_vertical_pos-_replay_bleed] [_replay_width/_sr] [_replay_height]
