//======================================================================================
// Ignore System Panel
//======================================================================================

set _width 406
set _height 292
//set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]
set _x [1024 - _width - 15]

create panel ignorepanel [_x] [_y]
	create titlebar ignorepanel_title 0 -16 [_width] 16
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "Ignore Panel"
		param hide_cmd "hide ignorepanel"
		
	set "ignore_player" ""
	set _x 10
	set _y 10
	set _z 30
	set _height 22
	set _width 50

	create label ignorepanel_player [_x] [_y + 2] [_width] [_height] 
		param text "Player*:"
		param char_height [fontsizemedium]
		param align left

	create textbox ignorepanel_playerbox [_x + _width + 15] [_y + 2] [(_width * 6) - 5] [fontsizemedium] ignore_player
		param border 0

	create graphic ignorepanel_player_bg [_x + _width + 10] [_y] [(_width * 6) + 10] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6
		
	create label ignorepanel_note [_x] [_y + _z] [_width] [_height] 
		param text "* Name, GUID, UID, or Index"
		param char_height [fontsizemedium]
		param align left

	set _index 0
	//set _x 10
	set _y 70
	//set _z 30
	set _width 124
	set _height 24

	create button "ignorepanel_ignore" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore Name"
		param char_height [fontsizemedium]
		param command "ignore #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "ignorepanel_unignore" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unignore Name"
		param char_height [fontsizemedium]
		param command "unignore #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "ignorepanel_ignorenum" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore Name by Num"
		param char_height [fontsizemedium]
		param command "ignorenum #ignore_player#"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index
		
	create button "ignorepanel_unignorenum" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unignore Name by Num"
		param char_height [fontsizemedium]
		param command "unignorenum #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z [_width+8]
	inc _x [_z]
	set _z 30

	create button "ignorepanel_ignoreguid" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore GUID"
		param char_height [fontsizemedium]
		param command "ignoreguid #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "ignorepanel_unignoreguid" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unignore GUID"
		param char_height [fontsizemedium]
		param command "unignoreguid #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "ignorepanel_ignoreguidnum" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore GUID by Num"
		param char_height [fontsizemedium]
		param command "ignoreguidnum #ignore_player#"
		param sound "/sound/gui/button_click.ogg"
	
	inc _index
	
	create button "ignorepanel_unignoreguidnum" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unignore GUID by Num"
		param char_height [fontsizemedium]
		param command "unignoreguidnum #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index
	
	create button "ignorepanel_ignoreguidbyname" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore GUID by Name"
		param char_height [fontsizemedium]
		param command "ignoreguidbyname #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z [_width+8]
	inc _x [_z]
	set _z 30
	
	create button "ignorepanel_ignoreuid" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore UID"
		param char_height [fontsizemedium]
		param command "ignoreuid #ignore_player#"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index

	create button "ignorepanel_unignoreuid" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unignore UID"
		param char_height [fontsizemedium]
		param command "unignoreuid #ignore_player#"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index

	create button "ignorepanel_ignoreuidnum" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore UID by Num"
		param char_height [fontsizemedium]
		param command "ignoreuidnum #ignore_player#"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index

	create button "ignorepanel_unignoreuidnum" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unignore UID by Num"
		param char_height [fontsizemedium]
		param command "unignoreuidnum #ignore_player#"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index

	create button "ignorepanel_ignoreuidbyname" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Ignore UID by Name"
		param char_height [fontsizemedium]
		param command "ignoreuidbyname #ignore_player#"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _x 10
	set _y 230

	create button "ignorepanel_ignorenameclear" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Clear Ignored Names"
		param char_height [fontsizemedium]
		param command "ignorenameclear"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "ignorepanel_listignore" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "List Ignored"
		param char_height [fontsizemedium]
		param command "listignore"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z [_width+8]
	inc _x [_z]
	set _z 30
	
	create button "ignorepanel_ignoreguidclear" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Clear Ignored GUIDs"
		param char_height [fontsizemedium]
		param command "ignoreguidclear"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index
		
	create button "ignorepanel_ignorelist" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "List Full Ignorelist"
		param char_height [fontsizemedium]
		param command "ignorelist"
		param sound "/sound/gui/button_click.ogg"
		
	set _index 0
	set _z [_width+8]
	inc _x [_z]
	set _z 30
	
	create button "ignorepanel_ignoreuidclear" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Clear Ignored UIDs"
		param char_height [fontsizemedium]
		param command "ignoreuidclear"
		param sound "/sound/gui/button_click.ogg"
		
	inc _index
		
	create button "ignorepanel_ignorehelp" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "HELP"
		param char_height [fontsizemedium]
		param command "ignorehelp"
		param sound "/sound/gui/button_click.ogg"
		
	set _x 0
	set _y 0
	set _border 3
	set _width 406
	set _height 292
	set _image neutral
	exec /gui/standard/ui_frame.cfg
	set _gap 0.7
	exec /gui/standard/ui_dropshadow.cfg

	set _width 406

	create graphic "ignorepanel_seperator1" [_x] 126 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "ignorepanel_seperator2" [_x] 186 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "ignorepanel_seperator3" [_x] 220 [_width - 2] 4
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic ignorepanel_panel_background [_x + 2] [_y + 2] [_width - 4] [_height - 4]
	param image /gui/standard/black.s2g
	param alpha .8
