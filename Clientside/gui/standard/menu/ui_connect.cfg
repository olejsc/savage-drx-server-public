// wjd - Server password panel
set _x 0
set _y 16
set _border 3
set _image neutral
set _width 310
set _height 148

create panel connect_password_panel [512-_width/2] [384-_height/2]
	create titlebar title 0 0 [_width] 16
		param hide_cmd "hide connect_password_panel; set host_gotPassword 0"

	inc _height -16
	exec ../ui_frame.cfg
	inc _height 16

	create label msg 16 37 [_width] 20
		param text "Please enter this server's password"
		param char_height [fontsizemedium]
		param align left

	create label pwdlabel [_width/2-100] 70 100 32
		param text "Password: "
		param align right
		param char_height [fontsizesmall]

	create textbox pwd [_width/2+10] 70 100 16 cl_password
		param dropshadow 1
		param border 0
		param hidden 0 // UTTAR

	create graphic pwdbg [_width/2+10] 68 110 20
		param image /gui/standard/white.s2g
		param alpha 0.2

	create button connect [_width/2-96/2] 105 96 24
		param text "Connect"
		param shadow 1
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g

	create graphic bg 0 16 [_width] [_height-16]
		param image /gui/standard/black.s2g
		param interactive 1

	param gap 0.7
	set _y 0
	exec ../ui_dropshadow.cfg
	set _y 16

// wjd - Wait for free slot panel
set _width 264
set _height 80
set _image neutral
create panel waiting_server_panel [512-_width/2] [384-_height/2]
	create titlebar title 0 0 [_width] 16
		on show "select waiting_server_panel:title; param title \"Connecting to \"#gamelist_waiting_server_ip#\":\"#gamelist_waiting_server_port#\"\";~
				set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
		param title ""
		param hide_cmd "hide waiting_server_panel"

	exec ../ui_frame.cfg
	create label waitlabeltitle 8 32 [_width] [_height]
		param text "Waiting for a free slot"
		param char_height 18
	create label waitlabelicon 10 24 45 32
		param text "^icon ../loading/nfm_loading^"
		param char_height 32
		param align left
	create label waitlabel 0 70 90 32
		param text "Retrying in"
		param align right
		param char_height [fontsizesmall]
	create label countdown 100 70 10 32
		param cvar gamelist_nextretry
		param precision 1
		param align left
		param char_height [fontsizesmall]
	create label units 125 70 50 32
		param text seconds
		param precision 1
		param align left
		param char_height [fontsizesmall]
	create label connprob 195 50 50 50
		param text "^icon ../icons/network^"
		param char_height 32
	create graphic bg 1 18 [_width-2] [_height-1]
		on hide "clear gamelist_waiting_server_ip"
		param image /gui/standard/black.s2g
		param interactive 1

	set _gap 0.7
	set _x 0
	set _y 0
	set _height [_height+16]
	exec /gui/standard/ui_dropshadow.cfg
hide waiting_server_panel:connprob
	
// -- end wjd



