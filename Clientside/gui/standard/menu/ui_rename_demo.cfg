// EX2: Rename demo file

createvar _error 1
renamefile /demos/#_demos_var# /demos/#_demolist_newname# _error
strlen _error answer
if [answer] "set _error_icon 1;~
             set _demolist_newname #_demos_var#;~
             set _title \"Error renaming file\";~
             show modal_error_panel;~
             goto end"

o_scrollbuffer clearline demos_panel:demolist

o_scrollbuffer print demos_panel:demolist #_demolist_newname# #_demolist_newname#
getdemoinfo demos_panel:demolist
o_scrollbuffer needssorting demos_panel:demolist 0

@end