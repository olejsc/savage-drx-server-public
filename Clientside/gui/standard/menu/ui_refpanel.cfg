//======================================================================================
// Referee Panel
//======================================================================================

set _width 580
set _height 400
set _x [(1024 / 2) - (_width / 2)]
set _y [(768 / 2) - (_height / 2)]
createvar ref_world

create panel refpanel [_x] [_y]
	create titlebar title 0 -16 [_width] 16
		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg; menu select refpanel:maplist #world_name#"
		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"
		param title "Referee Panel"
		param hide_cmd "hide refpanel"

	set _index 0
	set _x 10
	set _y 10
	set _z 30
	set _width 100
	set _height 24

	create button "rstart" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Start"
		param char_height [fontsizemedium]
		param command "ref startmatch"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rdraw" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Draw"
		param char_height [fontsizemedium]
		param command "ref draw"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rnextmap" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Next Map"
		param char_height [fontsizemedium]
		param command "ref nextmap"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z 110
	inc _x [_z]
	set _z 30

	create button "rstopvote" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Stop Vote"
		param char_height [fontsizemedium]
		param command "ref stopvote"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rreflist" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Reflist"
		param char_height [fontsizemedium]
		param command "reflist"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rrestartmatch" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Restart"
		param char_height [fontsizemedium]
		param command "ref restartmatch"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set _z 110
	inc _x [_z]
	set _z 30

	create button "rtime" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Extend Time"
		param char_height [fontsizemedium]
		param command "ref time"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rpause" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Pause"
		param char_height [fontsizemedium]
		param command "ref pause"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "runpause" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unpause"
		param char_height [fontsizemedium]
		param command "ref unpause"
		param sound "/sound/gui/button_click.ogg"

	inc _index
	inc _y 10

	create button "rshuffle" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Shuffle"
		param char_height [fontsizemedium]
		param command "ref shuffle"
		param sound "/sound/gui/button_click.ogg"

	inc _index
set _lmsg "#lmsg#"
setsave "lmsg" "^yCheck the console or look at debug.log for ^yclient list"

	create button "rclients" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "List Clients"
		param char_height [fontsizemedium]
		param command "listclients; notifymsg #lmsg#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rswitchteam" [_x] [_y + _index * _z] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Switchteam"
		param char_height [fontsizemedium]
		param command "ref switchteam #ref_team# #ref_player#"
		param sound "/sound/gui/button_click.ogg"

	set _index 0
	set "ref_player" ""
	set _y 110
	set _x 10
	set _z 110
	set _height 22
	set _width 50

	create label ref_enter_player [_x] [_y + 2] [_width] [_height] 
		param text "Player:"
		param char_height [fontsizemedium]
		param align left

	create textbox refenterplayerbox [_x + _width + 15] [_y + 2] [(_width * 3) - 15] [fontsizemedium] ref_player
		param border 0

	create graphic refenterplayer_bg [_x + _width + 10] [_y] [_width * 3] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	set _y 142
	set "ref_team" ""

	create label rteam [_x] [_y + 2] [_width] [_height] 
		param text "Team:"
		param char_height [fontsizemedium]
		param align left

	create textbox rteambox [_x + _width + 15] [_y + 2] [(_width * 3) - 15] [fontsizemedium] ref_team
		param border 0

	create graphic rteam_bg [_x + _width + 10] [_y] [_width * 3] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	set _y 168
	set _x 10
	set _height [fontsizemedium]
	set _width 320

	create label rnote [_x] [_y] [_width] [_height] 
		param text "Player may be a player name"
		param char_height [fontsizemedium]
		param align left

	create label rnote2 [_x] [_y + fontsizemedium + 2] [_width] [_height] 
		param text "or a client ID preceded by a #"
		param char_height [fontsizesmall]
		param align left

	set _width 100
	set _height 24

	create button "rkick_player" 10 218 [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Kick"
		param char_height [fontsizemedium]
		param command "ref kick #ref_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "rmute_player" 120 218 [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Mute"
		param char_height [fontsizemedium]
		param command "ref mute #ref_player#"
		param sound "/sound/gui/button_click.ogg"

	inc _index

	create button "relect_player" 230 218 [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Elect"
		param char_height [fontsizemedium]
		param command "ref setcmdr #ref_player#"
		param sound "/sound/gui/button_click.ogg"

	create button "rslay_player" 10 247 [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Slay"
		param char_height [fontsizemedium]
		param command "ref slay #ref_player#"
		param sound "/sound/gui/button_click.ogg"

	create button "runmute_player" 120 247 [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Unmute"
		param char_height [fontsizemedium]
		param command "ref unmute #ref_player#"
		param sound "/sound/gui/button_click.ogg"

	create button "rimpeach_team" 230 247 [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Impeach"
		param char_height [fontsizemedium]
		param command "ref impeach #ref_team#"
		param sound "/sound/gui/button_click.ogg"

	set _y 290
	set _x 10
	set _height 22
	set _width 50
	set "ref_team" ""
	set "ref_race" "human"

	create label rteam2 [_x] [_y + 2] [_width] [_height] 
		param text "Team:"
		param char_height [fontsizemedium]
		param align left

	create textbox rteam2box [_x + _width + 15] [_y + 2] [(_width * 3) - 15] [fontsizemedium] ref_team
		param border 0

	create graphic rteam2_bg [_x + _width + 10] [_y] [_width * 3] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	set _y 320

	create label rrace [_x] [_y + 2] [_width] [_height] 
		param text "Race:"
		param char_height [fontsizemedium]
		param align left

	create textbox rracebox [_x + _width + 15] [_y + 2] [(_width * 3) - 15] [fontsizemedium] ref_race
		param border 0

	create graphic rrace_bg [_x + _width + 10] [_y] [_width * 3] [fontsizemedium + 8]
		param image /gui/standard/small_button.s2g
		param alpha .6
	set _height 35
	set _y 300

	create button "rrace" [_x + (_width * 4) + 20] [_y] [_width * 2] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Change Race"
		param char_height [fontsizemedium]
		param command "ref setrace #ref_team# #ref_race#; ref restartmatch"
		param sound "/sound/gui/button_click.ogg"


	set _y 10
	set _x 350
	set _width 220

	create menu maplist [_x] [_y] [_width]
		param trim ".s2z"
		param bg_color .1 .1 .1
		param highlight_color 1 1 .2
		param sound "/sound/gui/button_click.ogg"

	set _y 32
	set _width 220
	set _height 220

	create graphic minimap [_x] [_y] [_width] [_height]
	menu itemizefiles refpanel:maplist /world *.s2z "set ref_world #refpanel:maplist#; graphic param refpanel:minimap image world/#ref_world#_overhead.jpg";
	menu select refpanel:maplist #ref_world#

	set _x 420
	set _y 260
	set _width 100
	set _height 24

	create button "rworld" [_x] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "Load map"
		param char_height [fontsizemedium]
		param command "ref world #ref_world#"
		param sound "/sound/gui/button_click.ogg"
	set _x 410
	set _y 310
	set _width 120
	set _height 34

	create button "rlogout" [_x] [_y] [_width] [_height]
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param text "LogOut"
		param char_height [fontsizemedium]
		param command "ref unref; hide refpanel"
		param sound "/sound/gui/button_click.ogg"


	set _x 0
	set _y 0
	set _border 3
	set _width 580
	set _height 360
	set _image neutral
	exec /gui/standard/ui_frame.cfg
	set _gap 0.7
	exec /gui/standard/ui_dropshadow.cfg


	set _width 340

	create graphic "seperator1" [_x] 100 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "seperator2" [_x] 208 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "seperator3" [_x] 280 [_width - 2] 2
		param image /gui/standard/white.s2g
		param alpha .4

	create graphic "seperator4" [_width - 2] 0 2 [_height]
		param image /gui/standard/white.s2g
		param alpha .4

	set _width 580

	create graphic rpanel_background [_x + 2] [_y + 2] [_width - 4] [_height - 4]
	param image /gui/standard/black.s2g
	param alpha .7
