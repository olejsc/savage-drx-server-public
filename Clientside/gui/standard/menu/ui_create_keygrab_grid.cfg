set _cvar custom_#_cvar#

create label #_cvar#_label[_x][_y] [_x + (56 * (_index % 4)) + 4] [_y + (56 * floor (_index / 4)) + 41] 48 12
	param align right
	param char_height 10
	param textcolor .8 .7 .2
	param shadow 1
	param cvar #_cvar#

create button #_cvar#_button[_x][_y] [_x + (56 * (_index % 4))] [_y + (56 * floor (_index / 4))] 48 48
	param up_image #_image#
	param mouseover_command "~
		set menu_grid_popup_name \"$_name$\";~
		textbuffer clear gpdb;~
		textbuffer print gpdb \"$_description$\""
	param mouseaway_command "~
		set menu_grid_popup_name \"\";~
		textbuffer clear gpdb"
	param command "keygrab activate options_cmdr_gridmenus:$_cvar$_keygrab$_x$$_y$"

create keygrab #_cvar#_keygrab[_x][_y] [_x + (56 * (_index % 4))] [_y + (56 * floor (_index / 4))] 48 48 keyhit_noticepanel
	param cvar #_cvar#
	param commit_cmd "setsave $_cvar$ \#$_cvar$\#; unbind ESC; unbind LBUTTON; unbind SHIFT"
