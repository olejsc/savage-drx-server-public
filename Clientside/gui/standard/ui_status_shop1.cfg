//executed when the player enters the unit configuration screen for FPS mode

hideall

//exec #gui_basepath#/ui_refresh_race.cfg

set cl_tip_x 25
set cl_tip_y 700

show preset_menu_panel
if [_preset_previous_team != player_team] "~
	set _preset_previous_team #player_team#;~
	if [player_team > 0] \"exec /gui/standard/ui_update_preset_panel.cfg\""

show playerShop_panel
show weapon_panel
show item_panel
show unit_panel
show playerInfo_panel
show unit_select_money
show unit_select_buttons
show unit_pending_request_panel

show unit_select_window
show notification_panel
show unit_select_notification_window
show unit_#current_unit#_panel
show unit_select_go_panel
show inventory_shop_panel
show unit_select_gold_panel
show loadout_chat
show unit_select_background

clearIEventAssociations
setIEventScript money #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript inventory #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript trigger #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript research #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript ammo #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript request #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript commander #gui_basepath#/ui_refresh_unit_select1.cfg
setIEventScript vote #gui_basepath#/ui_refresh_vote.cfg
setIEventScript deployment #gui_basepath#/ui_refresh_unit_select_item_deployment.cfg
triggerIEvent
