//=============================================================================================
//Item panel - Doesn't use the old objloop for SH
//
//All the formatting can be done by changing the value of these cvars
//=============================================================================================
createvar _itemPanelBorder 16

createvar _itemPanelXCushion 24
createvar _itemPanelYCushion 8

createvar _itemPanelCols 4
createvar _itemPanelRows 2

createvar _itemPanelIconSize 48
createvar _itemPanelXSpacing 39
createvar _itemPanelYSpacing 32
createvar _itemPanelCostCharHeight 14
createvar _itemPanelNameCharHeight 12
createvar _itemPanelAmmoCharHeight 18

createvar _itemPanelRequestWidth [_itemPanelIconSize]
createvar _itemPanelRequestHeight [_itemPanelIconSize / 3]

createvar _itemPanelTabWidth 128
createvar _itemPanelTabHeight [_itemPanelTabWidth / 2]

//width and height are determined automatically
set _temp [(_itemPanelBorder * 2)]
createvar _itemPanelWidth [_temp + (_itemPanelXCushion * 2) + _itemPanelCols ~
		* (_itemPanelIconSize + _itemPanelXSpacing) - _itemPanelXSpacing]
createvar _itemPanelHeight [_temp + (_itemPanelYCushion * 2) + _itemPanelRows ~
		* (_itemPanelIconSize + _itemPanelYSpacing + _itemPanelCostCharHeight) ~
		- _itemPanelYSpacing]

createvar _itemPanelX 54
createvar _itemPanelY 25

//createvar _itemPanelX [_weaponPanelX + (_weaponPanelWidth / 2) - (_itemPanelWidth / 2)]
//createvar _itemPanelY [_weaponPanelY + _weaponPanelHeight + 30]
//=============================================================================================
//This does the dirty work of laying out the panel graphics and creating the item panels

set _shop_x 2
set _shop_y 250
set _shop_width 50
set _shop_height 10
set _shop_labelx 0
set _shop_labely 0


create panel shop_Heroes_human [_shop_x] [_shop_y]
	set _index 0; objloop INCLUDE 1 NOWRAP FORWARD objclass unit race human shopIdOnly 11 "exec ui_create_unit_panel_SH.cfg"
create panel shop_Heroes_beast [_shop_x] [_shop_y]
	set _index 0; objloop INCLUDE 1 NOWRAP FORWARD objclass unit race beast shopIdOnly 11 "exec ui_create_unit_panel_SH.cfg"

create panel shop_Melee_human [_shop_x] [_shop_y]
//	set _index 0; 
// objloop INCLUDE 1 NOWRAP FORWARD objclass melee race human "exec ui_create_item_panel_SH.cfg"
create panel shop_Melee_beast [_shop_x] [_shop_y]
//	set _index 0;
// objloop INCLUDE 1 NOWRAP FORWARD objclass melee race beast "exec ui_create_item_panel_SH.cfg"

create panel shop_Ranged_human [_shop_x] [_shop_y]
	set _index 0;
	objloop INCLUDE 1 NOWRAP FORWARD objclass weapon race human shopIdOnly 11 "exec ui_create_item_panel_SH.cfg"
create panel shop_Ranged_beast [_shop_x] [_shop_y]
	set _index 0;
	objloop INCLUDE 1 NOWRAP FORWARD objclass weapon race beast shopIdOnly 11 "exec ui_create_item_panel_SH.cfg"

create panel shop_Items_human [_shop_x] [_shop_y]
	set _index 0;
    objloop INCLUDE 1 NOWRAP FORWARD objclass item race human shopIdOnly 11 "exec ui_create_item_panel_SH.cfg"
create panel shop_Items_beast [_shop_x] [_shop_y]
	set _index 0;
    objloop INCLUDE 1 NOWRAP FORWARD objclass item race beast shopIdOnly 11 "exec ui_create_item_panel_SH.cfg"

create panel shop_Events_human [_shop_x] [_shop_y]
//	set _index 0;
// objloop INCLUDE 1 NOWRAP FORWARD objclass event race human "exec ui_create_item_panel_SH.cfg"
create panel shop_Events_beast [_shop_x] [_shop_y]
//	set _index 0; 
// objloop INCLUDE 1 NOWRAP FORWARD objclass event race beast "exec ui_create_item_panel_SH.cfg"


create panel shop_Info_human [_shop_x] [_shop_y]

	create label "welcome" 110 100 280 50
		param text "Welcome to the secret"
		param align center
		param textcolor 1 1 0
		param char_height [fontsizelarge]
		param shadow 1

	create label "name" 110 140 280 50
		param text "^900Hall of Heroes"
		param align center
		param textcolor 1 1 0
		param char_height 30
		param shadow 1

	create label "text1" 110 200 280 50
		param text "In this shop you cannot use money"
		param align center
		param textcolor 1 1 1
		param char_height [fontsizesmall]
		param shadow 1

	create label "text2" 110 220 280 50
		param text "from your team, but only your own."
		param align center
		param textcolor 1 1 1
		param char_height [fontsizesmall]
		param shadow 1

create panel shop_Info_beast [_shop_x] [_shop_y]

	create label "welcome" 110 100 280 50
		param text "Welcome to the secret"
		param align center
		param textcolor 1 1 0
		param char_height [fontsizelarge]
		param shadow 1

	create label "name" 110 140 280 50
		param text "^900War Shrine"
		param align center
		param textcolor 1 1 0
		param char_height 30
		param shadow 1

	create label "text1" 110 200 280 50
		param text "In this shop you cannot use money"
		param align center
		param textcolor 1 1 1
		param char_height [fontsizesmall]
		param shadow 1

	create label "text2" 110 220 280 50
		param text "from your team, but only your own."
		param align center
		param textcolor 1 1 1
