//shops panels

create panel shops_panel 60 204

set _x 16
set _y 16
set _hide_shops_human "hide shop_Heroes_human; hide shop_Melee_human; hide shop_Ranged_human; hide shop_Items_human; hide shop_Events_human; hide shop_Info_human"
set _hide_shops_beast "hide shop_Heroes_beast; hide shop_Melee_beast; hide shop_Ranged_beast; hide shop_Items_beast; hide shop_Events_beast; hide shop_Info_beast"
set _clear_names "~
	select shops_panel/:Heroes_label;~
	 param textcolor 1 1 0;~
	select shops_panel/:Melee_label;~
	 param textcolor 1 1 0;~
	select shops_panel/:Ranged_label;~
	 param textcolor 1 1 0;~
	select shops_panel/:Items_label;~
	 param textcolor 1 1 0;~
	select shops_panel/:Events_label;~
	 param textcolor 1 1 0;~
	select shops_panel/:Info_label;~
	 param textcolor 1 1 0"

set _shops_spacing 0
set _shops_spacing_inc 60

set _shop_name "Heroes"
set _shop_description "Elite warriors to help your team."
exec ui_player_shopcreate.cfg

set _shop_name "Melee"
set _shop_description "Superior melee weapons."
exec ui_player_shopcreate.cfg

set _shop_name "Ranged"
set _shop_description "Unique ranged weapons."
exec ui_player_shopcreate.cfg

set _shop_name "Items"
set _shop_description "Uncommon artefacts and consumables."
exec ui_player_shopcreate.cfg

set _shop_name "Events"
set _shop_description "Mass scale events and abilities."
exec ui_player_shopcreate.cfg

set _shop_name "Info"
set _shop_description "Information about the shops."
exec ui_player_shopcreate.cfg

