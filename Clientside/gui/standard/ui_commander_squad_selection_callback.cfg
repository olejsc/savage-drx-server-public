//===================================================
// Squad Buttons Callback
//===================================================

createvar Squad_NumMembers 0

	clearSelection

	ask Squad_NumMembers #_Squad_Selection#
	set Squad_NumMembers #answer#
	if [Squad_NumMembers < 1] goto end
	
	for _index 0 #Squad_NumMembers# 1 "~
		ask Squad_MemberClientNum #_index#;~
		addToSelection #answer#"
	
@end