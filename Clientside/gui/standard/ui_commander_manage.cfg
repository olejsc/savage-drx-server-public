	param align right

inc _x [_width]
set _width 30
inc _x [_width]
set _width 30
inc _x [_width]

	set _temp [_x]
		
create button next_page [_temp-38] 8 30 [fontsizesmall]
	param char_height [fontsizesmall]
	param up_hover_image "/textures/core/1_nl_over.s2g"
	param text "Next"
	param align center
	param command "hide commander_manage_panel; show commander_manage_panel2;"

	//create the 32 slots for player info
	for _index 0 31 1 "exec ui_create_user_manage_row.cfg"

	set _x 4
	set _y 0
	set _width [_temp + 23]
	set _height [manage_unit_line_height * 33 + 30]
	set _border 8
	set _image human
	exec ui_frame.cfg

	create graphic "blackthing1" 4 0 [_width] [_height]
		param image black.s2g
		param alpha 1


