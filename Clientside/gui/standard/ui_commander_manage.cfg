
createvar manage_unit_line_height
createvar manage_unit_text_height
createvar rowswitch 1

createvar _shift 0


create panel commander_manage_panel 3 33

set manage_unit_line_height 14
set manage_unit_text_height 10

set _x 32
set _y 16




set _width 100
create label unit_manage_user_name [_x] [_y] [_width] [manage_unit_line_height]
	param char_height [manage_unit_text_height]
	param text "Name:"
	param align left

inc _x [_width]
set _width 100
create label unit_manage_user_unit [_x] [_y] [_width] [manage_unit_line_height]
	param char_height [manage_unit_text_height]
	param text "Unit:"
	param align center

