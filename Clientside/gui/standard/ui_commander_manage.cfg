	param char_height [manage_unit_text_height]
	param text "Level:"
	param text_color .2 .5 1
	param align right

inc _x [_width]
set _width 70
create label unit_manage_user_kills [_x] [_y] [_width] [manage_unit_line_height]
	param char_height [manage_unit_text_height]
	param text "Kills:"
	param text_color 1 0 0
	param align right

inc _x [_width]
set _width 70
create label unit_manage_user_deaths [_x] [_y] [_width] [manage_unit_line_height]
	param char_height [manage_unit_text_height]
	param text "Deaths:"
	param align right

inc _x [_width]
set _width 70
create label unit_manage_user_officer [_x+8] [_y] [_width] [manage_unit_line_height]
	param char_height [manage_unit_text_height]
	param text "Requests:"

inc _x [_width]
set _width 70
create label unit_manage_user_officer [_x] [_y] [_width] [manage_unit_line_height]
