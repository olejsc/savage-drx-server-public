objput name _name
objput icon _image
objput playercost _cost
objput maxdeployment _deployment

if [!_deployment] goto skipdeploymenttest
ask numdeployed #_name#
set _deployment [_deployment - answer]
select item_#_name#_panel:deployment
  param textcolor 1 1 1
  if [_deployment] "param text \"$_deployment$ in stock\""
  if [!_deployment] "param text \"Out of stock\""
  ask canPutInInventory #_name#
  if [!answer] "param textcolor .2 .2 .2"

@skipdeploymenttest
//make sure this item is valid
//if item is not valid, completely ignore this call
objput playerCost _temp
if [_temp < 0] goto skip

//check if the item has been researched
//unresearched items are hidden, that's it
ask isTypeResearching #_name#
set _researching [answer]

if [g_allWeaponsAvailable] goto skipresearchtest
ask isResearched #_name#
if [answer] set _researching 0
if [answer] goto skipresearchtest
if [!_researching] "hide item_#_name#_panel; goto done"

@skipresearchtest

//set up the vital info here, it may be altered as necessary,
//but it is important to have as a base to work from

showifhidden item_#_name#_panel
hide item_#_name#_panel:request

select item_#_name#_panel:buy
  if [_researching] "param alpha 0.3; param interactive 0"
  else "param alpha 1; param interactive 1; param sound /sound/general/buy.wav;"
  param alt ""
  param up_image "$_image$.s2g"
  param enable true
  
  if [_researching] "~
  show item_#_name#_panel:buy;~
  hide item_#_name#_panel:request;~
  goto done"

select item_#_name#_panel:name
  param textcolor 1 1 1

ask canPutInInventory #_name#
if [!answer] "~
  select item_#_name#_panel:buy;~
  param enable false;~
  param alt #answer#;~
  hide item_#_name#_panel:request;~
  select item_#_name#_panel:name;~
  param textcolor .2 .2 .2;~
  select item_#_name#_panel:rtime;~
  param textcolor .2 .2 .2;~
  hide item_#_name#_panel:request;~
  goto done"
select item_#_name#_panel:rtime
  param textcolor 1 1 1

//can the player afford this item?
if [_cost > player_money] "goto needmoney"
goto done

@needmoney
select item_#_name#_panel:buy
  param enable false
show item_#_name#_panel:request

@done
inc _index 1

@skip
