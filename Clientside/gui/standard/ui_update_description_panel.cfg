objedit #_name#
objput description _text
objput icon _image
objput tooltip _temp
objput fullhealth _x

set loadout_tooltip_title #_text#

select unit_select_tooltip_panel:icon
	param image #_image#.s2g

if [_x > 0] "select unit_select_tooltip_panel:health; param text \"Health: $_x$\""
if [_x <= 0] "select unit_select_tooltip_panel:health; param text \"\""

//set loadout_tooltip_description #_temp#
textbuffer clear unit_select_tooltip_panel:description
textbuffer print unit_select_tooltip_panel:description #_temp#
