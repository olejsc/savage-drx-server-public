ask inventory #_index#
set _name #answer#

select playerInfo_panel:slot#_index#
	param mouseover_command "~
		set _name $_name$;~
		exec /gui/standard/ui_update_description_panel.cfg;~
		show unit_select_tooltip_panel"
	param mouseaway_command "hide unit_select_tooltip_panel"	

ask stringsmatch #_name# ""
if [answer] goto nothing
objedit #_name#
objput icon _image
goto found

@nothing
select playerInfo_panel:slot#_index#
	param up_image black.s2g
	param interactive 0
select playerInfo_panel:ammo#_index#
	param text ""
goto end

@found
select playerInfo_panel:slot#_index#
	param up_image "$_image$.s2g"
	param interactive 1
ask ammo #_index#
select playerInfo_panel:ammo#_index#
	if [answer > 0] "param text $answer$"
	if [answer <= 0] param text ""
@end
