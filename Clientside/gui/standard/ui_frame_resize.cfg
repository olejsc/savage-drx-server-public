//uses _border, _image, _height, _width
set _frame_set human

ask stringsMatch #_image# thin
if [answer] goto thin_frame  
if [_border<=4] goto thin_frame  

set _corner [_border*2.4]
set _margin [_border/8]
set _clip [_margin/2]


//top left corner
move #_panel#:frame_topleft [_x-_clip] [_y-_clip] 
resize #_panel#:frame_topleft[_corner] [_corner]

//top right corner
move #_panel#:frame_topright [_x + _width - _corner + _margin + _clip] [_y - _clip] 
resize #_panel#:frame_topright [_corner] [_corner]

//bottom left corner
move #_panel#:frame_bottomleft [_x-_clip] [_y + _height - _corner + _margin + _clip] 
resize #_panel#:frame_bottomleft [_corner] [_corner]

//bottom right corner
move #_panel#:frame_bottomright [_x + _width - _corner + _margin + _clip] [_y + _height - _corner + _margin + _clip] 
resize #_panel#:frame_bottomright [_corner] [_corner]

//top edge
move #_panel#:frame_top [_x + _border*2 - 1] [_y] 
resize #_panel#:frame_top [_width - (_border * 4) + 2] [_border]

//right edge
move #_panel#:frame_right [_x + _width - _border] [_y + _border*2 - 1] 
resize #_panel#:frame_right [_border] [_height - (_border * 4) + 2]

//left edge
move #_panel#:frame_left [_x] [_y + _border*2 - 1] 
resize #_panel#:frame_left [_border] [_height - (_border * 4) + 2]

//bottom edge
move #_panel#:frame_bottom [_x + _border*2 - 1] [_y + _height - _border] 
resize #_panel#:frame_bottom [_width - (_border * 4) + 2] [_border]


goto done
//=================THIN Frame

@thin_frame

set _corner [_border*2]

//top left corner
move #_panel#:frame_topleft [_x] [_y] 
resize #_panel#:frame_topleft [_corner] [_corner]

//top right corner
move #_panel#:frame_topright [_x + _width - _corner] [_y] 
resize #_panel#:frame_topright [_corner] [_corner]

//bottom left corner
move #_panel#:frame_bottomleft [_x] [_y + _height - _corner] 
resize #_panel#:frame_bottomleft [_corner] [_corner]

//bottom right corner
move #_panel#:frame_bottomright [_x + _width - _corner] [_y + _height - _corner] 
resize #_panel#:frame_bottomright [_corner] [_corner]

//top edge
move #_panel#:frame_top [_x + _border*2 - 1] [_y] 
resize #_panel#:frame_top [_width - (_border * 4) + 2] [_border]

//right edge
move #_panel#:frame_right [_x + _width - _border] [_y + _border*2 - 1] 
resize #_panel#:frame_right [_border] [_height - (_border * 4) + 2]

//left edge
move #_panel#:frame_left [_x] [_y + _border*2 - 1] 
resize #_panel#:frame_left [_border] [_height - (_border * 4) + 2]

//bottom edge
move #_panel#:frame_bottom [_x + _border*2 - 1] [_y + _height - _border] 
resize #_panel#:frame_bottom [_width - (_border * 4) + 2] [_border]

@done
