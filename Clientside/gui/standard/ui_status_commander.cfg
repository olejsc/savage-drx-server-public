// Top bar
//=============================================================================================
show commander_top_bar_panel
select commander_top_bar_panel:worker_pool_icon
  param up_image /models/#player_racename#/units/worker/icon.s2g

select commander_top_bar_panel:background
  param image /gui/standard/commander/#player_racename#_nfm_command_topstrip.s2g

ask stringsmatch #player_racename# human
if [answer] goto humantop
ask stringsmatch #player_racename# beast
if [answer] goto beasttop
goto skiptop

@humantop
select commander_top_bar_panel:resource1_icon
  param image #gui_basepath#/gridmenus/icons/adrenaline.s2g
select commander_top_bar_panel:resource1_label
  param cvar resource_chemical
  param text_color 0 1 0

select commander_top_bar_panel:resource2_icon
  param image #gui_basepath#/gridmenus/icons/electrify_icon.s2g
select commander_top_bar_panel:resource2_label
  param cvar resource_electric
  param text_color 0 1 1

select commander_top_bar_panel:resource3_icon
  param image #gui_basepath#/gridmenus/icons/magneticshield.s2g
select commander_top_bar_panel:resource3_label
  param cvar resource_magnetic
  param text_color 1 0 0
goto skiptop

@beasttop
select commander_top_bar_panel:resource1_icon
  param image /gui/standard/commander/firepool.s2g
select commander_top_bar_panel:resource1_label
  param cvar resource_fire
  param text_color 1 .5 0

select commander_top_bar_panel:resource2_icon
  param image /gui/standard/commander/stratapool.s2g
select commander_top_bar_panel:resource2_label
  param cvar resource_strata
  param text_color .2 .8 1

select commander_top_bar_panel:resource3_icon
  param image /models/beast/items/icons/portal.s2g
select commander_top_bar_panel:resource3_label
  param cvar resource_entropy
  param text_color .2 1 .2
goto skiptop

@skiptop
