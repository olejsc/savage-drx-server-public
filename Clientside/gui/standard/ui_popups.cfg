//=============WARNING PANEL
// Map Scripts need to adjust the _warning_back_width so it copes with the text lenght
create panel "warning_panel" 0 0

createvar _warning_back_width 700	
createvar _warning_line_height 24
createvar _warning_spacer 10
createvar _warning_y 330
createvar _warning_x 0
createvar _warning_bleed 20
createvar _warning_title; createvar _warning_line1; createvar _warning_line2; createvar _warning_line3; createvar _warning_line4


	create label warning_title [_warning_x] [_warning_y-_warning_spacer/2] 1024 32
		param cvar _warning_title
		param char_height 32
		param textcolor 1 1 1
		param align center
		param shadow 1

	create label warning_line1 [_warning_x] [_warning_y+_warning_spacer+_warning_line_height] 1024 24
		param cvar _warning_line1
		param char_height 24
		param textcolor .8 .8 .8
		param align center
		param shadow 1

	create label warning_line2 [_warning_x] [_warning_y+_warning_spacer+_warning_line_height*2] 1024 24
		param cvar _warning_line2
		param char_height 24
		param textcolor .8 .8 .8
		param align center
		param shadow 1

	create label warning_line3 [_warning_x] [_warning_y+_warning_spacer+_warning_line_height*3] 1024 24
		param cvar _warning_line3
		param char_height 24
		param textcolor .8 .8 .8
		param align center
		param shadow 1

	create label warning_line4 [_warning_x] [_warning_y+_warning_spacer+_warning_line_height*4] 1024 24
		param cvar _warning_line4
		param char_height 24
		param textcolor .8 .8 .8
		param align center
		param shadow 1


	create graphic "blackthing1" [1024/2-(_warning_back_width/_sr)/2] [_warning_y-_warning_bleed] [_warning_back_width/_sr] [_warning_line_height*5+_warning_spacer+_warning_bleed*2]
		param image /gui/standard/white.s2g
		param alpha .4
		param color .2 .2 .2

hide warning_panel	

