// EX2: This file checks the visibility of panels that require freemouse and sets cl_freemouse accordingly.

// Commanders never need freemouse
ask isCommander
if [answer] goto disable

if [_enable] goto enable;

ask isVisible modal_error_panel:title; if [answer] goto enable
ask isVisible ask isVisibleuserinfo_panel:title; if [answer] goto enable
ask isVisible waiting_server_panel:title; if [answer] goto enable

@disable
cl_freemouse 0
goto end

@enable
cl_freemouse 1

@end