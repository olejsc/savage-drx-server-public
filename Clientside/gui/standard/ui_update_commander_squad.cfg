// Update info about players squad status
if [sv_SEPVersion < 1001] goto done
if [!sv_enableSquads] goto done

// Update Squad Table
for _row 1 6 1 "~
	ask Squad_NumMembers #_row#;~
	set Squad_NumMembers #answer#;~
	for _col 0 6 1 \"~
		select commander_squad_list:squad#_row#_col#_col#;~
		if [_col <  Squad_NumMembers] exec ui_update_commander_squad_button_linked.cfg;~
		else exec ui_update_commander_squad_button_void.cfg\""

// Update Buffer Table (non-squad)
set _row 0
ask Squad_NumMembers #_row#
set Squad_NumMembers #answer#
for _line 1 2 1 "~
	for _col 0 7 1 \"~
		select commander_squad_list:buffer#_line#_col#_col#;~
		set Buffer_Index [(_line - 1)*8 + _col];~
		if [Buffer_Index < Squad_NumMembers] exec ui_update_commander_squad_button_linked.cfg;~
		else exec ui_update_commander_squad_button_void.cfg\""

@done
