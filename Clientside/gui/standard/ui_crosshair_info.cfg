if [_wide] "set _wide_offset 7; set _wide_offset_0 1; set _wide_offset_1 5"
create panel "player_digits_panel" [449+_wide_offset] 331

set _ring_y 20
set _ring_h 14

	create label stamina_digits [0] [_ring_y] [64/_sr] 28
		param cvar player_staminapercent
		param shadow 1
		param char_height [_ring_h]
		param textcolor 0 1 .8
		param alpha [1-ring_alpha]

	create label health_digits [62-_wide_offset_1] [_ring_y] [64/_sr] 28
		param cvar player_health
		param shadow 1
		param char_height [_ring_h]
		param textcolor 1 .15 .15
		param alpha [1-ring_alpha]

	create label mana_digits [30-_wide_offset_0] [_ring_y] [64/_sr] 24
		param cvar player_mana
		param shadow 1
		param char_height [_ring_h]
		param textcolor 1 .3 1
		param alpha [1-ring_alpha]

if [_wide] "set _wide_offset 7; set _wide_offset_0 8; set _wide_offset_1 1"
create panel "player_meters" [468+_wide_offset] 331

	create graphic health_percent [46-_wide_offset_0] 32 [64/_sr] 64
//		param color 0 1 0
		param alpha [1-ring_alpha*2]
	create graphic stamina_percent 0 32 [64/_sr] 64
//		param color 0 1 0
		param alpha [1-ring_alpha*2]

	create graphic mana_percent [7-_wide_offset_1] 9 [80/_sr] 32
		param color .6 .1 .3
		param alpha [1-ring_alpha*2]

	create graphic hp_back [46-_wide_offset_0] 32 [64/_sr] 64
		param image /gui/standard/crosshairs/bars/hpbg.s2g
		param alpha [0.5-ring_alpha]
		param movieendcommand "set _php [player_healthpercent-(player_healthpercent%5)]; select player_meters:health_percent; param image /gui/standard/crosshairs/bars/hp#_php#.s2g;"
		param execdelay 128

	create graphic stamina_back 0 32 [64/_sr] 64
		param image /gui/standard/crosshairs/bars/stbg.s2g
		param alpha [0.5-ring_alpha]
		param movieendcommand "set _psp [player_staminapercent-(player_staminapercent%5)]; select player_meters:stamina_percent; param image /gui/standard/crosshairs/bars/st#_psp#.s2g"
		param execdelay 128

	create graphic mana_back [7-_wide_offset_1] 8 [80/_sr] 32
		param image /gui/standard/crosshairs/bars/mabg.s2g
		param alpha [0.4-ring_alpha/2]
		param color .4 .1 .2
		param movieendcommand "set _pmp [player_mana-(player_mana%5)]; select player_meters:mana_percent; param image /gui/standard/crosshairs/bars/ma#_pmp#.s2g"
		param execdelay 128
