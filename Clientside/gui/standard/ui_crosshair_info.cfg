//==========Crosshair Info
//set ring_alpha 0.5

create panel "player_mixed" 560 350

set _height 50
set _width 4

	create slider mana -72 0 [_height] [_width] horizontal
		param range 0 100
		param showvalue false
		param variable player_mana
		param fillshader none
		param color 1 0 1
		param handleshader none
		param bgshader none
		param alpha 0

	create graphic manaback -72 0 [_height] [_width]
		param image white.s2g
		param color .3 .0 .1
		param alpha 0

	create label health_digits 104 210 1 1
		param cvar player_health
		param shadow 1
		param align center
		param char_height 16
		param textcolor 1 .15 .15
		param alpha [1-ring_alpha]

	create label stamina_digits -196 210 1 1
		param cvar player_staminapercent
		param shadow 1
		param align center
		param char_height 16
		param textcolor 0 1 .8
		param alpha [1-ring_alpha]

	create slider stamina -200 100 [_width*2] [_height*2]
		param range 0 100
		param showvalue false
		param variable player_staminapercent
		param bgshader none
		param fillshader sprint_bar.s2g
		param handleshader 1_nl_sprint_handle.s2g
		param alpha [1-ring_alpha*2]

	create graphic stamback -200 100 [_width*2] [_height*2]
		param image white.s2g
		param color 0 .1 .2
		param alpha [1-ring_alpha*2]

	create slider health 100 100 [_width*2] [_height*2]
		param range 0 100
		param showvalue false
		param variable player_healthpercent
		param handleshader 1_nl_health_handle.s2g
		param fillshader health_bar.s2g
		param bgshader none
		param alpha [1-ring_alpha*2]

	create graphic healthback 100 100 [_width*2] [_height*2]
		param image white.s2g
		param color .2 0 0
		param alpha [1-ring_alpha*2]

