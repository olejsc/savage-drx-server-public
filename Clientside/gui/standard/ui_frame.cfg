//uses _border, _image, _height, _width
set _frame_set human

if [_variation==1] "goto race_jump"

ask stringsMatch #_image# neutral
if [answer] goto neutral_frame

ask stringsMatch #_image# standard
if [answer] goto standard_frame

ask stringsMatch #_image# old
if [answer] goto old_frame

ask stringsMatch #_image# oldthin
if [answer] goto oldthin_frame

ask stringsMatch #_image# thin
if [answer] goto thin_frame  

if [_border<=4] goto thin_frame  


@race_jump
//minimal
if [cl_resourcesPanel==1] "set _frame_alpha 0.5;~
			set _x [_x-2];~
			set _y [_y-2];~
			set _width [_width+4];~
			set _height [_height+2];~
			goto oldthin_frame"
//hires
if [cl_resourcesPanel==2] goto race_frame

//legacy
if [cl_resourcesPanel==3] "goto old_frame"

//smoke
if [cl_resourcesPanel==4] goto done

//simple
if [cl_resourcesPanel==5] "set _frame_alpha 0.5;~
			set _x [_x-2];~
			set _y [_y-2];~
			set _width [_width+4];~
			set _height [_height+2];~
			goto oldthin_frame"

goto done


@race_frame
set _corner [_border*2.4]
set _margin [_border/8]
set _clip [_margin/2]

//top left corner
create graphic frame_topleft [_x-_clip] [_y-_clip] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/topleft.s2g
	param alpha [_frame_alpha]

//top right corner
create graphic frame_topright [_x + _width - _corner + _margin + _clip] [_y - _clip] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/topright.s2g
	param alpha [_frame_alpha]

//bottom left corner
create graphic frame_bottomleft [_x-_clip] [_y + _height - _corner + _margin + _clip] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/bottomleft.s2g
	param alpha [_frame_alpha]

//bottom right corner
create graphic frame_bottomright [_x + _width - _corner + _margin + _clip] [_y + _height - _corner + _margin + _clip] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/bottomright.s2g
	param alpha [_frame_alpha]

//top edge
create graphic frame_top [_x + _border*2 - 1] [_y] [_width - (_border * 4) + 2] [_border]
	param image gfx/frames/#_frame_set#/top.s2g
	param alpha [_frame_alpha]

//right edge
create graphic frame_right [_x + _width - _border] [_y + _border*2 - 1] [_border] [_height - (_border * 4) + 2]
	param image gfx/frames/#_frame_set#/right.s2g
	param alpha [_frame_alpha]

//left edge
create graphic frame_left [_x] [_y + _border*2 - 1] [_border] [_height - (_border * 4) + 2]
	param image gfx/frames/#_frame_set#/left.s2g
	param alpha [_frame_alpha]

//bottom edge
create graphic frame_bottom [_x + _border*2 - 1] [_y + _height - _border] [_width - (_border * 4) + 2] [_border]
	param image gfx/frames/#_frame_set#/bottom.s2g
	param alpha [_frame_alpha]


goto done



@thin_frame
set _corner [_border*2]
set _multiplier 2
@frame

//top left corner
create graphic frame_topleft [_x] [_y] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/topleft.s2g
	param alpha [_frame_alpha]

//top right corner
create graphic frame_topright [_x + _width - _corner] [_y] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/topright.s2g
	param alpha [_frame_alpha]

//bottom left corner
create graphic frame_bottomleft [_x] [_y + _height - _corner] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/bottomleft.s2g
	param alpha [_frame_alpha]

//bottom right corner
create graphic frame_bottomright [_x + _width - _corner] [_y + _height - _corner] [_corner] [_corner]
	param image gfx/frames/#_frame_set#/bottomright.s2g
	param alpha [_frame_alpha]

//top edge
create graphic frame_top [_x + _border * _multiplier - 1] [_y] [_width - (_border  * _multiplier * 2) + 2] [_border]
	param image gfx/frames/#_frame_set#/top.s2g
	param alpha [_frame_alpha]

//right edge
create graphic frame_right [_x + _width - _border] [_y + _border * _multiplier - 1] [_border] [_height - (_border * _multiplier * 2) + 2]
	param image gfx/frames/#_frame_set#/right.s2g
	param alpha [_frame_alpha]

//left edge
create graphic frame_left [_x] [_y + _border * _multiplier - 1] [_border] [_height - (_border * _multiplier * 2) + 2]
	param image gfx/frames/#_frame_set#/left.s2g
	param alpha [_frame_alpha]

//bottom edge
create graphic frame_bottom [_x + _border * _multiplier - 1] [_y + _height - _border] [_width - (_border * _multiplier * 2) + 2] [_border]
	param image gfx/frames/#_frame_set#/bottom.s2g
	param alpha [_frame_alpha]

goto done


