//===================================================
// Update Individual Squad Panel's Buttons
//===================================================

	// Show Unit's Icon
	ask Squad_MemberUnit #_col#
	set _name #answer#	
	ask stringsmatch #_name# "" 
	if [answer] "~
		set _image /textures/icons/sfe"
	if [!answer] "~
		objedit #_name#;~
		objput icon _image"
	param up_image #_image#.s2g
	
	// Officer override
	ask Squad_MemberOfficer #_col#
	if [answer] param up_image friend-officer.s2g
	set _isOfficer #answer#

	// Callback
	ask Squad_MemberClientNum #_col#
	param command "~
		clearSelection;~
		addToSelection $answer$;~
		if [_Squad_Player_Selected == $answer$] \"set _Squad_Player_DoubleClick 1\";~
		if [_Squad_Player_Selected != $answer$] \"set _Squad_Player_DoubleClick 0\";~
		set _Squad_Player_Selected $answer$;~
		if [_Squad_Player_DoubleClick] \"promoteToOfficer -1 $answer$\""
		
	// Popup Panel	
    param mouseaway_command "~
		hide commander_squad_popup"	
    param mouseover_command "~
		select commander_squad_popup:squad_popup_unit;~
			param image $_image$.s2g;~
		ask Squad_NumMembers $_row$;~
		ask Squad_MemberName $_col$;~
		select commander_squad_popup:squad_popup_name;~
			param text #answer#;~
		ask Squad_MemberLevel $_col$;~
		select commander_squad_popup:squad_popup_level;~
			param text #answer#;~
		ask Squad_MemberKills $_col$;~
		select commander_squad_popup:squad_popup_kills;~
			param text #answer#;~
		ask Squad_MemberDeaths $_col$;~
		select commander_squad_popup:squad_popup_deaths;~
			param text #answer#;~
		show commander_squad_popup"
