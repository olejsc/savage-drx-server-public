//wide offsets: block offset _boff, wide modifier _wmod
if [cl_resourcesPanel==1] "set _xoff 15; set _yoff -15"
if [cl_resourcesPanel==2] "set _xoff 15; set _yoff -10"
if [cl_resourcesPanel==3] "set _xoff 15; set _yoff -10"
if [cl_resourcesPanel==4] "set _xoff 15; set _yoff -10"

if [_wide] "set _boff 6; set _wmod 1"

// Player Squad Panel: Create #_block
	create label block#_block#_name [53+_xoff-_boff] [_ypos+2 + _yoff] [113/_sr] 15
		param text "Name goes here"
		param char_height 12
		param shadow 1
		param align left
		param alpha 0.8
		
	create graphic block#_block#_officer [35+_xoff] [ _ypos+2 + _yoff] [12/_sr] 12	
		param image friend-officer.s2g
		param alpha 0.6
		
	create graphic block#_block#_dead [40+_xoff] [ _ypos + _yoff] [12/_sr] 15	
		param image friend-dead.s2g
		param alpha 0.6
		
	create slider block#_block#_health [39+_xoff-_boff] [16 + _ypos + _yoff] [94/_sr+_wmod] 2 horizontal
		param variable squad_healthpercent#_block#
		param range 0 100
		param slider_color 0 1 0
		param fillshader /textures/core/white.s2g
//		param bgshader /gui/standard/black.s2g		
		param showvalue false		
		param alpha 0.6
		
	create graphic block#_block#_unit [1+_xoff] [2 + _ypos + _yoff] [36/_sr] 36	
		param alpha 0.6
		
	for _index 0 4 1 "~
			create graphic block#_block#_item#_index# [40 - _boff + _xoff + (_xspacing * _index /_sr)] [20 + _ypos + _yoff] [18/_sr] 18;~
				param alpha 0.8"
				
	create graphic block#_block#_bg [0+_xoff] [_ypos + _yoff] [188/_sr] 96 
		param image /textures/squads/squad_member_inventory.s2g
		param alpha 0.8
