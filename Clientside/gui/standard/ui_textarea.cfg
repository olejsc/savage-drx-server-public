	// faith: element to be used to have a better looking textarea with many options

	if [_scrollable == 0] "set _width [_width + 16]"
	if [_scrollable == 0] "set bool 0"; else "set bool 1";

	set _w [_width]
	set _height [_numberRows * _charHeight]

	createvar _#_textareaName#_ta_variable
	createvar _#_textareaName#_ta_textareavariable
	createvar _#_textareaName#_ta

	create textarea #_textareaName#_ta [_x] [_y] [_w - 16] [_height] _#_textareaName#_ta
	
		on hide "for _i 1 [$_stop$ + 1] 1 \"hide $_textareaName$_ta_g1#_i#;\";~
		hide $_textareaName$_ta_g2;~
		hide $_textareaName$_scroll_up_button;~
		hide $_textareaName$_scroll_down_button;~
		hide $_textareaName$_scrollbar_slider;~
		hide $_textareaName$_slider_bg;"

		on show "for _i 1 [$_stop$ + 1] 1 \"show $_textareaName$_ta_g1#_i#;\";~
		show $_textareaName$_ta_g2;~
		show $_textareaName$_scroll_up_button;~
		show $_textareaName$_scroll_down_button;~
		show $_textareaName$_scrollbar_slider;~
		show $_textareaName$_slider_bg;"

		param bg_color 0 0 0
		param selected_bgcolor 1 .8 0
		param char_height [_charHeight]
		param char_width [_charWidth - 4]
		param icon_height [_fontLabelSize - 2]
		param thickness 0
		param variable _#_textareaName#_ta_variable
		param scrollvariable _#_textareaName#_ta_scrollvariable
		param selectable [_scrollable]
		param border 0

	set bool 1;
	set _stop [_numberRows / 2];
	for _i 1 [_stop] 1 "create graphic #_textareaName#_ta_g1#_i#  [_x] [_y + 2 * _charHeight * (_i - 1) + _charHeight * bool + 1] [_width - 5] [_charHeight];~
		param image /gui/standard/white.s2g;~
		param alpha .3"

	create graphic #_textareaName#_ta_g2 [_x] [_y] [_width - 5] [_numberRows * _charHeight + 2 * bool]
		param image /gui/standard/white.s2g
		param alpha .13

	if [_scrollable == 1] "~
	set _sliderCorrection 4;~
	create button #_textareaName#_scroll_up_button [_x + _w - 5] [_y - _columnlabelSize] 16 16;~
		param up_image /gui/standard/scrollup.s2g;~
		param command \"textarea scroll $_textareaName$_ta -1\";~
		param repeat true;~
	create button #_textareaName#_scroll_down_button [_x + _width - 5] [_y + _height - 16 + 2 * bool] 16 16;~
		param up_image /gui/standard/scrolldown.s2g;~
		param command \"textarea scroll $_textareaName$_ta 1\";~
		param repeat true;~
	create slider #_textareaName#_scrollbar_slider [_x + _width - 5] [_y - _columnlabelSize + 16 + _sliderCorrection] 16 [_height - _sliderCorrection * 2 + _columnlabelSize - 16 * 2 + 2 * bool];~
		param handleshader /gui/standard/scrollhandle.s2g;~
		param bgshader none;~
		param fillshader none;~
		param variable _#_textareaName#_ta_scrollvariable;~
		param showvalue 0;~
		param range 1 0;~
	create graphic #_textareaName#_slider_bg [_x + _width - 5] [_y - _columnlabelSize + _sliderCorrection] 16 [_height - _sliderCorrection * 2 + _columnlabelSize + 2 * bool];~
		param color 0.71 0.33 0.13;~
		param alpha .1;~
		param image /gui/standard/white.s2g;"