create panel loadout_chat 63 611

	create textbox input 0 [7 * fontsizesmall] 370 [fontsizesmall] lobby_chat_msg
		param commit_cmd "~
			chatbox say loadout_chat:chatbox #lobby_chat_msg#;~
			set lobby_chat_msg \"\""
		param abort_cmd "~
			select loadout_chat:input; param text \"\";~
			set lobby_chat_msg \"\""
		param border 0
		param char_height [fontsizesmall]
		param interactive 1

	create chatbox chatbox 0 0 370 [7 * fontsizesmall]
		param type public
		param delay_secs 0
		param char_height [fontsizesmall]
		param audible 0
		param border 0
		param rows 7 //required because of buggy scrolbuffer widget
