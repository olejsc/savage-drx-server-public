//=============================================================================================
//Pending Request
//=============================================================================================
createvar _pendingrequestBorder 12

createvar _pendingrequestButtonSize 48
createvar _pendingrequestGap 8
createvar _pendingrequestCharHeight 12

createvar _pendingrequestWidth 220
createvar _pendingrequestHeight [_pendingrequestButtonSize + (_pendingrequestBorder * 2)]

createvar _pendingrequestX [(1024 / 2) - (_pendingrequestWidth / 2)]
createvar _pendingrequestY 5
//=============================================================================================
create panel unit_pending_request_panel [_pendingrequestX] [_pendingrequestY]

	create label title~
			[_pendingrequestButtonSize] [_pendingrequestBorder]~
			[_pendingrequestWidth - _pendingrequestButtonSize] [_pendingrequestCharHeight]
		param char_height [_pendingrequestCharHeight * 1.3]
		param text "Request pending..."


	create button cancel~
		[_pendingrequestBorder]~
		[_pendingrequestBorder]~
		[_pendingrequestButtonSize]~
		[_pendingrequestButtonSize]

		param up_image /gui/standard/gridmenus/icons/cancel.s2g
		param command "cancelRequest"


	create label description~
		[_pendingrequestBorder + _pendingrequestButtonSize + _pendingrequestGap]~
		[_pendingrequestBorder + (_pendingrequestCharHeight * 1.3)]~
		[_pendingrequestWidth - (_pendingrequestBorder * 2) - _pendingrequestButtonSize - _pendingrequestGap]~
		[_pendingrequestCharHeight]

		param cvar cl_pendingrequest_description
		param char_height [_pendingrequestCharHeight]
		param align left


	create label value~
		[_pendingrequestBorder + _pendingrequestButtonSize + _pendingrequestGap]~
		[_pendingrequestBorder + (_pendingrequestCharHeight * 2.3)]~
		[_pendingrequestWidth - (_pendingrequestBorder * 2) - _pendingrequestButtonSize - _pendingrequestGap]~
		[_pendingrequestCharHeight]

		param cvar cl_pendingrequest_money
		param char_height [_pendingrequestCharHeight]
		param align left

	create label time~
		[_pendingrequestBorder + _pendingrequestButtonSize + _pendingrequestGap]~
		[_pendingrequestBorder + (_pendingrequestCharHeight * 3.3)]~
		[_pendingrequestWidth - (_pendingrequestBorder * 2) - _pendingrequestButtonSize - _pendingrequestGap]~
		[_pendingrequestCharHeight]

		param cvar cl_pendingrequest_time
		param char_height [_pendingrequestCharHeight]
		param align left

	set _x 0
	set _y 0
	set _border [_pendingrequestBorder]
	set _width [_pendingrequestWidth]
	set _height [_pendingrequestHeight]
	set _image human
	exec ui_frame.cfg

	create graphic background 0 0 [_pendingrequestWidth] [_pendingrequestHeight]
		param image /gui/standard/black.s2g
