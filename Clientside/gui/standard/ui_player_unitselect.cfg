// add panel
set _x 0
set _y 0
set _width 350
set _height 122
set _border 3
set _image human
createvar _presetName
createvar _presetIncludeUnit 1
createvar _preset_previous_team 0
create panel preset_add_panel [429]  [448]
	create titlebar title 0 -16 [_width] 16
		param hide_cmd "hide preset_add_panel"
		param title "Add Preset"

	exec ui_frame.cfg

	create label namelabel 18 27 100 20
		param text "Preset Name: "
		param align left
		param char_height [fontsizemedium]

	create textbox name 178 27 150 [fontsizemedium] _presetName
		param border 0

	create graphic name_bg 174 23 158 [fontsizemedium+8]
		param image /gui/standard/small_button.s2g
		param alpha .6

	create label unitlabel 18 55 100 20
		param text "Include Unit in Preset: "
		param align left
		param char_height [fontsizemedium]

	create togglebutton unit 316 55 16 16
		param down_image /gui/standard/human/checkbox_checked.s2g
		param up_image /gui/standard/human/checkbox_empty.s2g
		param up_command "setsave _presetIncludeUnit 0"
		param command "setsave _presetIncludeUnit 1"
		param variable _presetIncludeUnit
		param sound "/sound/gui/button_click.wav"

	create button OK [_width/2-120] 83 100 20
		param text "OK"
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "~
			preset_add #_presetIncludeUnit# #_presetName#;~
			hide preset_add_panel;~
			exec /gui/standard/ui_update_preset_panel.cfg;~
			menu select preset_menu_panel:preset_menu \\\"#_presetName#\\\""

	create button Cancel [_width/2+20] 83 100 20
		param text "Cancel"
		param up_image /gui/standard/small_button.s2g
		param up_hover_image /gui/standard/small_button_over.s2g
		param down_image /gui/standard/small_button_down.s2g
		param command "hide preset_add_panel"

	create graphic background 0 0 [_width] [_height]
		param image /gui/standard/black.s2g
		param interactive 1

