objput techType _weaponTechType
objput objclass _tmp
ask stringsmatch melee #_tmp#
if [answer] goto ok
ask stringsmatch weapon #_tmp#
if [answer] goto ok
goto end

@ok
objput name _name
objput icon _image
objput playercost _cost
objput usemana _tmp
if [_tmp] goto usemana
objput objclass _tmp
ask stringsmatch melee #_tmp#
if [answer] set _tmp 1
if [!answer] set _tmp 0
@usemana

//make sure this weapon is valid
//if weapon is not valid, completely ignore this call
objput playerCost _temp
if [_temp < 0] goto end


//check if the weapon has been researched
//unresearched weapons are hidden, that's it
ask isTypeResearching #_name#
set _researching [answer]
if [g_allWeaponsAvailable] goto skipresearchtest
ask isResearched #_name#
if [answer] set _researching 0
if [answer] goto skipresearchtest
if [!_researching] "hide weapon_#_name#_panel; goto done"

@skipresearchtest

showifhidden weapon_#_name#_panel
hide weapon_#_name#_panel:request

//set up the vital info here, it may be altered as necessary,
//but it is important to have as a base to work from
select weapon_#_name#_panel:buy
  if [_researching] "param alpha 0.3; param interactive 0"
  else "param alpha 1; param interactive 1; param sound /sound/general/buy.wav;"
	param alt ""
	param up_image "$_image$.s2g"
	param down_image "$_image$_down.s2g"
	param up_hover_image "$_image$_over.s2g"
	param disable_image "$_image$_notavail.s2g"
	param enable true
if [_researching] "~
  show weapon_#_name#_panel:buy;~
  show weapon_#_name#_panel:name;~
  hide weapon_#_name#_panel:ammo;~
  hide weapon_#_name#_panel:request;~
  goto done"

show weapon_#_name#_panel:ammo

select weapon_#_name#_panel:name
	param textcolor 1 1 1
select weapon_#_name#_panel:ammo
	param textcolor 1 1 1
select weapon_#_name#_panel:rtime
	param textcolor 1 1 1
objput ammostart _temp
select weapon_#_name#_panel:ammo
	if [_tmp] param text ""
	if [!_tmp] param text #_temp#


//Daemon: is this weapon sold in a same tech type shop?
ask canPutInInventory #_name#
if [!answer] "~
	select weapon_#_name#_panel:buy;~
	param enable false;~
	param alt #answer#;~
	hide weapon_#_name#_panel:request;~
	select weapon_#_name#_panel:name;~
	param textcolor .2 .2 .2;~
	select weapon_#_name#_panel:ammo;~
	param textcolor .2 .2 .2;~
	select weapon_#_name#_panel:rtime;~
	param textcolor .2 .2 .2;~
//	goto skipavailabletest;~
	"

//Daemon: added to forbid healers from buying weapons. Weirdly, the checks for items are done in code, and for weapons here :/
ask stringsMatch #player_currentunit# "human_medic"
if [answer] goto weaponunavailable
ask stringsMatch #player_currentunit# "beast_medic"
if [answer] goto weaponunavailable

//Daemon: check for same-type (shop and weapon). If not, hide request of disabled weapons
ask stringsMatch #_techType# #_weaponTechType#
if [!answer & !_noTechType] goto weaponunavailable

//is the player allowed to purchase?
if [_z] goto canpurchase

@weaponunavailable
select weapon_#_name#_panel:buy
	param enable false
	param alt "This equipment cannot be purchased"
select weapon_#_name#_panel:name
	param textcolor .2 .2 .2
select weapon_#_name#_panel:ammo
	param textcolor .2 .2 .2
select weapon_#_name#_panel:rtime;~
	param textcolor .2 .2 .2;~
hide weapon_#_name#_panel:request
goto done

@canpurchase
//can the weapon be produced?
if [g_allWeaponsAvailable] goto skipavailabletest
ask isAvailable #_name#
if [!answer] "~
	select weapon_#_name#_panel:buy;~
	param enable false;~
	param alt \"This weapon cannot be constructed\";~
	hide weapon_#_name#_panel:request;~
	select weapon_#_name#_panel:name;~
	param textcolor .2 .2 .2;~
	select weapon_#_name#_panel:ammo;~
	param textcolor .2 .2 .2;~
	select weapon_#_name#_panel:rtime;~
	param textcolor .2 .2 .2;~
	goto done"

@skipavailabletest
//does the player have this weapon already?
//if so, black it out
ask isInInventory #_name#
if [answer] goto hasthisweapon

//can the player afford this weapon?
if [_cost > player_money] "goto needmoney"
goto done

//adjust the button to show we are purchasing ammo
@hasthisweapon
select weapon_#_name#_panel:buy
	param alt ""
hide weapon_#_name#_panel
goto done

@needmoney
select weapon_#_name#_panel:buy
	param enable false
	param alt ""
show weapon_#_name#_panel:request

goto done

@done

@end
