
show notification_panel

//=============== notification window ==========================================================
create panel team_select_notification_window 335 30 360 115

	create label messages_chain_label 65 -4 220 18
		param text "Messages"
		param char_height 18

	create graphic team1_chains 65 -30 220 84
		param image chains.s2g

set _x 0
set _y 0
set _border 8
set _width 360
set _height 115
set _image human
exec ui_frame.cfg

	create graphic team_select_notification_window_background 0 0 360 115
		param image /gui/standard/black.s2g
		param alpha .3
//===============end notification window =======================================================


create panel "team1_panel" 18 120

	create userlist team1_members 35 20 200 460
		param team 1
		param interactive 1

	set _x 0
	set _y 0
	set _border 8
	set _width 256
	set _height 550
	set _image human
	exec ui_frame.cfg

	create graphic team1_window_background 0 0 256 550
		param image black.s2g
		param alpha .5


create panel "team2_panel" 751 120

	create userlist team2_members 35 20 200 460
