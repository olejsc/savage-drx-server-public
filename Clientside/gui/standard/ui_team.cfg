	set _x 0
	set _y 0
	set _border 8
	set _width 256
	set _height 550
	set _image human
	exec ui_frame.cfg

	create graphic team2_window_background 0 0 256 550
		param image black.s2g
		param alpha .5


create panel "game_config_panel" 751 650
	create button start_game_button -200 40 256 64
		param up_image button_strip_256x64.s2g
		param up_hover_image button_strip_256x64over.s2g
