//=============================================================================================
// Player bar
//=============================================================================================
create panel player_top_ctf_bar_panel 839 215

	create label team_1_ctf_label 0 3 97 15
		param text "Team 1 CTF"
		param char_height [fontsizesmall]
		param align center

	create slider team1_score_bar 105 5 75 10 horizontal
		param range 0 #sv_ctfTime#
		param variable cl_team1CTF
       		param bgshader none
		param fillshader progressbar.s2g
		param handleshader none
		param showvalue false	
		param interactive 0

	set _x 105
	set _y 5	
	set _border 2
	set _width 75
	set _height 10
	set _image human
	exec ui_frame.cfg
	
	create label team_2_ctf_label 0 20 97 15
		param text "Team 2 CTF"
		param char_height [fontsizesmall]
		param align center

	create slider team2_score_bar 105 22 75 10 horizontal
		param range 0 #sv_ctfTime#
		param variable cl_team2CTF
       		param bgshader none
		param fillshader progressbar.s2g
		param handleshader none
		param showvalue false	
		param interactive 0

	set _x 105
	set _y 22	
	set _border 2
	set _width 75
	set _height 10
	set _image human
	exec ui_frame.cfg

	create label team_3_ctf_label 0 37 97 15
		param text "Team 3 CTF"
		param char_height [fontsizesmall]
		param align center

	create slider team3_score_bar 105 39 75 10 horizontal
		param range 0 #sv_ctfTime#
		param variable cl_team3CTF
       		param bgshader none
		param fillshader progressbar.s2g
		param handleshader none
		param showvalue false	
		param interactive 0

	set _x 105
	set _y 39	
	set _border 2
	set _width 75
	set _height 10
	set _image human
	exec ui_frame.cfg

	set _x -2
	set _y 0	
	set _border 2
	set _width 185
	set _height 54
	set _image human
	exec ui_frame.cfg

	create graphic background 0 0 185 54
		param image black.s2g
		param alpha .25
		param interactive 0


hide player_top_ctf_bar_panel

