objput name _name
objput playercost _cost
objput description _text
objput icon _image

//only use objects which can be purchased
if [_cost <= 0] goto done

create graphic #_name#_graphic [_x + 8 + _col * 80] [_y + 8 + _row * _z] 20 20
	param image "$_image$.s2g"

create label #_name#_cost [_x + 8 + 20 + _col * 80] [_y + 8 + _row * _z + 5] 35 16
	param text "\$$_cost$"
	param char_height 10
	
create button #_name#_toggle [_x + 8 + 4 + 51 + _col * 80] [_y + 8 + 2 + _row * _z] 16 16
	on show "select $_panel$:$_name$_toggle;~
             if [cl_cmdr_aAR_$_name$==-1] param up_image /textures/cursors/unknown.s2g;~
	     if [cl_cmdr_aAR_$_name$==0] param up_image /gui/standard/gridmenus/icons/cancel.s2g;~
             if [cl_cmdr_aAR_$_name$==1] param up_image /gui/standard/gridmenus/icons/yes.s2g;~
	     if [cl_cmdr_aAR_$_name$==2] param up_image /gui/standard/gridmenus/icons/promote_#player_racename#.s2g"
	param command "inc cl_cmdr_aAR_$_name$;~
		ask iskeydown ctrl; if [answer] set cl_cmdr_aAR_$_name$ -1;~
		else if [cl_cmdr_aAR_$_name$ == 0] set cl_cmdr_aAR_$_name$ 1;~
		else if [cl_cmdr_aAR_$_name$ > 2] set cl_cmdr_aAR_$_name$ 0;~
		show $_panel$:$_name$_toggle"
	param rcommand "inc cl_cmdr_aAR_$_name$ -1;~
		ask iskeydown ctrl; if [answer] set cl_cmdr_aAR_$_name$ -1;~
		else if [cl_cmdr_aAR_$_name$ == -2] set cl_cmdr_aAR_$_name$ 0;~
		else if [cl_cmdr_aAR_$_name$ < 0] set cl_cmdr_aAR_$_name$ 2;~
		show $_panel$:$_name$_toggle"

inc _row

if [_row == _num_row] "set _row 0; inc _col"

@done

