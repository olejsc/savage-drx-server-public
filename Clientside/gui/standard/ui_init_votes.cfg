// wjd moved vote panel and added invisible button to hide it by clicking
//
// VOTE PANEL
set _votes_type 0

if [cl_resourcesPanel==1] "goto minimal"
if [cl_resourcesPanel==2] "goto hires"
if [cl_resourcesPanel==3] "goto legacy"
if [cl_resourcesPanel==4] "goto smoke"
if [cl_resourcesPanel==5] "goto minimal"

createvar vote_barlength 0;
createvar vote_greenratio 0;
createvar vote_redratio 0;
createvar vote_redsize 0;

@hires
set _vote_x 500
set _vote_y 60
set _votes_type 1
set _vote_frame human
goto votes

@legacy
set _vote_x 200
set _vote_y 4
set _votes_type 1
set _vote_frame oldthin
goto votes

@smoke
set _vote_x 160
set _vote_y 35
set _vbg_x -3
set _vbg_y 3
set _vbg_w 330
set _vbg_plr_h 105
set _vbg_cmd_h 165
set _vote_back smoke_team
set _vote_alpha .6
set _votes_type 2
goto votes

@minimal
set _vote_x 173
set _vote_y 40
set _vbg_x -3
set _vbg_y 3
set _vbg_w 255
set _vbg_plr_h 105
set _vbg_cmd_h 165
set _vote_back minimal_vote
set _vote_alpha .6
set _votes_type 2
goto votes


//==================================Framed Votes==========================================================
@votes
create panel "vote_panel" [_vote_x] [_vote_y]
	
	create label vote_seconds 235 12 20 24
		param cvar vote_seconds
		param char_height 12
		param align left

	create label vote_seconds_text 130 12 100 24
		param text "Vote Ends In:"
		param char_height 12
		param align right

	create label vote_yes 78 90 40 24
		param cvar vote_yes
		param char_height 12
		param textcolor 0 1 0
		param align left

	create label vote_yes_text 10 90 130 24
		param text "F1 for YES:"
		param char_height 12
		param textcolor 0 1 0
		param align left

	create label vote_no 232 90 20 24
		param cvar vote_no
		param char_height 12
		param textcolor 1 0 0
		param align left

	create label vote_no_text 205 90 20 24
		param text "F2 for NO:"
		param char_height 12
		param textcolor 1 0 0
		param align right

	create label vote_topic 10 32 250 24
		param cvar vote_description
		param char_height 16
		param textcolor 1 1 .2

	create slider line_slider 10 74 230 8 horizontal
		param fillshader "/gui/standard/gfx/transparent.s2g"
		param bgshader "/gui/standard/gfx/transparent.s2g"
		param handleshader "/gui/standard/white.s2g"
		param range 0 1
		param variable vote_need
		param showvalue "false"
		param handlesize 1

	create slider green_slider 10 74 230 8 horizontal
		param fillshader "/gui/standard/gfx/yes_votes.s2g"
		param bgshader "/gui/standard/gfx/transparent.s2g"
		param handleshader "/gui/standard/gfx/transparent.s2g"
		param range 0 1
		param variable vote_greensize

	create slider red_slider 10 74 230 8 horizontal
		param fillshader "/gui/standard/gfx/no_votes.s2g"
		param bgshader "/gui/standard/gfx/votebg.s2g"
		param handleshader "/gui/standard/gfx/transparent.s2g"
		param range 0 1
		param variable vote_redsize
		param showvalue "false"
		param shadow 0;

	if [_votes_type==2]	"create graphic "blackthing1" [_vbg_x] [_vbg_y] [_vbg_w] [_vbg_plr_h];~
		param image fps/#_vote_back#.s2g;~
		param alpha [_vote_alpha];~
		goto done1"

	if [_votes_type==1]	"set _x 0;~
		set _y 0;~
		set _width 270;~
		set _height 110;~
		set _border 4;~
		set _image #_vote_frame#;~
		set _frame_alpha [1];~
		exec ui_frame.cfg"
	if [_votes_type==1]	"~
		create graphic "blackthing2" 1 1 [_width-2] [_height-2];~
		param image /gui/standard/black.s2g;~
		param alpha [0.7]"

@done1

