if [_fc_legend == 1] goto legend

ask objectexists "$_name$"
if [!answer] goto done

objedit "$_name$"
objput icon _image
objput description _desc
objput playercost _cost
objput alwaysAvailable _free

if [_fc_index_x == 0] "set _fc_x 10"
create button fieldcomm_#_name#_button [_fc_x+_fc_gap_x+_fc_index_x*(_fc_size+_fc_pad)] [_fc_y+_fc_index_y*(_fc_size+_fc_pad)] [_fc_size] [_fc_size]
	param up_image "$_image$.s2g"
	param alt "$_desc$"

param command "playerrequest research $_name$; triggerIEvent"
if [_is_building==1] "param command \"playerrequest build $_name$\""
	param alpha 1
	param interactive 1

if [_free] "param alpha 0.2; param interactive 0"

goto done

@legend
create label fieldcomm_question [_fc_x+_fc_gap_x+_fc_index_x*(_fc_size+_fc_pad)] [_fc_y+_fc_index_y*(_fc_size+_fc_pad)] [_fc_size] [_fc_size]
	param text "?"
	param text_color 0 9 0 
	param char_height 32
	param shadow 1

create button fieldcomm_legend [_fc_x+_fc_gap_x+_fc_index_x*(_fc_size+_fc_pad)] [_fc_y+_fc_index_y*(_fc_size+_fc_pad)] [_fc_size] [_fc_size]
	param up_image "friend-actingofficer.s2g"
	param alt "^k Use^003 Officer Command (default F) ^kto mark the location of new buildings or to select the required tech building, before clicking the buttons."
	param command "mouseLocate 512 256; officer_cmd"

@done
set _fc_gap_x 0
