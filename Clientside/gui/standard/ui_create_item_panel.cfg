objput name _name
objput description _text
objput maxdeployment _deployment

objput playercost _tmp
if [_tmp < 0] goto end

create panel item_#_name#_panel 0 0
	create label rtime [0] [_itemPanelIconSize+11] [_itemPanelIconSize] [_itemPanelIconSize]
		on show "select item_"#_name#"_panel:rtime;~
		param researchobj "#_name#

	create label name [0] [_itemPanelIconSize] [_itemPanelIconSize] [_itemPanelNameCharHeight]
		param char_height [_itemPanelNameCharHeight]
		param text #_text#

//if [!_deployment] goto skipdeployment
	create label deployment ~
		[0] ~
		[5 - _itemPanelAmmoCharHeight] ~
		[_itemPanelIconSize] [_itemPanelAmmoCharHeight]
		param charheight [_itemPanelAmmoCharHeight]
@skipdeployment

	set _temp [_itemPanelIconSize / 2]
	create button request ~
		[_temp - (_itemPanelRequestWidth / 2)] ~
		[_temp - (_itemPanelRequestHeight / 2)] ~
		[_itemPanelRequestWidth] [_itemPanelRequestHeight]
		param up_image "/gui/standard/request.s2g"
		param sound "/sound/general/building_place.wav"
		param command "playerrequest object $_name$"
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"

	create button buy [0] [0] [_itemPanelIconSize] [_itemPanelIconSize]
		param command "give $_name$"
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/building_place.wav"

set _temp [_itemPanelBorder]
set _x [~
	_itemPanelX + _temp + _itemPanelXCushion + ~
	(_index % _itemPanelCols) * ~
	(_itemPanelIconSize + _itemPanelXSpacing)]
set _y [~
	_itemPanelY + _temp + _itemPanelYCushion + ~
	floor (_index / _itemPanelCols) * ~
	(_itemPanelIconSize + _itemPanelYSpacing + _itemPanelCostCharHeight)]
move item_#_name#_panel [_x] [_y]

inc ui_numItems 1
inc _index

@end
