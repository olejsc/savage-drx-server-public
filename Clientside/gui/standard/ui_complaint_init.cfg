create panel "complaint_panel" 2 350 

	create label vote_yes_text 10 77 130 24
		param text "F1 for YES"
		param char_height 12
		param textcolor 0 1 0
		param align left

	create label vote_no_text 205 77 20 24
		param text "F2 for NO"
		param char_height 12
		param textcolor 1 0 0
		param align right

	create label vote_topic 10 16 250 24
		param text "Place a complaint against"
		param char_height 16
		param textcolor 1 1 .2
		param align center

	create label vote_name_text 10 35 250 24
		param cvar cl_complaintname
		param char_height 16
		param textcolor .2 .2 1
		param align center

	create label vote_name_text 10 53 250 24
		param text "?"
		param char_height 24
		param textcolor 1 1 0.2
		param align center

	set _x 0
	set _y 0
	set _width 270
	set _height 98
	set _image thin
	set _border 8
	exec ui_frame.cfg

	create graphic "blackthing1" 2 2 267 95
		param image /gui/standard/black.s2g
		param alpha .7

hide complaint_panel