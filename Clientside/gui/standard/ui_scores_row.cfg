create graphic scoreline#_index# [_x] [_y] [_width] 1
	param image white.s2g
	param alpha .4

create graphic scorebar#_index# [_x] [_y+1] [_width] [_scorefontsize]
	param image white.s2g
	if [_scoreswitch == 0] param alpha .2
	if [_scoreswitch == 1] param alpha .1

toggle _scoreswitch
inc _y [_scorefontsize+gap]

