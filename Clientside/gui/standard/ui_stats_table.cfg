//=============================================================================================
// AWARDS Panel
//=============================================================================================

hide player_minimap_panel
set stats_line_height 20
set stats_text_height 18

createvar _label_width
createvar _value_width
createvar _label_spacing
		
set _label_width 400
set _value_width 250
set _label_spacing 10
set _height 25

create panel "stats_best_panel" 510 10


//================Frame
set _x 0
set _y 0
set _width 500
set _height 735
set _border 6

//set _name stats_best
exec ui_frame.cfg

set _ic_width 40
set _ic_height 40
set _sp 8
set _tp 16
set _lsp 12 
set _top_margin 6
set _left_margin 11
set _right_margin 5
set _hsp 240
set _vsp 48
set _bk_height 40
set _bk_width  195
set _ch_height 14
set _back_alpha .6
set _bk_width_name 55
set _new_line 12
set _info_sp 1

set _inactive 1


