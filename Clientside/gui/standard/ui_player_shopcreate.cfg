//uses _shop_name, _shop_description

create button #_shop_name# [_x+_shops_spacing] [_y] [_itemPanelIconSize] [_itemPanelIconSize]
		param mouseover_command "~
			set _name \"$_shop_name$ Shop\";~
			set _text \"$_shop_description$\";~
			set _icon \"/models/savageheroes/icons/shops/items_btn_shop_$_shop_name$.tga\";~
			exec /gui/standard/ui_update_description_panel_shop.cfg;~
			show unit_select_tooltip_panel"

		param command "do _hide_shops_human; do _hide_shops_beast; if [player_race == 1] \"show shop_$_shop_name$_human\"; if [player_race == 2] \"show shop_$_shop_name$_beast\"; select shops_panel:Heroes_label; param textcolor 1 1 0; select shops_panel:Melee_label; param textcolor 1 1 0; select shops_panel:Ranged_label; param textcolor 1 1 0; select shops_panel:Items_label; param textcolor 1 1 0; select shops_panel:Events_label; param textcolor 1 1 0; select shops_panel:Info_label; param textcolor 1 1 0; select shops_panel:$_shop_name$_label; param textcolor 1 0 0"

		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/building_place.wav"
		param alpha 1
		param interactive 1
		param sound "/sound/general/building_place.wav"
		param alt ""
		param up_image "/models/savageheroes/icons/shops/items_btn_shop_$_shop_name$.tga"
		param enable true

create label #_shop_name#_label [_x+_shops_spacing] [_y+_shops_spacing_inc-10] 48 10
		param text "$_shop_name$"
		param align center
		param textcolor 1 1 0
		param char_height [fontsizesmall]
		param shadow 1

inc _shops_spacing [_shops_spacing_inc]