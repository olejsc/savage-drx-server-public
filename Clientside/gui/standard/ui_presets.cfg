// by Enliven

set pr_set "do _pr_set#player_race#"

set _pr_set1 "~
 setsave pr_unit1 #player_currentunit#;~
 ask inventory 1; setsave pr_weapon1 #answer#;~
 ask inventory 2; setsave pr_item11 #answer#; ask ammo 2; setsave pr_num11 #answer#;~
 ask stringsmatch #pr_item11# "human_relocater_trigger"; if [answer] setsave pr_item11 "human_relocater";~
 ask inventory 3; setsave pr_item21 #answer#; ask ammo 3; setsave pr_num21 #answer#;~
 ask stringsmatch #pr_item21# "human_relocater_trigger"; if [answer] setsave pr_item21 "human_relocater";~
 ask inventory 4; setsave pr_item31 #answer#; ask ammo 4; setsave pr_num31 #answer#;~
 ask stringsmatch #pr_item31# "human_relocater_trigger"; if [answer] setsave pr_item31 "human_relocater""

set _pr_set2 "~
 setsave pr_unit2 #player_currentunit#;~
 ask inventory 0; setsave pr_melee2 #answer#;~
 ask inventory 1; setsave pr_weapon2 #answer#;~
 ask inventory 2; setsave pr_item12 #answer#; ask ammo 2; setsave pr_num12 #answer#;~
 ask inventory 3; setsave pr_item22 #answer#; ask ammo 3; setsave pr_num22 #answer#;~
 ask inventory 4; setsave pr_item32 #answer#; ask ammo 4; setsave pr_num32 #answer#"