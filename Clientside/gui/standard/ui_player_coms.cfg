ask whoisCommander
ask stringsmatch #answer# #name#
if [answer] goto skip

toggle ui_showPlayerBuildRequest
echo #ui_showPlayerBuildRequest#

if [ui_showPlayerBuildRequest] "~
	mousefree;~
	mouseLocate 750 550;~
	show player_build_request_panel"

if [!ui_showPlayerBuildRequest] "~
	mouserecenter;~
	hide player_build_request_panel"

@skip
