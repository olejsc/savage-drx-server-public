objput builder1 _cost
ask stringsmatch #_cost# ""
if [answer] goto end
objput isworker _cost
if [_cost] goto end

// have to hack this up a bit because I can't change the order of objlist.cfg
// without breaking compatibility
objput builder1 _cost
ask stringsmatch #_cost# human_monastery
if [answer & _showmonastery == 0] goto end
ask stringsmatch #_cost# beast_sanctuary
if [answer & _showsanctuary == 0] goto end

objput objclass _cost
ask stringsmatch #_cost# weapon
if [answer] goto good
ask stringsmatch #_cost# melee
if [answer] goto good
if [_meleeweapsonly] goto end
ask stringsmatch #_cost# unit
if [answer] goto good
ask stringsmatch #_cost# item
if [answer] goto good

goto end

@good
objput name _name
objput icon _tmp

set _x [_temp * _z + _temp * _gap + _gap]

create label reslabel#_index# [_x] [_y+_z-16] [_z] [_z]
  param shadow 1
  param char_height 16
  param text " "
  
create graphic res#_index# [_x] [_y] [_z] [_z]
  on show "select "#_race#"_researched_panel:res"#_index#";~
    ask isTypeResearching "#_name#";~
    set _researching #answer#;~
    ask isResearched "#_name#";~
    set _researched #answer#;~
    ask isAvailable "#_name#";~
    if [answer & _researched] \"param alpha 1; select "#_race#"_researched_panel:reslabel"#_index#"; param researchobj \"\"\";~
    if [_researching & !_researched] \"param alpha 0.6; select "#_race#"_researched_panel:reslabel"#_index#"; param researchobj "#_name#"\";~
    if [!answer & _researched] \"param alpha 0.6; select "#_race#"_researched_panel:reslabel"#_index#"; param researchobj \"\"\";~
    if [!_researching & !_researched] \"param alpha 0.3; select "#_race#"_researched_panel:reslabel"#_index#"; param researchobj \"\"\""
  param image #_tmp#.s2g

 create graphic bgb#_index# [_x] [_y+_z] [_z+_gap] [_gap]
    param image black.s2g
    param alpha 0.7

 create graphic bgr#_index# [_x+_z] [_y] [_gap] [_z]
    param image black.s2g
    param alpha 0.7

// hack to make things line up better
ask stringsmatch #_name# human_potion
if [answer] goto empty
ask stringsmatch #_name# beast_revive
if [answer] goto empty
goto done

@empty
set _x [(_temp+1) * (_z+_gap) + _gap]
create graphic bgb#_index# [_x] [_y+_z] [(_z+_gap)*(_max-_temp)] [_gap]
  param image black.s2g
  param alpha 0.7
inc _index [_max-_temp]
set _temp [_max]


@done
inc _index
inc _temp
if [_temp > _max] "set _temp 0; inc _y [_gap + _z]
  
@end