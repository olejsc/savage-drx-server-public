set _sqd_icon_width 12
set _sqd_icon_length 12
set _sqd_icon_y 6
set _sqd_icon_x 16

create panel "player_squad_panel" -5 0

	// Squad Selection Buttons
	create graphic squad_selection 21 12 [_sqd_icon_width+2] [_sqd_icon_length+2]
		param image itemselection.s2g

	create button squad1_button [_sqd_icon_x] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param command "setsquad 1"
		param alpha 0.9

	create button squad2_button [_sqd_icon_x*2] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param command "setsquad 2"
		param alpha 0.9

	create button squad3_button [_sqd_icon_x*3] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param command "setsquad 3"
		param alpha 0.9

	create button squad4_button [_sqd_icon_x*4] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param command "setsquad 4"
		param alpha 0.9

	create button squad5_button [_sqd_icon_x*5] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param command "setsquad 5"
		param alpha 0.9

	create button squad6_button [_sqd_icon_x*6] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param command "setsquad 6"
		param alpha 0.9

	create button squad0_button [_sqd_icon_x*8] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		param up_image /textures/squads/squad0.s2g
		param command "setsquad 0"
		param alpha 0.9

	// Squad Info Toggle Button
	create button configure [_sqd_icon_x*9] [_sqd_icon_y] [_sqd_icon_width] [_sqd_icon_length]
		if [cl_show_squad] "param up_image /gui/standard/downarrow.s2g"
		else "param up_image /gui/standard/uparrow.s2g"
		param align left
		param alpha 0.9
		param command "if [cl_show_squad == 0] \"set cl_show_squad 1\";~
						else if [cl_show_squad == 1] \"set cl_show_squad 2\";~
						else if [cl_show_squad == 2] \"set cl_show_squad 0\";~
						exec /gui/standard/ui_update_player_squad.cfg;~
						show player_squad_panel:configure"		
		on show "select player_squad_panel:configure;~
				 if [cl_show_squad == 0] \"param up_image /gui/standard/uparrow.s2g\";~
				 if [cl_show_squad == 1] \"param up_image /gui/standard/downarrow.s2g\";~
				 if [cl_show_squad == 2] \"param up_image /gui/standard/leftarrow.s2g\""

	// Mission Button & Label
	create button mission_button 14 18 54 16
		param text "Mission:"
		param char_height 11
		param shadow 1
		param align left
		param alpha 0.8
		param up_image /gui/standard/small_button.s2g

	create label mission_label 53 20 130 16
		param cvar squad_mission0
		param char_height 11
		param shadow 1
		param align left
		param alpha 0.9

	// Background & Frame
	create graphic squad_bg -5 -15 195 88
		param image /gui/standard/fps/smoke_player.s2g
		param alpha [0.7-_am]

	// Squad Mate Blocks
	createvar _block 0
	createvar _index 0
	createvar _ypos 54
	createvar _xspacing 19
	for _block 0 5 1 "~
		exec ui_player_squad_block.cfg;~
		inc _ypos 48"

//=============================================================================================

goto done



