objput name _name
objput icon _image
objput playercost _cost
objput description _text
objput maxdeployment _deployment

objput playercost _tmp
if [_tmp < 0] goto end


set _temp [_itemPanelBorder]
set _x [~
	_itemPanelX + _temp + _itemPanelXCushion + ~
	(_index % _itemPanelCols) * ~
	(_itemPanelIconSize + _itemPanelXSpacing)]
set _y [~
	_itemPanelY + _temp + _itemPanelYCushion + ~
	floor (_index / _itemPanelCols) * ~
	(_itemPanelIconSize + _itemPanelYSpacing + _itemPanelCostCharHeight)]

set _x [_x-4]
set _y [_y+2]
set _width [_itemPanelIconSize+8]
set _height [_itemPanelIconSize+8]
//set _border 2
//set _image thin
set _border 4
set _image standard
exec #gui_basepath#/ui_frame.cfg

set _x [_x+4]
set _y [_y-2]


//	create label name [0 + _itemPanelIconSize * _index] [_itemPanelIconSize] [_itemPanelIconSize] [_itemPanelNameCharHeight]
	create label #name#_name [_x] [_y + _itemPanelIconSize+10] [_itemPanelIconSize] [_itemPanelNameCharHeight]
		param char_height [_itemPanelNameCharHeight]
		param text #_text#
		param align center

	create label #name#_cost [_x] [_y + _itemPanelIconSize + _itemPanelNameCharHeight+10] [_itemPanelIconSize] [_itemPanelNameCharHeight]
		param char_height [_itemPanelNameCharHeight]
		param text #_cost#
		param align center
		param textcolor 1 1 0



//	create button buy [0 + _itemPanelIconSize * _index] [0] [_itemPanelIconSize] [_itemPanelIconSize]
	create button #name#_buy [_x] [_y+6] [_itemPanelIconSize] [_itemPanelIconSize]
// Won't have on the fly changing between 2D and 3D but still, it's a mod! People will have had that set before loading it.
		if [cl_3dLoadout] "param up_image \"\"; param up_hover_image /textures/core/1_nl_over.s2g"
	              else param up_image "$_image$.s2g"
		//echo canPurchase [_z]
		if [_z]	"param command \"unit $_name$\""
		if [!_z] "param command \"unit $_name$; ~
			giveback 1; giveback 2; giveback 2; giveback 2\""
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/building_place.wav"
		param alpha 1
		param interactive 1
		param alt ""
		param enable true


	create graphic #name#_bgbuy [_x] [_y+6] [_itemPanelIconSize] [_itemPanelIconSize]
	  	param up_hover_image /textures/core/1_nl_over.s2g
//	   on show "select shop_Heroes:"#_name#"_bgbuy;~
//              if [cl_3dLoadout] param 3dobject "#_name#";~
//              else param 3dobject"
		if [cl_3dLoadout] param 3dobject "#_name#"
	              else param 3dobject
	   param animstate idle
	   param ontop 0
	   param dist_scale 2
	   param pitch -15



//move item_#_name#_panel [_x] [_y]

inc ui_numItems 1
inc _index

@end
