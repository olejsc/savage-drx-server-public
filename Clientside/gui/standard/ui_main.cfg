set gui_basepath /gui/standard

// Jag: alternate background
if [alternateBgLoaded] createvar alternateBgModify 0; else createvar alternateBgModify 1
createvar alternateBgLoaded 1
if [alternateBgModify] "if [alternateBg] setsave alternateBg 0; else setsave alternateBg 1;";
if [alternateBgModify] "if [alternateBg] createvar _bg 1; else set _bg 2;";
if [alternateBgModify] "if [alternateBg] set _button human; else set _button beast;";

exec /gui/standard/createvars.cfg
exec /gui/standard/menu/ui.cfg
exec /gui/standard/ui_tips.cfg
gui_staticdepth 1

//========================================================================
//exec /settings/set_options.cfg
select filter_panel:filters_pure
	param text #gamelist_pure#

ask stringsmatch All #gamelist_pure#
if [answer == 1] set _filterPureSetting 0

ask stringsmatch "Pure Only" #gamelist_pure#
if [answer == 1] set _filterPureSetting 1

ask stringsmatch "Impure Only" #gamelist_pure#
if [answer == 1] set _filterPureSetting 2

select filter_panel:filters_races
param text #gamelist_race#

ask stringsmatch "Any" #gamelist_race#
if [answer == 1] set _filterRacesSetting 0

ask stringsmatch "human v human" #gamelist_race#
if [answer == 1] set _filterRacesSetting 1

ask stringsmatch "human v beast" #gamelist_race#
if [answer == 1] set _filterRacesSetting 2

ask stringsmatch "beast v beast" #gamelist_race#
if [answer == 1] set _filterRacesSetting 3
//========================================================================

set cl_tip_x 500
showtip "Welcome to Savage: XR!  If this is your first time, try taking a look at the TUTORIALS and Game OPTIONS. You currently have tips enabled. These tips will help to guide you through the game.  If you want to disable tips, you can turn them off in Game Options."
