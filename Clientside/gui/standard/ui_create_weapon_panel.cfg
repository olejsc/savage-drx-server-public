objput name _name
objput description _text
objput playercost _cost
objput icon _image

objput objclass _tmp
ask stringsmatch melee #_tmp#
if [answer] goto ok
ask stringsmatch weapon #_tmp#
if [answer] goto ok
goto end
@ok

create panel weapon_#_name#_panel 0 0
	create label rtime [0] [_weaponPanelIconSize+11] [_weaponPanelIconSize] [_weaponPanelIconSize]
		on show "select weapon_"#_name#"_panel:rtime;~
		param researchobj "#_name#

	create label name ~
		[0] ~
		[_weaponPanelIconSize] ~
		[_weaponPanelIconSize] [_weaponPanelNameCharHeight]

		param char_height [_weaponPanelNameCharHeight]
		param text #_text#
		param shadow 1

	create label ammo ~
		[0] ~
		[_weaponPanelIconSize - _weaponPanelAmmoCharHeight] ~
		[_weaponPanelIconSize] [_weaponPanelAmmoCharHeight]

		param char_height [_weaponPanelAmmoCharHeight]
		param align right
		param shadow 1

	set _temp [_weaponPanelIconSize / 2]
	create button request ~
		[_temp - (_weaponPanelRequestWidth / 2)] ~
		[_temp - (_weaponPanelRequestHeight / 2)] ~
		[_weaponPanelRequestWidth] [_weaponPanelRequestHeight]

		param up_image "/gui/standard/request.s2g"
		param command "playerrequest object $_name$"
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/building_place.wav"

	create button buy [0] [0] [_weaponPanelIconSize] [_weaponPanelIconSize]
		param command "giveback 0; giveback 1; give $_name$;"
		param mouseover_command "~
			set _name $_name$;~
			exec /gui/standard/ui_update_description_panel.cfg;~
			show unit_select_tooltip_panel"
		param mouseaway_command "hide unit_select_tooltip_panel"
		param sound "/sound/general/building_place.wav"

inc ui_numWeapons 1

set _temp [_weaponPanelBorder + _weaponPanelCushion]
set _x [~
	_weaponPanelX + _temp + ~
	(_index % _weaponPanelCols) * ~
	(_weaponPanelIconSize + _weaponPanelXSpacing)]
set _y [~
	_weaponPanelY + _temp + ~
	floor (_index / _weaponPanelCols) * ~
	(_weaponPanelIconSize + _weaponPanelYSpacing + _weaponPanelCostCharHeight)]
move weapon_#_name#_panel [_x] [_y]

inc _index

@end
