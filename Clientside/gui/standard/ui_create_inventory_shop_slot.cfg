set _temp 600
set _border [_playerInfoInventoryBorder]
set _width [_playerInfoInventorySize]
set _height [_playerInfoInventorySize]
set _x [_temp + _index * _playerInfoInventorySize]
if [_index > 1] "set _x {_x + _playerInfoInventoryDivide}"


create label ammo#_index# ~
		[_x]~
		[_y + _height - _playerInfoInventoryAmmoCharHeight]~
		[_width]~
		[_playerInfoInventoryAmmoCharHeight]
	param char_height [_playerInfoInventoryAmmoCharHeight]
	param align right
	param shadow 1

create button slot#_index# [_x]	[_y] [_playerInfoInventorySize]	[_playerInfoInventorySize]
	param command "giveback $_index$"
	param sound "/sound/general/building_place.wav"

create label label#_index# [_x] [_y + _playerInfoInventorySize] [_playerInfoInventorySize] [12]
	if [_index == 0] param text Melee
	if [_index == 1] param text Weapon
	if [_index > 1] "param text \"Item {_index + 1}\""

set _x [_temp]
