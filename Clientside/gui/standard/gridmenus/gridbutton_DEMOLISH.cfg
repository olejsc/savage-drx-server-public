set _grid_enable 1
set _grid_caption "Demolish"
set _grid_command "~
	exec /gui/standard/gridmenus/layout_demolish_check.cfg;~
	exec /gui/standard/gridmenus/ui_setupgrid.cfg"
set _grid_tooltip "Destroy a building to recover a portion of it's value"
set _grid_icon "icons/demolish"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_kill
else setToValue _grid_shortcut grid_hotkey_kill
set _grid_queueable 1	//not really 'queueable', but this lets you use it while building is busy