//set cvars to match correspondign square
/////////////////////////////////////////
set _temp "set grid_popup_name #grid_popup_name$_grid_index$#"
do _temp
set _temp "set grid_popup_description #grid_popup_description$_grid_index$#"
do _temp
set _temp "set grid_popup_costs #grid_popup_costs$_grid_index$#"
do _temp
set _temp "set grid_popup_population #grid_popup_population$_grid_index$#"
do _temp
set _temp "set grid_popup_base #grid_popup_base$_grid_index$#"
do _temp

set _temp "set grid_popup_requirements #grid_popup_requirements1a$_grid_index$#"
do _temp
set _temp "set grid_popup_requirements2a #grid_popup_requirements2a$_grid_index$#"
do _temp
set _temp "set grid_popup_requirements3a #grid_popup_requirements3a$_grid_index$#"
do _temp
set _temp "set grid_popup_partialRequirements #grid_popup_requirementsPa$_grid_index$#"
