ask stringsMatch #grid_popup_requirements3b# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements3b [14] [_y]

ask stringsMatch #grid_popup_partialRequirementsB# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_partialRequirementsB [14] [_y]

ask stringsMatch #grid_popup_requirements1c# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements1c [14] [_y]

ask stringsMatch #grid_popup_requirements2c# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements2c [14] [_y]

ask stringsMatch #grid_popup_requirements3c# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements3c [14] [_y]

ask stringsMatch #grid_popup_tech# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_tech [14] [_y]


move grid_popup_panel:frame_bottomleft 0 [_y + 14]
move grid_popup_panel:frame_bottom 8 [_y + 14]
move grid_popup_panel:frame_bottomright [268 - 8] [_y + 14]

move grid_popup_panel 756 [424 + (139 - _height)]
//fadein grid_popup_panel #cl_gridPopupFadeTime#
show grid_popup_panel
