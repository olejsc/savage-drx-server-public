set _temp "set grid_popup_tech #grid_popup_tech$_grid_index$#"
do _temp

textbuffer clear grid_popup_description_buffer
textbuffer print grid_popup_description_buffer "$grid_popup_description$"

//resize the box
////////////////
set _height [28 + (4 * 12) + (8 * 2) + 5]
set _y [28 + (4 * 12) + 8 - 12]

//cost
ask stringsMatch #grid_popup_costs# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_costs_label [14] [_y]

ask stringsMatch #grid_popup_population# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_population_label [14] [_y]

ask stringsMatch #grid_popup_base# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_base [14] [_y]

ask stringsMatch #grid_popup_requirements# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements [14] [_y]

ask stringsMatch #grid_popup_requirements2a# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements2a [14] [_y]

ask stringsMatch #grid_popup_requirements3a# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements3a [14] [_y]

ask stringsMatch #grid_popup_partialRequirements# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_partialRequirements [14] [_y]

ask stringsMatch #grid_popup_requirements1b# ""
if [!answer] "inc _height 14; inc _y 14"
move grid_popup_panel:grid_popup_requirements1b [14] [_y]

ask stringsMatch #grid_popup_requirements2b# ""
if [!answer] "inc _height 14; inc _y 14"
