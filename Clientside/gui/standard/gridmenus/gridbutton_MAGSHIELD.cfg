set _grid_enable 1
set _grid_caption "Magnetic Shield"
set _grid_command "activateupgrade human_magnetic_shield"
set _grid_tooltip "Increase this unit's armor"
set _grid_icon "icons/magneticshield"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_magshield
else setToValue _grid_shortcut grid_hotkey_magshield