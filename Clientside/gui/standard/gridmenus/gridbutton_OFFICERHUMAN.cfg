ask currentDir
set _temp #answer#

ask selection 0
ask isOfficer #answer#
if [answer] goto demote

//promote
set _grid_enable 1
set _grid_caption "Promote"
set _grid_command "~
	promoteToOfficer;~
	exec $answer$/ui_setupgrid.cfg"
set _grid_tooltip "Promote this unit to an officer"
set _grid_icon "/gui/standard/gridmenus/icons/promote"
set _grid_show_popup 1
goto done

@demote
set _grid_enable 1
set _grid_caption "Demote"
set _grid_command "~
	demoteOfficer;~
	exec $answer$/ui_setupgrid.cfg"
set _grid_tooltip "Demote this officer"
set _grid_icon "/gui/standard/gridmenus/icons/demote"
set _grid_show_popup 1
goto done

@done
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_promote
else setToValue _grid_shortcut grid_hotkey_promote