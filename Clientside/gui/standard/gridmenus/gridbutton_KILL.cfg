set _grid_enable 1
set _grid_caption "Kill"
set _grid_command "~
	exec /gui/standard/gridmenus/layout_kill_check.cfg;~
	exec /gui/standard/gridmenus/ui_setupgrid.cfg"
set _grid_tooltip "Kill this unit"
set _grid_icon "icons/cancel"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_kill
else setToValue _grid_shortcut grid_hotkey_kill

