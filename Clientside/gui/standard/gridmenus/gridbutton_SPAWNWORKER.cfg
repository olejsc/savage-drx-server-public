//test the requirements
ask amountDespawned
if [answer] goto makeavailable
goto makedisabled

@makedisabled
set _grid_enable -1
goto done

@makeavailable
set _grid_enable 1
goto done

@done
set _grid_caption "Spawn Worker"
set _grid_command "spawnworker"
set _grid_tooltip "Spawn a worker"
set _grid_icon "icons/spawn_worker"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_spawn
else setToValue _grid_shortcut grid_hotkey_spawn
