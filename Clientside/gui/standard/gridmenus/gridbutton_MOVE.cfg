set _grid_enable 1
set _grid_caption "Move"
set _grid_command "pickLocation waypoint"
set _grid_tooltip "Move this unit to a specified destination"
set _grid_icon "icons/move_icon"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_move
else setToValue _grid_shortcut grid_hotkey_move
