set _previous_grid "/gridmenus/layout_default.cfg"

ask selection 0
ask isAlly #answer#
if [answer < 0] "goto enemy"
if [answer == 0] "goto empty"

ask selection 0
ask objecttype #answer#
objloop INCLUDE 1 NOWRAP FORWARD name #answer# "objput objclass _text; objput isWorker _temp; objbreakloop"

ask stringsmatch #_text# building
if [answer] goto building
ask stringsmatch #_text# unit
if [answer] goto unit
ask stringsmatch #_text# item
if [answer] goto item
goto empty

@building
exec layout_default_structure#_gridlayout_append#.cfg
goto done

@unit
if [_temp] "exec layout_default_worker.cfg; goto done"
exec layout_default_player.cfg
goto done

@item
exec layout_item.cfg
goto done

@empty
exec layout_empty.cfg
goto done

@enemy
exec layout_enemy.cfg
goto done

@done
