set _grid_enable 1
set _grid_caption "Gateway"
set _grid_command "purchase beast_gateway"
set _grid_tooltip "Open a portal from the earth ^g(Cost: 300 Entropy)"
set _grid_icon "/models/beast/items/icons/portal"
set _grid_show_popup 1
if [cl_cmdr_customHotkeys] setToValue _grid_shortcut custom_grid_hotkey_beast_gateway
else setToValue _grid_shortcut grid_hotkey_beast_gateway
set _grid_queueable 1  //not really 'queueable', but this lets you use it while building is busy
