if [!_ldsp_x] setsave _ldsp_x 429
if [!_ldsp_y] setsave _ldsp_y 158
if [_wide] "setsave _ldsp_x 429; setsave _ldsp_y 158"

create panel "spawnpoint_select_panel_loadout" [_ldsp_x] [_ldsp_y]

	set _sp_size 220
	set _x 0
	set _y 12
	set _border 4
	set _width [_sp_size/_sr]
	set _height [_sp_size]
	set _image neutral
	exec /gui/standard/ui_frame.cfg


	create map minimap 0 12 [_sp_size/_sr] [_sp_size]
		param friend_arrow_image /textures/minimap/friend_arrow.s2g
		param friend_building_image /textures/minimap/friend_building.s2g
		param friend_dot_image /textures/minimap/friend_dot.s2g
		param friend_dead_image /textures/minimap/friend_dead.s2g		
		param friend_player_image /textures/minimap/friend_player.s2g
		param friend_officer_image /textures/minimap/friend_officer.s2g
		param friend_healer_image /textures/minimap/friend_healer.s2g
		param friend_siege_image /textures/minimap/friend_siege.s2g
		param friend_healer_officer_image /textures/minimap/friend_healer_officer.s2g
		param friend_siege_officer_image /textures/minimap/friend_siege_officer.s2g
		param friend_helper_image /textures/minimap/friend_helper.s2g
		param friend_shop_image /textures/minimap/friend_shop.s2g
		param friend_cart_image /textures/minimap/friend_helper.s2g
		param friend_leader_image /textures/minimap/friend_leader.s2g
	
		param enemy_building_image /textures/minimap/enemy_building.s2g
		param enemy_dot_image /textures/minimap/enemy_dot.s2g
		param enemy_player_image /textures/minimap/enemy_player.s2g
		param enemy_officer_image /textures/minimap/enemy_officer.s2g
		param enemy_healer_image /textures/minimap/enemy_healer.s2g
		param enemy_siege_image /textures/minimap/enemy_siege.s2g
		param enemy_healer_officer_image /textures/minimap/enemy_healer_officer.s2g
		param enemy_siege_officer_image /textures/minimap/enemy_siege_officer.s2g
		param enemy_helper_image /textures/minimap/enemy_helper.s2g
		param enemy_shop_image /textures/minimap/enemy_shop.s2g
		param enemy_cart_image /textures/minimap/enemy_helper.s2g
		param enemy_leader_image /textures/minimap/enemy_leader.s2g		

		//Mohican: Squad Blips
		param squad_arrow_image /textures/minimap/squad_arrow.s2g
		param squad_player_image /textures/minimap/squad_player.s2g
		param squad_officer_image /textures/minimap/squad_officer.s2g
		param squad_healer_image /textures/minimap/squad_healer.s2g
		param squad_siege_image /textures/minimap/squad_siege.s2g
		param squad_healer_officer_image /textures/minimap/squad_healer_officer.s2g
		param squad_siege_officer_image /textures/minimap/squad_siege_officer.s2g 

		param neutral_dot_image /textures/minimap/neutral_dot.s2g
		param waypoint_image /gui/standard/flag0000.s2g
		param waypoint_officer_image /gui/standard/cyan_flag0000.s2g
		param blip_image /textures/icons/blip/blip0000.s2g
		param bg_cvar world_overhead
		on mousedown "do pr_set; clearIEventAssociations"

		param fpsmode 1
		param spawnselect 1
		param scale 1.6
	


//============TEAM INFO

	set _x 0
	set _y 233
	set _border 4
	set _width [_sp_size/_sr]
	set _height [40]
	set _image neutral
	exec /gui/standard/ui_frame.cfg

if [_wide] "set _sp_offset1 3; set _sp_offset2 8; set _sp_offset3 10; set _sp_offset4 15; set _sp_offset5 18; set _sp_offset6 22; set _sp_offset7 26; set _sp_offset8 28; set _sp_offset9 31;"

	create graphic base_icon 5 238 [16/_sr] 16

	create slider base_health_bar 21 241 [_sp_size/_sr-27] 10 horizontal
		param range 0 100
		param variable team_commandcenter_healthpercent
		param bgshader none
		param fillshader progressbar.s2g
		param handleshader none
		param showvalue false
		param interactive 0

	create graphic resource_gold_icon 5 252 [16/_sr] 16
		param image gold.s2g

	create label team_status_gold [23-_sp_offset1] 254 50 21
		param cvar resource_gold
		param align left
		param char_height [fontsizesmall]
		param textcolor 1 1 0
		param shadow 1

	create graphic resource_stone_icon [56-_sp_offset2] 252 [16/_sr] 16
		param image redstone.s2g

	create label team_status_stone [73-_sp_offset3] 254 50 21
		param cvar resource_stone
		param align left
		param char_height [fontsizesmall]
		param textcolor 1 0 0
		param shadow 1

	create graphic team_status_resource1_icon [105-_sp_offset4] 252 [16/_sr] 16

	create label team_status_resource1_label [122-_sp_offset5] 254 25 21
		param shadow 1
		param align left
		param char_height [fontsizesmall]

	create graphic team_status_resource2_icon [143-_sp_offset6] 252 [16/_sr] 16

	create label team_status_resource2_label [162-_sp_offset7] 254 25 21
		param align left
		param shadow 1
		param char_height [fontsizesmall]

	create graphic team_status_resource3_icon [180-_sp_offset8] 252 [16/_sr] 16

	create label team_status_resource3_label [197-_sp_offset9] 254 25 21
		param align left
		param shadow 1
		param char_height [fontsizesmall]

	create graphic team_status_back 0 233 [_sp_size/_sr] 40
		param image black.s2g
		param movieendcommand "set _bfs [team_commandcenter_healthpercent - (team_commandcenter_healthpercent%33)]; select spawnpoint_select_panel_loadout:base_health_bar; param fillshader /gui/standard/new_base_#_bfs#.s2g"
		param execdelay 128
		param alpha 1


//		on show "set _enable 1; exec /gui/standard/ui_set_freemouse.cfg"
//		on hide "set _enable 0; exec /gui/standard/ui_set_freemouse.cfg"

	set _x 0
	set _y 0
	set _width [_sp_size/_sr]
	set _height [_sp_size+12+41]
	set _gap 0.7
	exec /gui/standard/ui_dropshadow.cfg


	create titlebar minimap_title 0 0 [_sp_size/_sr] 12
		param title "Select a spawn location:"
		param hide_cmd "hide spawnpoint_select_panel_loadout; setsave _loadout_minimap 0"
		param align center
		on mousedown "set _x #int_mousepos_x#; set _y #int_mousepos_y#"
		on mouseup "setsave _ldsp_x [_ldsp_x+(int_mousepos_x-_x)/_sr]; setsave _ldsp_y [_ldsp_y+(int_mousepos_y-_y)/_sr]"


hide spawnpoint_select_panel_loadout
