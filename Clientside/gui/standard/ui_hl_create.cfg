
//  Creates Highlighter Widget

set _x 0
set _y 0
set _width  200
set _height 200
set _border 8
createvar _vig_x 0
createvar _vig_y 0

create panel hl 0 0
		
	//top obstruction
	create graphic black_top 0 0 1024 [_y]
		param image black.s2g
		param alpha 0.6
		
	//right obstruction
	create graphic black_right [_x + _width] [_y] [1024 - _x - _width] [_height]
		param image black.s2g		
		param alpha 0.6

	//left obstruction
	create graphic black_left 0 [_y] [_x - 1] [_height]
		param image black.s2g	
		param alpha 0.6
		
	//bottom obstruction
	create graphic black_bottom 0 [_y + _height] 1024 [768 - _y - _height]
		param image black.s2g
		param alpha 0.6		

create panel hl_vignette 0 0 

	//vignette
	create graphic vignette 0 0 512 512
		param image vignette.s2g
		param alpha 0.6
		


hide hl_vignette
hide hl



