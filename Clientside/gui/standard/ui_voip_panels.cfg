// Mohican: VOIP List & Control
// Shared between Commander & Player UIs

create panel "voip_list" 15 508

	create scrollbuffer "buffer" 0 0 300 120
		param delay_secs 100
		param icon_height 20
		param char_height 14
		param anchor_to_current_line 1
		param wraparound 1
		param selectable 0
		param wrap 1
		param rows 6
		param alpha [0.6-_am]


create panel "voip_control" 8 630

	create graphic selection 5 2 16 16
		param image "/textures/icons/nl_voip.s2g"

	create graphic selection 30 2 40 17
		param image "itemselection.s2g"

	create label global 35 4 100 12
		param text "^w1. ^yAll"
		param char_height 14
		param shadow 1
		param align left

	create label team 85 4 100 12
		param text "^w2. ^797Team"
		param char_height 14
		param shadow 1
		param align left

	create label squad 145 4 100 12
		param text "^w3. ^bSquad"
		param char_height 14
		param shadow 1
		param align left

	set _x 0
	set _y 0	
	set _border 2
	set _width 210
	set _height 20
	set _image human
	exec ui_frame.cfg

	create graphic "blackthing1" 0 0 210 20
		param image black.s2g
		param alpha .3