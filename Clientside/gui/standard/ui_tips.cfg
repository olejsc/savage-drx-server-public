//Use "frame" for frame graphics that change depending or race, or "border" for fixed graphic frames

if [cl_resourcesPanel==1] "createvar _tips_frame border"
if [cl_resourcesPanel==2] "createvar _tips_frame frame"
if [cl_resourcesPanel==3] "createvar _tips_frame border"
if [cl_resourcesPanel==4] "createvar _tips_frame border"
if [cl_resourcesPanel==5] "createvar _tips_frame border"

//=============================================================================================
// Tip Panel
//=============================================================================================
create panel "player_tip_box" 120 618
	set _width 450
	set _height 32

	create label "player_tip_text" 28 7 [_width - 32] [_height]
		param cvar cl_tip_text
		param char_height 16
		param align left

	set _border 4
	set _x 0
	set _y 0
	set _image thin
	exec ui_frame.cfg

	create graphic exclamation 0 0 32 32
		param image "/textures/xr/misc/tip.s2g"
		param interactive 1

	create graphic background 0 0 [_width] [_height]
		param image /gui/standard/black.s2g
		param alpha .8
		param color 0.1 0.1 0.1

//===========================