ask iskeydown shift
if [answer] goto togglereverse

ask isVisible commander_manage_panel
if [answer] "~
	ask isVisible commander_manage_panel:next_page;~
	if [answer] show commander_manage_panel2;~
	if [answer] refreshManageScreen;~
	if [!answer] cl_requestScores 0;~
	hide commander_manage_panel"
else "~
	ask isVisible commander_manage_panel2;~
	if [answer] cl_requestScores 0;~
	if [answer] hide commander_manage_panel2;~
	if [!answer] show commander_manage_panel;~
	if [!answer] cl_requestScores 1;~
	if [!answer] refreshManageScreen"
goto end

@togglereverse
ask isVisible commander_manage_panel2
if [answer] "~
	show commander_manage_panel;~
	refreshManageScreen;~
	hide commander_manage_panel2"
else "~
	ask isVisible commander_manage_panel;~
	if [answer] cl_requestScores 0;~
	if [answer] hide commander_manage_panel;~
	if [!answer] show commander_manage_panel2;~
	if [!answer] cl_requestScores 1;~
	if [!answer] refreshManageScreen"

@end
