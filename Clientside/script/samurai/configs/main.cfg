//============================
// Resources
//
// Syntax: addResource <name> <descriptive name> <red> <green> <blue> <icon file>
// RGB value indicates color associated with resource
//============================
addResource "NULL" "null resource" 0.00 0.00 0.00
addResource "stone" "Red Stone" 1.00 0.00 0.00
addResource "gold" "Gold" 1.00 1.00 0.00
addResource "heal" "Healing mana" 0.00 1.00 0.00
addResource "wind" "Wind mana" 0.00 1.00 1.00
addResource "war" "War mana" 1.00 0.00 0.00
addResource "RANGED" "Ranged combat" 1.00 1.00 1.00
addResource "SWORD" "Sword combat" 1.00 1.00 1.00
addResource "POLE" "Polearm combat" 1.00 1.00 1.00

//============================
// Races
//============================`
raceEdit new
raceSet name "human"
raceSet description "Shogunate"
raceSet baseBuilding "human_castle"
raceSet resources +stone +gold +heal +wind +war
raceSet currency "gold"
raceSet officerState "officer"
raceSet ammoDrop ammo_box
raceActivate

setGoodieBag "goodiebag"
